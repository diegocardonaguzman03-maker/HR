<text x="500.0" y="26" font-size="16" text-anchor="middle" fill="#212121" font-weight="bold">Figura 1. IT-ACE-S12 — Mi área de trabajo: púlpito de colada (CC1 y CC2)</text>
<text x="500.0" y="46" font-size="12" text-anchor="middle" fill="#212121">Vista en planta esquemática, sin escala. El púlpito es refugio. Distancias de zona según MS-ACE-01 [Supuesto — Validar con C-16].</text>
