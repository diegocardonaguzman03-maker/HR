<text x="235" y="352" font-size="12" text-anchor="start" fill="#212121">Puerta y escalera</text>
<rect x="40" y="462" width="920" height="118" rx="6" fill="#FFFFFF" stroke="#455A64" stroke-width="1.5"/>
<text x="60" y="482" font-size="13" text-anchor="start" fill="#212121" font-weight="bold">Diferencias que veo en mis pantallas</text>
<text x="60" y="502" font-size="12" text-anchor="start" fill="#212121" font-weight="bold"></text>
<text x="200" y="502" font-size="12" text-anchor="start" fill="#212121" font-weight="bold">CC1 planchón (1 línea)</text>
<text x="560" y="502" font-size="12" text-anchor="start" fill="#212121" font-weight="bold">CC2 palanquilla (6 líneas)</text>
<text x="60" y="518" font-size="12" text-anchor="start" fill="#212121" font-weight="bold">Velocidad</text>
<text x="200" y="518" font-size="12" text-anchor="start" fill="#212121">0.8–1.6 m/min (nominal 1.2)</text>
<text x="560" y="518" font-size="12" text-anchor="start" fill="#212121">2.5–3.5 m/min (nominal 3.0)</text>
<text x="60" y="534" font-size="12" text-anchor="start" fill="#212121" font-weight="bold">Nivel de molde</text>
<text x="200" y="534" font-size="12" text-anchor="start" fill="#212121">Eddy current: ±3 mm; alarma ±8 mm</text>
<text x="560" y="534" font-size="12" text-anchor="start" fill="#212121">Radiométrico Cs-137: ±5 mm; alarma ±10 mm</text>
<text x="60" y="550" font-size="12" text-anchor="start" fill="#212121" font-weight="bold">Agua de molde</text>
<text x="200" y="550" font-size="12" text-anchor="start" fill="#212121">ΔT 6–9 °C; alarma &gt; 11 °C o caudal &lt; 90%</text>
<text x="560" y="550" font-size="12" text-anchor="start" fill="#212121">ΔT 6–10 °C; alarma &gt; 12 °C o caudal &lt; 90%</text>
<text x="60" y="566" font-size="12" text-anchor="start" fill="#212121" font-weight="bold">Protección</text>
<text x="200" y="566" font-size="12" text-anchor="start" fill="#212121">BOP: termopares en 3 filas (sticker)</text>
<text x="560" y="566" font-size="12" text-anchor="start" fill="#212121">ΔT y caudal por línea; EMS 250–400 A</text>
<text x="40" y="606" font-size="12" text-anchor="start" fill="#212121" font-weight="bold">Zonas:</text><rect x="95" y="595" width="26" height="14" rx="3" fill="#C62828" stroke="#C62828" stroke-width="1" fill-opacity="0.16" stroke-dasharray="6 4"/><text x="126" y="606" font-size="12" text-anchor="start" fill="#212121">Roja: solo personal nombrado</text><rect x="320" y="595" width="26" height="14" rx="3" fill="#FBC02D" stroke="#FBC02D" stroke-width="1" fill-opacity="0.22" stroke-dasharray="6 4"/><text x="351" y="606" font-size="12" text-anchor="start" fill="#212121">Amarilla: con EPP de zona, sin detenerse</text><rect x="610" y="595" width="26" height="14" rx="3" fill="#43A047" stroke="#43A047" stroke-width="1" fill-opacity="0.16" stroke-dasharray="6 4"/><text x="641" y="606" font-size="12" text-anchor="start" fill="#212121">Verde: segura</text><line x1="740" y1="602" x2="780" y2="602" stroke="#2E7D32" stroke-width="3" stroke-dasharray="10 5" marker-end="url(#flecha)"/><text x="786" y="606" font-size="12" text-anchor="start" fill="#212121">Ruta de escape</text><rect x="884" y="590" width="32" height="24" rx="4" fill="#2E7D32" stroke="none" stroke-width="1"/><text x="900" y="607" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">R</text><text x="920" y="606" font-size="12" text-anchor="start" fill="#212121">Refugio</text>
<text x="40" y="636" font-size="13" text-anchor="start" fill="#212121" font-weight="bold">Leyenda</text><circle cx="50" cy="652" r="11" fill="#212121" stroke="none" stroke-width="1"/><text x="50" y="656" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text><text x="68" y="656" font-size="12" text-anchor="start" fill="#212121">Consola de velocidad y nivel de molde</text><circle cx="50" cy="670" r="11" fill="#212121" stroke="none" stroke-width="1"/><text x="50" y="674" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text><text x="68" y="674" font-size="12" text-anchor="start" fill="#212121">Agua de molde: caudal y ΔT</text><circle cx="50" cy="688" r="11" fill="#212121" stroke="none" stroke-width="1"/><text x="50" y="692" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text><text x="68" y="692" font-size="12" text-anchor="start" fill="#212121">CC1: BOP · CC2: nivel radiométrico y obturador</text><circle cx="50" cy="706" r="11" fill="#212121" stroke="none" stroke-width="1"/><text x="50" y="710" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text><text x="68" y="710" font-size="12" text-anchor="start" fill="#212121">Enfriamiento secundario; segmentos o líneas</text><circle cx="50" cy="724" r="11" fill="#212121" stroke="none" stroke-width="1"/><text x="50" y="728" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text><text x="68" y="728" font-size="12" text-anchor="start" fill="#212121">Agua de emergencia: torre + diésel, ≤ 15 s</text><circle cx="520" cy="652" r="11" fill="#212121" stroke="none" stroke-width="1"/><text x="520" y="656" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">6</text><text x="538" y="656" font-size="12" text-anchor="start" fill="#212121">Radio (canal 1 = emergencia) y paro de colada</text><circle cx="520" cy="670" r="11" fill="#212121" stroke="none" stroke-width="1"/><text x="520" y="674" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">7</text><text x="538" y="674" font-size="12" text-anchor="start" fill="#212121">Torreta con 2 ollas</text><circle cx="520" cy="688" r="11" fill="#212121" stroke="none" stroke-width="1"/><text x="520" y="692" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">8</text><text x="538" y="692" font-size="12" text-anchor="start" fill="#212121">Distribuidor</text><circle cx="520" cy="706" r="11" fill="#212121" stroke="none" stroke-width="1"/><text x="520" y="710" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">9</text><text x="538" y="710" font-size="12" text-anchor="start" fill="#212121">Molde (CC1: 1 · CC2: 6)</text><circle cx="520" cy="724" r="11" fill="#212121" stroke="none" stroke-width="1"/><text x="520" y="728" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">10</text><text x="538" y="728" font-size="12" text-anchor="start" fill="#212121">Punto de reunión PR3 (CC1 y CC2)</text>
