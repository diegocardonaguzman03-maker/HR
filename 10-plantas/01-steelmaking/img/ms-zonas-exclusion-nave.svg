<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#C62828" fill-opacity="0.15"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#C62828" stroke-width="2" stroke-opacity="0.6"/>
    </pattern>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E65100"/>
    </marker>
  </defs>

  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">Figura 1. Planta de la nave de Acería: zonas de exclusión, rutas de escape y refugios</text>
  <text x="500" y="46" text-anchor="middle" font-size="12" fill="#212121">Esquemático (sin escala real). Escala de referencia de las zonas: 30 px = 10 m. Distancias [Supuesto — Validar con C-16 / estudio de la nave]</text>

  <!-- Edificio -->
  <rect x="20" y="70" width="960" height="430" fill="none" stroke="#455A64" stroke-width="3"/>
  <line x1="200" y1="70" x2="200" y2="500" stroke="#455A64" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="460" y1="70" x2="460" y2="500" stroke="#455A64" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="660" y1="70" x2="660" y2="500" stroke="#455A64" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="660" y1="285" x2="980" y2="285" stroke="#455A64" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="110" y="88" text-anchor="middle" font-weight="bold" fill="#455A64">PATIO DE CHATARRA</text>
  <text x="330" y="88" text-anchor="middle" font-weight="bold" fill="#455A64">NAVE DE HORNOS</text>
  <text x="560" y="88" text-anchor="middle" font-weight="bold" fill="#455A64">NAVE DE OLLAS / LF</text>
  <text x="820" y="88" text-anchor="middle" font-weight="bold" fill="#455A64">CC1 — PLANCHÓN</text>
  <text x="820" y="303" text-anchor="middle" font-weight="bold" fill="#455A64">CC2 — PALANQUILLA (6 líneas)</text>

  <!-- Salidas (huecos en muro) -->
  <rect x="235" y="494" width="40" height="12" fill="#43A047"/>
  <rect x="540" y="494" width="40" height="12" fill="#43A047"/>
  <rect x="800" y="494" width="40" height="12" fill="#43A047"/>
  <rect x="540" y="64" width="40" height="12" fill="#43A047"/>
  <rect x="14" y="380" width="12" height="40" fill="#43A047"/>

  <!-- PATIO -->
  <rect x="40" y="130" width="50" height="35" fill="#8D6E63" stroke="#455A64"/>
  <rect x="110" y="130" width="50" height="35" fill="#8D6E63" stroke="#455A64"/>
  <rect x="40" y="200" width="50" height="35" fill="#8D6E63" stroke="#455A64"/>
  <text x="100" y="185" text-anchor="middle" font-size="12" fill="#212121">pilas de chatarra</text>
  <rect x="60" y="260" width="80" height="60" fill="url(#hatchRed)" stroke="#C62828" stroke-width="1.5"/>
  <circle cx="100" cy="290" r="14" fill="#455A64"/>
  <text x="100" y="335" text-anchor="middle" font-size="12" fill="#C62828">bajo electroimán</text>
  <rect x="40" y="440" width="90" height="30" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/>
  <line x1="45" y1="440" x2="45" y2="470" stroke="#C62828" stroke-width="3"/>
  <line x1="125" y1="440" x2="125" y2="470" stroke="#C62828" stroke-width="3"/>
  <text x="85" y="460" text-anchor="middle" font-size="12" fill="#212121">camiones</text>

  <!-- NAVE DE HORNOS: zonas EAF-1 -->
  <circle cx="350" cy="175" r="75" fill="#FBC02D" fill-opacity="0.30" stroke="#F9A825" stroke-width="1.5"/>
  <circle cx="350" cy="175" r="30" fill="#C62828" fill-opacity="0.40" stroke="#C62828" stroke-width="2"/>
  <circle cx="310" cy="175" r="14" fill="#455A64" stroke="#212121"/>
  <text x="310" y="179" text-anchor="middle" font-size="12" fill="#ffffff">E1</text>
  <circle cx="352" cy="175" r="8" fill="#E65100" stroke="#212121"/>
  <!-- zonas EAF-2 -->
  <circle cx="350" cy="395" r="75" fill="#FBC02D" fill-opacity="0.30" stroke="#F9A825" stroke-width="1.5"/>
  <circle cx="350" cy="395" r="30" fill="#C62828" fill-opacity="0.40" stroke="#C62828" stroke-width="2"/>
  <circle cx="310" cy="395" r="14" fill="#455A64" stroke="#212121"/>
  <text x="310" y="399" text-anchor="middle" font-size="12" fill="#ffffff">E2</text>
  <circle cx="352" cy="395" r="8" fill="#E65100" stroke="#212121"/>
  <!-- cotas -->
  <line x1="352" y1="175" x2="380" y2="175" stroke="#212121" stroke-width="1"/>
  <text x="366" y="170" text-anchor="middle" font-size="12" fill="#212121">10 m</text>
  <line x1="352" y1="190" x2="352" y2="248" stroke="#212121" stroke-width="1"/>
  <text x="357" y="238" font-size="12" fill="#212121">25 m</text>
  <!-- púlpitos -->
  <rect x="215" y="100" width="40" height="22" fill="#43A047" stroke="#1B5E20"/>
  <text x="235" y="115" text-anchor="middle" font-size="12" fill="#ffffff">P</text>
  <rect x="215" y="470" width="40" height="22" fill="#43A047" stroke="#1B5E20"/>
  <text x="235" y="485" text-anchor="middle" font-size="12" fill="#ffffff">P</text>

  <!-- NAVE DE OLLAS -->
  <!-- rutas de olla: bandas amarilla y roja -->
  <path d="M352,175 L560,175 L710,160" fill="none" stroke="#FBC02D" stroke-opacity="0.35" stroke-width="90"/>
  <path d="M352,395 L560,395 L710,390" fill="none" stroke="#FBC02D" stroke-opacity="0.35" stroke-width="90"/>
  <path d="M352,175 L560,175 L710,160" fill="none" stroke="#C62828" stroke-opacity="0.35" stroke-width="30"/>
  <path d="M352,395 L560,395 L710,390" fill="none" stroke="#C62828" stroke-opacity="0.35" stroke-width="30"/>
  <path d="M362,175 L560,175 L700,161" fill="none" stroke="#E65100" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#arrO)"/>
  <path d="M362,395 L560,395 L700,390" fill="none" stroke="#E65100" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#arrO)"/>
  <rect x="540" y="150" width="40" height="50" fill="#455A64" stroke="#212121"/>
  <text x="560" y="179" text-anchor="middle" font-size="12" fill="#ffffff">LF-1</text>
  <rect x="540" y="370" width="40" height="50" fill="#455A64" stroke="#212121"/>
  <text x="560" y="399" text-anchor="middle" font-size="12" fill="#ffffff">LF-2</text>
  <!-- fosa de emergencia -->
  <rect x="585" y="262" width="60" height="36" fill="#6D4C41" stroke="#212121"/>
  <text x="615" y="284" text-anchor="middle" font-size="12" fill="#ffffff">FOSA</text>
  <!-- cota banda -->
  <line x1="470" y1="160" x2="470" y2="190" stroke="#212121" stroke-width="1"/>
  <text x="474" y="148" font-size="12" fill="#212121">±5 m</text>
  <line x1="490" y1="130" x2="490" y2="220" stroke="#212121" stroke-width="1"/>
  <text x="494" y="232" font-size="12" fill="#212121">±15 m</text>

  <!-- CC1 -->
  <rect x="680" y="115" width="115" height="90" fill="#C62828" fill-opacity="0.40" stroke="#C62828" stroke-width="2"/>
  <rect x="665" y="100" width="145" height="120" fill="none" stroke="#F9A825" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="795" y="140" width="170" height="40" fill="url(#hatchRed)" stroke="#C62828"/>
  <circle cx="710" cy="160" r="22" fill="none" stroke="#455A64" stroke-width="3"/>
  <circle cx="710" cy="146" r="8" fill="#E65100" stroke="#212121"/>
  <circle cx="710" cy="174" r="8" fill="#FF8F00" stroke="#212121"/>
  <rect x="740" y="150" width="34" height="20" fill="#8D6E63" stroke="#212121"/>
  <line x1="774" y1="160" x2="965" y2="160" stroke="#455A64" stroke-width="8"/>
  <text x="880" y="198" text-anchor="middle" font-size="12" fill="#C62828">bajo la máquina: roja en arranque</text>
  <rect x="870" y="235" width="40" height="22" fill="#43A047" stroke="#1B5E20"/>
  <text x="890" y="250" text-anchor="middle" font-size="12" fill="#ffffff">P</text>

  <!-- CC2 -->
  <rect x="680" y="335" width="115" height="115" fill="#C62828" fill-opacity="0.40" stroke="#C62828" stroke-width="2"/>
  <rect x="665" y="320" width="145" height="145" fill="none" stroke="#F9A825" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="795" y="345" width="170" height="95" fill="url(#hatchRed)" stroke="#C62828"/>
  <circle cx="710" cy="392" r="22" fill="none" stroke="#455A64" stroke-width="3"/>
  <circle cx="710" cy="378" r="8" fill="#E65100" stroke="#212121"/>
  <circle cx="710" cy="406" r="8" fill="#FF8F00" stroke="#212121"/>
  <rect x="742" y="350" width="22" height="86" fill="#8D6E63" stroke="#212121"/>
  <line x1="764" y1="355" x2="965" y2="355" stroke="#455A64" stroke-width="4"/>
  <line x1="764" y1="371" x2="965" y2="371" stroke="#455A64" stroke-width="4"/>
  <line x1="764" y1="387" x2="965" y2="387" stroke="#455A64" stroke-width="4"/>
  <line x1="764" y1="403" x2="965" y2="403" stroke="#455A64" stroke-width="4"/>
  <line x1="764" y1="419" x2="965" y2="419" stroke="#455A64" stroke-width="4"/>
  <line x1="764" y1="435" x2="965" y2="435" stroke="#455A64" stroke-width="4"/>
  <rect x="870" y="465" width="40" height="22" fill="#43A047" stroke="#1B5E20"/>
  <text x="890" y="480" text-anchor="middle" font-size="12" fill="#ffffff">P</text>

  <!-- Refugios -->
  <rect x="215" y="275" width="34" height="24" fill="#2E7D32" stroke="#1B5E20"/>
  <text x="232" y="291" text-anchor="middle" font-size="12" fill="#ffffff">R1</text>
  <rect x="470" y="275" width="34" height="24" fill="#2E7D32" stroke="#1B5E20"/>
  <text x="487" y="291" text-anchor="middle" font-size="12" fill="#ffffff">R2</text>
  <rect x="675" y="250" width="34" height="24" fill="#2E7D32" stroke="#1B5E20"/>
  <text x="692" y="266" text-anchor="middle" font-size="12" fill="#ffffff">R3</text>
  <rect x="675" y="470" width="34" height="24" fill="#2E7D32" stroke="#1B5E20"/>
  <text x="692" y="486" text-anchor="middle" font-size="12" fill="#ffffff">R4</text>

  <!-- Rutas de escape -->
  <path d="M232,299 L255,340 L255,488" fill="none" stroke="#2E7D32" stroke-width="3" marker-end="url(#arrG)"/>
  <path d="M487,299 L560,330 L560,488" fill="none" stroke="#2E7D32" stroke-width="3" marker-end="url(#arrG)"/>
  <path d="M709,262 L820,262 L820,488" fill="none" stroke="#2E7D32" stroke-width="3" marker-end="url(#arrG)"/>
  <path d="M100,340 L60,400 L32,400" fill="none" stroke="#2E7D32" stroke-width="3" marker-end="url(#arrG)"/>

  <!-- Puntos de reunión -->
  <circle cx="255" cy="535" r="16" fill="#43A047" stroke="#1B5E20" stroke-width="2"/>
  <text x="255" y="539" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">PR1</text>
  <circle cx="560" cy="535" r="16" fill="#43A047" stroke="#1B5E20" stroke-width="2"/>
  <text x="560" y="539" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">PR2</text>
  <circle cx="820" cy="535" r="16" fill="#43A047" stroke="#1B5E20" stroke-width="2"/>
  <text x="820" y="539" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">PR3</text>
  <line x1="255" y1="506" x2="255" y2="519" stroke="#2E7D32" stroke-width="3"/>
  <line x1="560" y1="506" x2="560" y2="519" stroke="#2E7D32" stroke-width="3"/>
  <line x1="820" y1="506" x2="820" y2="519" stroke="#2E7D32" stroke-width="3"/>

  <!-- Marcadores numerados -->
  <g font-size="12" font-weight="bold" fill="#ffffff">
    <circle cx="85" cy="425" r="10" fill="#212121"/><text x="85" y="429" text-anchor="middle">1</text>
    <circle cx="150" cy="290" r="10" fill="#212121"/><text x="150" y="294" text-anchor="middle">2</text>
    <circle cx="290" cy="150" r="10" fill="#212121"/><text x="290" y="154" text-anchor="middle">3</text>
    <circle cx="372" cy="130" r="10" fill="#212121"/><text x="372" y="134" text-anchor="middle">4</text>
    <circle cx="620" cy="140" r="10" fill="#212121"/><text x="620" y="144" text-anchor="middle">5</text>
    <circle cx="615" cy="315" r="10" fill="#212121"/><text x="615" y="319" text-anchor="middle">6</text>
    <circle cx="690" cy="128" r="10" fill="#212121"/><text x="690" y="132" text-anchor="middle">7</text>
    <circle cx="930" cy="125" r="10" fill="#212121"/><text x="930" y="129" text-anchor="middle">8</text>
    <circle cx="690" cy="345" r="10" fill="#212121"/><text x="690" y="349" text-anchor="middle">9</text>
    <circle cx="235" cy="138" r="10" fill="#212121"/><text x="235" y="142" text-anchor="middle">10</text>
    <circle cx="263" cy="287" r="10" fill="#212121"/><text x="263" y="291" text-anchor="middle">11</text>
    <circle cx="285" cy="535" r="10" fill="#212121"/><text x="285" y="539" text-anchor="middle">12</text>
  </g>

  <!-- Leyenda -->
  <rect x="20" y="565" width="960" height="285" fill="#FAFAFA" stroke="#455A64"/>
  <text x="35" y="587" font-size="14" font-weight="bold" fill="#212121">Leyenda</text>
  <g font-size="12" fill="#212121">
    <text x="35" y="607">1  Pórtico detector de radiación (entrada de camiones) — ver MS-ACE-07</text>
    <text x="35" y="625">2  Zona bajo electroimán / carga de canasta: nadie bajo la carga (roja)</text>
    <text x="35" y="643">3  EAF-1 / EAF-2 (E1, E2), coraza de 7.3 m</text>
    <text x="35" y="661">4  Olla bajo el EBT: roja ≤ 10 m; amarilla 10–25 m (vaciado)</text>
    <text x="35" y="679">5  Ruta de ollas llenas (carro y grúa de colada 250 t)</text>
    <text x="35" y="697">6  Fosa de emergencia seca (vaciado de olla perforada)</text>
    <text x="35" y="715">7  Torreta, distribuidor y molde CC1: roja ≤ 10 m en arranque</text>
    <text x="35" y="733">8  Bajo la máquina (segmentos, cámara de rociado): roja en arranque</text>
    <text x="35" y="751">9  Torreta, distribuidor y 6 moldes CC2 (fuente Cs-137 en cada molde)</text>
    <text x="35" y="769">10 Púlpito (P): refugio protegido contra salpicaduras</text>
    <text x="35" y="787">11 Refugio (R1–R4): cabina resistente al calor, con aire respirable</text>
    <text x="35" y="805">12 Punto de reunión (PR1 hornos y patio, PR2 ollas/LF, PR3 CC1/CC2)</text>
  </g>
  <rect x="530" y="580" width="18" height="14" fill="#C62828" fill-opacity="0.45" stroke="#C62828"/>
  <text x="555" y="592" font-size="12" fill="#212121">ROJA: solo personal esencial autorizado, con EPP aluminizado</text>
  <rect x="530" y="600" width="18" height="14" fill="#FBC02D" fill-opacity="0.45" stroke="#F9A825"/>
  <text x="555" y="612" font-size="12" fill="#212121">AMARILLA: personal autorizado, tras barrera, EPP completo</text>
  <rect x="530" y="620" width="18" height="14" fill="#43A047" fill-opacity="0.45" stroke="#2E7D32"/>
  <text x="555" y="632" font-size="12" fill="#212121">VERDE: tránsito normal con EPP básico de nave</text>
  <line x1="530" y1="648" x2="548" y2="648" stroke="#2E7D32" stroke-width="3"/>
  <text x="555" y="652" font-size="12" fill="#212121">Ruta de escape → salida (rectángulo verde en el muro)</text>
  <text x="530" y="678" font-size="13" font-weight="bold" fill="#212121">Distancias por operación (desde la fuente de metal líquido)</text>
  <g font-size="12" fill="#212121">
    <text x="530" y="698">Vaciado EBT: roja ≤ 10 m · amarilla 10–25 m · verde &gt; 25 m</text>
    <text x="530" y="716">Carga con canasta: roja ≤ 15 m del horno; plataforma despejada</text>
    <text x="530" y="734">Traslado de olla llena: roja = eje de ruta ± 5 m; amarilla ± 15 m</text>
    <text x="530" y="752">Arranque de CC: roja ≤ 10 m de molde/torreta y bajo la máquina;</text>
    <text x="530" y="770">   amarilla 10–20 m; solo S-12, S-13, S-14 y C-06 en roja</text>
    <text x="530" y="788">Muestreo/temperatura: solo el ejecutor en roja, ≥ 1.5 m de la puerta</text>
    <text x="530" y="806">Tiempo a refugio o zona verde: ≤ 30 s desde cualquier punto de roja</text>
    <text x="530" y="830" fill="#C62828">Valores [Supuesto — Validar con C-16 / SSO con estudio de la nave]</text>
  </g>
</svg>
