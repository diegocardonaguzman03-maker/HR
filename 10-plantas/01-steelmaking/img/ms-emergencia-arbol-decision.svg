<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#212121"/></marker></defs>
  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">Figura 1. Árbol de decisión de emergencias de la Acería (primeros 5 minutos)</text>
  <text x="500" y="46" text-anchor="middle" font-size="12" fill="#212121">Aplica a todos los roles. Detalle en MS-ACE-09. Valores según FT-ACE-001 y MS-ACE-06 [Validar con C-16 / SSO]</text>
  <rect x="350" y="62" width="300" height="34" rx="6" fill="#C62828"/>
  <text x="500" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1. DETECTAS UNA EMERGENCIA</text>
  <line x1="500" y1="96" x2="500" y2="112" stroke="#212121" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="120" y="114" width="360" height="46" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="300" y="133" text-anchor="middle" font-weight="bold" fill="#212121">2. PROTÉGETE: sal a zona verde o refugio</text>
  <text x="300" y="150" text-anchor="middle" fill="#212121">en ≤ 30 s. No regreses por herramientas.</text>
  <rect x="520" y="114" width="360" height="46" rx="6" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="700" y="133" text-anchor="middle" font-weight="bold" fill="#212121">3. DA LA ALARMA: botón + radio canal de emergencia</text>
  <text x="700" y="150" text-anchor="middle" fill="#212121">"EMERGENCIA ×3 · lugar · tipo · personas"</text>
  <line x1="480" y1="137" x2="518" y2="137" stroke="#212121" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="700" y1="160" x2="700" y2="172" stroke="#212121" stroke-width="2"/>
  <line x1="700" y1="172" x2="500" y2="172" stroke="#212121" stroke-width="2"/>
  <line x1="500" y1="172" x2="500" y2="182" stroke="#212121" stroke-width="2" marker-end="url(#ar)"/>
  <polygon points="500,184 600,209 500,234 400,209" fill="#FFF8E1" stroke="#212121" stroke-width="2"/>
  <text x="500" y="213" text-anchor="middle" font-weight="bold" fill="#212121">4. ¿Qué evento es?</text>
  <line x1="100" y1="250" x2="900" y2="250" stroke="#212121" stroke-width="2"/>
  <line x1="500" y1="234" x2="500" y2="250" stroke="#212121" stroke-width="2"/>
  <line x1="100" y1="250" x2="100" y2="262" stroke="#212121" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="5" y="264" width="190" height="46" rx="4" fill="#1E88E5"/>
  <text x="100" y="283" text-anchor="middle" font-weight="bold" fill="#ffffff">A. Fuga de agua en el EAF</text>
  <text x="100" y="300" text-anchor="middle" fill="#ffffff">ΔQ &gt; 2 % alarma · &gt; 4 % disparo</text>
  <rect x="5" y="318" width="190" height="74" rx="4" fill="#FAFAFA" stroke="#1E88E5" stroke-width="2"/>
  <circle cx="17" cy="330" r="9" fill="#1E88E5"/>
  <text x="17" y="334" text-anchor="middle" font-weight="bold" fill="#ffffff">a</text>
  <text x="31" y="335" fill="#212121">Corta el arco o confirma</text>
  <text x="31" y="350" fill="#212121">el disparo. NO basculees</text>
  <text x="31" y="365" fill="#212121">el horno ni muevas</text>
  <text x="31" y="380" fill="#212121">electrodos.</text>
  <line x1="100" y1="392" x2="100" y2="402" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="5" y="404" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#1E88E5" stroke-width="2"/>
  <circle cx="17" cy="416" r="9" fill="#1E88E5"/>
  <text x="17" y="420" text-anchor="middle" font-weight="bold" fill="#ffffff">b</text>
  <text x="31" y="421" fill="#212121">Evacúa la plataforma y la</text>
  <text x="31" y="436" fill="#212121">zona ≤ 25 m. Nadie frente</text>
  <text x="31" y="451" fill="#212121">a la puerta ni al EBT.</text>
  <line x1="100" y1="463" x2="100" y2="473" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="5" y="475" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#1E88E5" stroke-width="2"/>
  <circle cx="17" cy="487" r="9" fill="#1E88E5"/>
  <text x="17" y="491" text-anchor="middle" font-weight="bold" fill="#ffffff">c</text>
  <text x="31" y="492" fill="#212121">Cierra el agua del panel</text>
  <text x="31" y="507" fill="#212121">con fuga solo por mando</text>
  <text x="31" y="522" fill="#212121">remoto o si es seguro.</text>
  <line x1="100" y1="534" x2="100" y2="544" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="5" y="546" width="190" height="74" rx="4" fill="#FAFAFA" stroke="#1E88E5" stroke-width="2"/>
  <circle cx="17" cy="558" r="9" fill="#1E88E5"/>
  <text x="17" y="562" text-anchor="middle" font-weight="bold" fill="#ffffff">d</text>
  <text x="31" y="563" fill="#212121">Espera a que evapore: sin</text>
  <text x="31" y="578" fill="#212121">vapor ≥ 30 min [Supuesto].</text>
  <text x="31" y="593" fill="#212121">Reanuda solo con OK de</text>
  <text x="31" y="608" fill="#212121">C-05 y C-07.</text>
  <line x1="100" y1="620" x2="100" y2="648" stroke="#212121" stroke-width="1.5"/>
  <line x1="300" y1="250" x2="300" y2="262" stroke="#212121" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="205" y="264" width="190" height="46" rx="4" fill="#E65100"/>
  <text x="300" y="283" text-anchor="middle" font-weight="bold" fill="#ffffff">B. Perforación de olla</text>
  <text x="300" y="300" text-anchor="middle" fill="#ffffff">punto rojo, humo, fuga</text>
  <rect x="205" y="318" width="190" height="74" rx="4" fill="#FAFAFA" stroke="#E65100" stroke-width="2"/>
  <circle cx="217" cy="330" r="9" fill="#E65100"/>
  <text x="217" y="334" text-anchor="middle" font-weight="bold" fill="#ffffff">a</text>
  <text x="231" y="335" fill="#212121">En grúa: lleva la olla a</text>
  <text x="231" y="350" fill="#212121">la fosa de emergencia</text>
  <text x="231" y="365" fill="#212121">seca, sin pasar sobre</text>
  <text x="231" y="380" fill="#212121">personas, a baja altura.</text>
  <line x1="300" y1="392" x2="300" y2="402" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="205" y="404" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#E65100" stroke-width="2"/>
  <circle cx="217" cy="416" r="9" fill="#E65100"/>
  <text x="217" y="420" text-anchor="middle" font-weight="bold" fill="#ffffff">b</text>
  <text x="231" y="421" fill="#212121">En carro o estación: retira</text>
  <text x="231" y="436" fill="#212121">a todos a ≥ 25 m. NO</text>
  <text x="231" y="451" fill="#212121">intentes taponar.</text>
  <line x1="300" y1="463" x2="300" y2="473" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="205" y="475" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#E65100" stroke-width="2"/>
  <circle cx="217" cy="487" r="9" fill="#E65100"/>
  <text x="217" y="491" text-anchor="middle" font-weight="bold" fill="#ffffff">c</text>
  <text x="231" y="492" fill="#212121">Derrame: NUNCA agua.</text>
  <text x="231" y="507" fill="#212121">Deja solidificar; contén</text>
  <text x="231" y="522" fill="#212121">con arena seca.</text>
  <line x1="300" y1="534" x2="300" y2="544" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="205" y="546" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#E65100" stroke-width="2"/>
  <circle cx="217" cy="558" r="9" fill="#E65100"/>
  <text x="217" y="562" text-anchor="middle" font-weight="bold" fill="#ffffff">d</text>
  <text x="231" y="563" fill="#212121">C-04 cierra la ruta;</text>
  <text x="231" y="578" fill="#212121">S-09 sale de cabina solo</text>
  <text x="231" y="593" fill="#212121">si su vida corre riesgo.</text>
  <line x1="300" y1="605" x2="300" y2="648" stroke="#212121" stroke-width="1.5"/>
  <line x1="500" y1="250" x2="500" y2="262" stroke="#212121" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="405" y="264" width="190" height="46" rx="4" fill="#FF8F00"/>
  <text x="500" y="283" text-anchor="middle" font-weight="bold" fill="#ffffff">C. Breakout en CC</text>
  <text x="500" y="300" text-anchor="middle" fill="#ffffff">alarma BOP / derrame</text>
  <rect x="405" y="318" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#FF8F00" stroke-width="2"/>
  <circle cx="417" cy="330" r="9" fill="#FF8F00"/>
  <text x="417" y="334" text-anchor="middle" font-weight="bold" fill="#ffffff">a</text>
  <text x="431" y="335" fill="#212121">Cierra olla y distribuidor</text>
  <text x="431" y="350" fill="#212121">(barra tapón o buza) y</text>
  <text x="431" y="365" fill="#212121">detén la línea.</text>
  <line x1="500" y1="377" x2="500" y2="387" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="405" y="389" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#FF8F00" stroke-width="2"/>
  <circle cx="417" cy="401" r="9" fill="#FF8F00"/>
  <text x="417" y="405" text-anchor="middle" font-weight="bold" fill="#ffffff">b</text>
  <text x="431" y="406" fill="#212121">Mantén agua de molde y</text>
  <text x="431" y="421" fill="#212121">secundaria. Evacúa bajo</text>
  <text x="431" y="436" fill="#212121">la máquina y a ≥ 20 m.</text>
  <line x1="500" y1="448" x2="500" y2="458" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="405" y="460" width="190" height="74" rx="4" fill="#FAFAFA" stroke="#FF8F00" stroke-width="2"/>
  <circle cx="417" cy="472" r="9" fill="#FF8F00"/>
  <text x="417" y="476" text-anchor="middle" font-weight="bold" fill="#ffffff">c</text>
  <text x="431" y="477" fill="#212121">Desvía el distribuidor a</text>
  <text x="431" y="492" fill="#212121">la caja de emergencia.</text>
  <text x="431" y="507" fill="#212121">Nadie en la cámara de</text>
  <text x="431" y="522" fill="#212121">rociado.</text>
  <line x1="500" y1="534" x2="500" y2="544" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="405" y="546" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#FF8F00" stroke-width="2"/>
  <circle cx="417" cy="558" r="9" fill="#FF8F00"/>
  <text x="417" y="562" text-anchor="middle" font-weight="bold" fill="#ffffff">d</text>
  <text x="431" y="563" fill="#212121">Reingreso solo con acero</text>
  <text x="431" y="578" fill="#212121">sólido y LOTO</text>
  <text x="431" y="593" fill="#212121">(MS-ACE-02).</text>
  <line x1="500" y1="605" x2="500" y2="648" stroke="#212121" stroke-width="1.5"/>
  <line x1="700" y1="250" x2="700" y2="262" stroke="#212121" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="605" y="264" width="190" height="46" rx="4" fill="#455A64"/>
  <text x="700" y="283" text-anchor="middle" font-weight="bold" fill="#ffffff">D. Sin agua de molde/apagón</text>
  <text x="700" y="300" text-anchor="middle" fill="#ffffff">caudal &lt; 90 % o ΔT alto</text>
  <rect x="605" y="318" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#455A64" stroke-width="2"/>
  <circle cx="617" cy="330" r="9" fill="#455A64"/>
  <text x="617" y="334" text-anchor="middle" font-weight="bold" fill="#ffffff">a</text>
  <text x="631" y="335" fill="#212121">Verifica que entra el agua</text>
  <text x="631" y="350" fill="#212121">de emergencia en ≤ 15 s</text>
  <text x="631" y="365" fill="#212121">(torre + bombas diésel).</text>
  <line x1="700" y1="377" x2="700" y2="387" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="605" y="389" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#455A64" stroke-width="2"/>
  <circle cx="617" cy="401" r="9" fill="#455A64"/>
  <text x="617" y="405" text-anchor="middle" font-weight="bold" fill="#ffffff">b</text>
  <text x="631" y="406" fill="#212121">Si no entra en 15 s:</text>
  <text x="631" y="421" fill="#212121">cierra olla y distribuidor</text>
  <text x="631" y="436" fill="#212121">de inmediato.</text>
  <line x1="700" y1="448" x2="700" y2="458" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="605" y="460" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#455A64" stroke-width="2"/>
  <circle cx="617" cy="472" r="9" fill="#455A64"/>
  <text x="617" y="476" text-anchor="middle" font-weight="bold" fill="#ffffff">c</text>
  <text x="631" y="477" fill="#212121">Evacúa la plataforma de</text>
  <text x="631" y="492" fill="#212121">molde (≥ 10 m): riesgo</text>
  <text x="631" y="507" fill="#212121">de explosión de vapor.</text>
  <line x1="700" y1="519" x2="700" y2="529" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="605" y="531" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#455A64" stroke-width="2"/>
  <circle cx="617" cy="543" r="9" fill="#455A64"/>
  <text x="617" y="547" text-anchor="middle" font-weight="bold" fill="#ffffff">d</text>
  <text x="631" y="548" fill="#212121">NO metas agua a un molde</text>
  <text x="631" y="563" fill="#212121">sobrecalentado sin OK de</text>
  <text x="631" y="578" fill="#212121">C-06 / C-08.</text>
  <line x1="700" y1="590" x2="700" y2="648" stroke="#212121" stroke-width="1.5"/>
  <line x1="900" y1="250" x2="900" y2="262" stroke="#212121" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="805" y="264" width="190" height="46" rx="4" fill="#43A047"/>
  <text x="900" y="283" text-anchor="middle" font-weight="bold" fill="#ffffff">E. Fuga de gas</text>
  <text x="900" y="300" text-anchor="middle" fill="#ffffff">CO · O₂ · Ar/N₂ · gas natural</text>
  <rect x="805" y="318" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#43A047" stroke-width="2"/>
  <circle cx="817" cy="330" r="9" fill="#43A047"/>
  <text x="817" y="334" text-anchor="middle" font-weight="bold" fill="#ffffff">a</text>
  <text x="831" y="335" fill="#212121">CO ≥ 25 ppm: sal. CO ≥ 200</text>
  <text x="831" y="350" fill="#212121">ppm: evacúa el sector.</text>
  <text x="831" y="365" fill="#212121">GN ≥ 10 % LEL: evacúa.</text>
  <line x1="900" y1="377" x2="900" y2="387" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="805" y="389" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#43A047" stroke-width="2"/>
  <circle cx="817" cy="401" r="9" fill="#43A047"/>
  <text x="817" y="405" text-anchor="middle" font-weight="bold" fill="#ffffff">b</text>
  <text x="831" y="406" fill="#212121">Cierra la válvula de corte</text>
  <text x="831" y="421" fill="#212121">remota. Sin chispas: no</text>
  <text x="831" y="436" fill="#212121">operes interruptores.</text>
  <line x1="900" y1="448" x2="900" y2="458" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="805" y="460" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#43A047" stroke-width="2"/>
  <circle cx="817" cy="472" r="9" fill="#43A047"/>
  <text x="817" y="476" text-anchor="middle" font-weight="bold" fill="#ffffff">c</text>
  <text x="831" y="477" fill="#212121">O₂ &lt; 19.5 % o &gt; 23.5 %:</text>
  <text x="831" y="492" fill="#212121">no entres. Sal contra el</text>
  <text x="831" y="507" fill="#212121">viento por la ruta.</text>
  <line x1="900" y1="519" x2="900" y2="529" stroke="#212121" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="805" y="531" width="190" height="59" rx="4" fill="#FAFAFA" stroke="#43A047" stroke-width="2"/>
  <circle cx="817" cy="543" r="9" fill="#43A047"/>
  <text x="817" y="547" text-anchor="middle" font-weight="bold" fill="#ffffff">d</text>
  <text x="831" y="548" fill="#212121">Reingreso solo brigada</text>
  <text x="831" y="563" fill="#212121">con ERA y medición</text>
  <text x="831" y="578" fill="#212121">continua.</text>
  <line x1="900" y1="590" x2="900" y2="648" stroke="#212121" stroke-width="1.5"/>
  <line x1="100" y1="648" x2="900" y2="648" stroke="#212121" stroke-width="2"/>
  <line x1="500" y1="648" x2="500" y2="660" stroke="#212121" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="30" y="662" width="220" height="62" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="140" y="682" text-anchor="middle" font-weight="bold" fill="#212121">5. C-04 ASUME EL MANDO</text>
  <text x="140" y="699" text-anchor="middle" fill="#212121">Comandante del Incidente;</text>
  <text x="140" y="715" text-anchor="middle" fill="#212121">activa brigadas y médico</text>
  <line x1="250" y1="693" x2="268" y2="693" stroke="#212121" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="270" y="662" width="220" height="62" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="380" y="682" text-anchor="middle" font-weight="bold" fill="#212121">6. EVACUACIÓN Y CONTEO</text>
  <text x="380" y="699" text-anchor="middle" fill="#212121">punto de reunión PR1–PR3;</text>
  <text x="380" y="715" text-anchor="middle" fill="#212121">conteo completo ≤ 10 min</text>
  <line x1="490" y1="693" x2="508" y2="693" stroke="#212121" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="510" y="662" width="220" height="62" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="620" y="682" text-anchor="middle" font-weight="bold" fill="#212121">7. CONTROL Y ESTABILIZACIÓN</text>
  <text x="620" y="699" text-anchor="middle" fill="#212121">solo brigada con EPP/ERA;</text>
  <text x="620" y="715" text-anchor="middle" fill="#212121">C-16 mide atmósfera</text>
  <line x1="730" y1="693" x2="748" y2="693" stroke="#212121" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="750" y="662" width="220" height="62" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="860" y="682" text-anchor="middle" font-weight="bold" fill="#212121">8. CIERRE</text>
  <text x="860" y="699" text-anchor="middle" fill="#212121">preserva la escena; reporte</text>
  <text x="860" y="715" text-anchor="middle" fill="#212121">inicial ≤ 24 h; análisis ICAM</text>
  <rect x="30" y="740" width="940" height="110" fill="#FAFAFA" stroke="#455A64"/>
  <text x="45" y="762" fill="#212121">Leyenda: Pasos 1–4: acciones de quien detecta (cualquier rol). a–d acciones del púlpito y del personal del área (S-01, S-06, S-09, S-12, S-13) guiadas por C-05/C-06.</text>
  <text x="45" y="781" fill="#212121">Pasos 5–8: organización de la respuesta. Colores: agua = azul, metal líquido = naranja, colada = ámbar, energía = gris, gas = verde.</text>
  <text x="45" y="800" fill="#212121">Nunca: usar agua sobre metal líquido · entrar a rescatar sin ERA en atmósfera peligrosa · pasar bajo una olla o cruzar la zona roja.</text>
  <text x="45" y="819" fill="#212121">Puntos de reunión: PR1 hornos y patio, PR2 ollas/LF, PR3 CC1/CC2 (ver Figura de zonas, MS-ACE-01).</text>
  <text x="45" y="838" fill="#212121">ERA = equipo de respiración autónoma · LEL = límite inferior de explosividad · BOP = predicción de breakout · GN = gas natural.</text>
</svg>
