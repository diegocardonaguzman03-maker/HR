<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#C62828" fill-opacity="0.12"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#C62828" stroke-width="2" stroke-opacity="0.55"/>
    </pattern>
    <pattern id="hatchSlag" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="10" height="10" fill="#6D4C41" fill-opacity="0.18"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#6D4C41" stroke-width="2" stroke-opacity="0.5"/>
    </pattern>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E65100"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E88E5"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#212121"/>
    </marker>
  </defs>
  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">Figura IT-S10. Mi área: olla de escoria bajo la puerta del EAF, ruta del portaollas y patio de escoria</text>
  <text x="500" y="46" text-anchor="middle" font-size="12" fill="#212121">Esquemático sin escala, vista en planta. Valores de MO-EAF-05, MS-ACE-01 y MS-ACE-03 [Supuesto — Validar con C-16]</text>
  <rect x="20" y="70" width="560" height="300" fill="none" stroke="#455A64" stroke-width="3"/>
  <text x="300" y="90" font-size="12" fill="#455A64" text-anchor="middle" font-weight="bold">NAVE DE HORNOS</text>
  <rect x="80" y="364" width="40" height="12" fill="#43A047" stroke="#2E7D32" stroke-width="1"/>
  <circle cx="300" cy="215" r="140" fill="#FBC02D" stroke="#F9A825" stroke-width="1.2" fill-opacity="0.28"/>
  <circle cx="300" cy="215" r="75" fill="url(#hatchRed)" stroke="#C62828" stroke-width="1.5"/>
  <circle cx="170" cy="215" r="75" fill="#8D6E63" stroke="#455A64" stroke-width="2"/>
  <circle cx="170" cy="215" r="55" fill="#E65100" stroke="#FF8F00" stroke-width="1"/>
  <text x="170" y="219" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">EAF</text>
  <rect x="240" y="200" width="14" height="30" fill="#455A64" stroke="#263238" stroke-width="1.5"/>
  <rect x="265" y="180" width="80" height="70" fill="none" stroke="#455A64" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="305" cy="215" r="26" fill="#6D4C41" stroke="#3E2723" stroke-width="2"/>
  <text x="305" y="270" font-size="11" fill="#212121" text-anchor="middle">fosa seca</text>
  <text x="300" y="360" font-size="11" fill="#C62828" text-anchor="middle">Puerta: roja ≤ 5 m · amarilla 5–15 m</text>
  <rect x="470" y="110" width="90" height="50" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="515" y="132" font-size="12" fill="#212121" text-anchor="middle" font-weight="bold">LF</text>
  <text x="515" y="148" font-size="10" fill="#212121" text-anchor="middle">escoria</text>
  <path d="M345,215 L620,215 L620,430 L740,430" fill="none" stroke="#9E9E9E" stroke-width="18"/>
  <path d="M345,215 L620,215 L620,430 L735,430" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="10,8" marker-end="url(#arrK)"/>
  <path d="M560,160 L560,205" fill="none" stroke="#212121" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrK)"/>
  <rect x="598" y="300" width="5" height="40" fill="#FFFFFF" stroke="#212121" stroke-width="1"/>
  <rect x="606" y="300" width="5" height="40" fill="#FFFFFF" stroke="#212121" stroke-width="1"/>
  <rect x="614" y="300" width="5" height="40" fill="#FFFFFF" stroke="#212121" stroke-width="1"/>
  <rect x="622" y="300" width="5" height="40" fill="#FFFFFF" stroke="#212121" stroke-width="1"/>
  <rect x="630" y="300" width="5" height="40" fill="#FFFFFF" stroke="#212121" stroke-width="1"/>
  <rect x="638" y="300" width="5" height="40" fill="#FFFFFF" stroke="#212121" stroke-width="1"/>
  <circle cx="670" cy="310" r="9" fill="#C62828" stroke="#212121" stroke-width="1.5"/>
  <circle cx="670" cy="332" r="9" fill="#43A047" stroke="#212121" stroke-width="1.5"/>
  <text x="685" y="318" font-size="11" fill="#212121" text-anchor="start">cruce peatonal:</text>
  <text x="685" y="332" font-size="11" fill="#C62828" text-anchor="start" font-weight="bold">ALTO total</text>
  <rect x="430" y="200" width="60" height="30" fill="#FBC02D" stroke="#212121" stroke-width="2"/>
  <circle cx="440" cy="234" r="6" fill="#212121" stroke="#212121" stroke-width="1.5"/>
  <circle cx="480" cy="234" r="6" fill="#212121" stroke="#212121" stroke-width="1.5"/>
  <text x="460" y="256" font-size="10" fill="#212121" text-anchor="middle">portaollas</text>
  <rect x="650" y="350" width="320" height="150" fill="url(#hatchSlag)" stroke="#6D4C41" stroke-width="2"/>
  <text x="810" y="368" font-size="12" fill="#6D4C41" text-anchor="middle" font-weight="bold">PATIO DE ESCORIA (intemperie)</text>
  <circle cx="860" cy="440" r="70" fill="#FBC02D" stroke="#F9A825" stroke-width="1.2" fill-opacity="0.28"/>
  <circle cx="860" cy="440" r="40" fill="url(#hatchRed)" stroke="#C62828" stroke-width="1.5"/>
  <circle cx="860" cy="440" r="14" fill="#6D4C41" stroke="#3E2723" stroke-width="2"/>
  <text x="860" y="492" font-size="10" fill="#C62828" text-anchor="middle">volteo: roja ≤ 15 m · amarilla 15–30 m</text>
  <ellipse cx="720" cy="470" rx="26" ry="10" fill="#1E88E5" fill-opacity="0.5" stroke="#1E88E5"/>
  <line x1="700" y1="458" x2="740" y2="482" stroke="#C62828" stroke-width="3"/>
  <line x1="740" y1="458" x2="700" y2="482" stroke="#C62828" stroke-width="3"/>
  <rect x="700" y="90" width="250" height="90" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <line x1="700" y1="90" x2="950" y2="90" stroke="#455A64" stroke-width="5"/>
  <circle cx="745" cy="140" r="20" fill="#BCAAA4" stroke="#6D4C41" stroke-width="2"/>
  <circle cx="805" cy="140" r="20" fill="#BCAAA4" stroke="#6D4C41" stroke-width="2"/>
  <circle cx="865" cy="140" r="20" fill="#BCAAA4" stroke="#6D4C41" stroke-width="2"/>
  <text x="825" y="110" font-size="11" fill="#212121" text-anchor="middle">Ollas de escoria vacías bajo techo</text>
  <text x="910" y="145" font-size="11" fill="#212121" text-anchor="start" font-weight="bold">secas</text>
  <rect x="700" y="200" width="140" height="50" fill="#43A047" stroke="#2E7D32" stroke-width="2" fill-opacity="0.2"/>
  <text x="770" y="222" font-size="11" fill="#212121" text-anchor="middle">Inspección pre-uso</text>
  <text x="770" y="238" font-size="11" fill="#212121" text-anchor="middle">portaollas y ollas</text>
  <path d="M120,330 L100,362" fill="none" stroke="#2E7D32" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrG)"/>
  <text x="40" y="395" font-size="11" fill="#2E7D32" text-anchor="start" font-weight="bold">PR1 (nave de hornos y patio)</text>
  <rect x="20" y="540" width="960" height="270" fill="#FAFAFA" stroke="#455A64" stroke-width="1"/>
  <text x="35" y="562" font-size="14" fill="#212121" text-anchor="start" font-weight="bold">Leyenda</text>
  <text x="35" y="582" font-size="12" fill="#212121" text-anchor="start">1  EAF-1 / EAF-2: la escoria espumosa sale por la puerta</text>
  <text x="35" y="600" font-size="12" fill="#212121" text-anchor="start">2  Puerta de escoria: roja ≤ 5 m mientras sale escoria</text>
  <text x="35" y="618" font-size="12" fill="#212121" text-anchor="start">3  Fosa bajo la puerta con olla de escoria (≈ 20 m³ [Supuesto]): SECAS</text>
  <text x="35" y="636" font-size="12" fill="#212121" text-anchor="start">4  Portaollas de escoria: capacidad según placa [Validar con OEM]</text>
  <text x="35" y="654" font-size="12" fill="#212121" text-anchor="start">5  LF: retiro de escoria del horno olla</text>
  <text x="35" y="672" font-size="12" fill="#212121" text-anchor="start">6  Ruta exclusiva del portaollas: luces, alarma y claxon</text>
  <text x="35" y="690" font-size="12" fill="#212121" text-anchor="start">7  Cruce peatonal: alto total ante peatones</text>
  <text x="35" y="708" font-size="12" fill="#212121" text-anchor="start">8  Ollas de escoria vacías: bajo techo, sin agua de lluvia</text>
  <text x="35" y="726" font-size="12" fill="#212121" text-anchor="start">9  Inspección pre-uso: portaollas, olla sin grietas ni escoria en el borde</text>
  <text x="35" y="744" font-size="12" fill="#212121" text-anchor="start">10  Punto de volteo: nadie a pie a ≤ 15 m</text>
  <text x="35" y="762" font-size="12" fill="#212121" text-anchor="start">11  Nunca vacíes sobre charcos, suelo húmedo o escoria regada</text>
  <text x="560" y="562" font-size="13" fill="#212121" text-anchor="start" font-weight="bold">Zonas y valores clave</text>
  <rect x="560" y="574" width="18" height="14" fill="#C62828" stroke="#C62828" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="586" font-size="12" fill="#212121" text-anchor="start">ROJA: solo personal esencial, EPP aluminizado</text>
  <rect x="560" y="594" width="18" height="14" fill="#FBC02D" stroke="#F9A825" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="606" font-size="12" fill="#212121" text-anchor="start">AMARILLA: autorizado, tras barrera, EPP completo</text>
  <rect x="560" y="614" width="18" height="14" fill="#43A047" stroke="#2E7D32" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="626" font-size="12" fill="#212121" text-anchor="start">VERDE: tránsito con EPP básico de nave</text>
  <line x1="560" y1="641" x2="578" y2="641" stroke="#2E7D32" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="585" y="646" font-size="12" fill="#212121" text-anchor="start">Ruta de escape → salida (verde en el muro)</text>
  <text x="560" y="670" font-size="12" fill="#212121" text-anchor="start">Llena la olla de escoria ≤ 80 % [Supuesto]</text>
  <text x="560" y="688" font-size="12" fill="#212121" text-anchor="start">Olla y fosa secas antes de cada desescoriado</text>
  <text x="560" y="706" font-size="12" fill="#212121" text-anchor="start">Escoria a &gt; 1,500 °C: vapor y proyecciones</text>
  <text x="560" y="724" font-size="12" fill="#212121" text-anchor="start">Si ves metal en la olla de escoria: avisa a S-01</text>
  <text x="560" y="742" font-size="12" fill="#212121" text-anchor="start">Olla agrietada o sobrellenada: no se mueve</text>
  <text x="560" y="760" font-size="12" fill="#C62828" text-anchor="start">Agua + escoria líquida = explosión (MS-ACE-03)</text>
  <text x="560" y="778" font-size="12" fill="#C62828" text-anchor="start">Punto de reunión: PR1 (nave de hornos y patio)</text>
  <g font-size="12" font-weight="bold" fill="#ffffff">
    <circle cx="170" cy="140" r="11" fill="#212121"/><text x="170" y="144" text-anchor="middle">1</text>
    <circle cx="254" cy="200" r="11" fill="#212121"/><text x="254" y="204" text-anchor="middle">2</text>
    <circle cx="330" cy="180" r="11" fill="#212121"/><text x="330" y="184" text-anchor="middle">3</text>
    <circle cx="430" cy="200" r="11" fill="#212121"/><text x="430" y="204" text-anchor="middle">4</text>
    <circle cx="470" cy="110" r="11" fill="#212121"/><text x="470" y="114" text-anchor="middle">5</text>
    <circle cx="620" cy="260" r="11" fill="#212121"/><text x="620" y="264" text-anchor="middle">6</text>
    <circle cx="598" cy="300" r="11" fill="#212121"/><text x="598" y="304" text-anchor="middle">7</text>
    <circle cx="700" cy="90" r="11" fill="#212121"/><text x="700" y="94" text-anchor="middle">8</text>
    <circle cx="700" cy="200" r="11" fill="#212121"/><text x="700" y="204" text-anchor="middle">9</text>
    <circle cx="860" cy="405" r="11" fill="#212121"/><text x="860" y="409" text-anchor="middle">10</text>
    <circle cx="700" cy="460" r="11" fill="#212121"/><text x="700" y="464" text-anchor="middle">11</text>
  </g>
</svg>
