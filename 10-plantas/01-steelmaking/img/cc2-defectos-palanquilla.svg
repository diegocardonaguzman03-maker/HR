<ellipse cx="799.7" cy="130.0" rx="3.1" ry="2.4" fill="#212121"/>
<ellipse cx="798.7" cy="141.3" rx="2.6" ry="4.4" fill="#212121"/>
<ellipse cx="933.8" cy="136.4" rx="2.4" ry="2.3" fill="#212121"/>
<ellipse cx="876.2" cy="119.2" rx="3.0" ry="3.6" fill="#212121"/>
<ellipse cx="864.4" cy="245.8" rx="2.7" ry="2.7" fill="#212121"/>
<ellipse cx="937.1" cy="207.9" rx="3.1" ry="3.6" fill="#212121"/>
<ellipse cx="896.0" cy="252.1" rx="4.0" ry="2.4" fill="#212121"/>
<ellipse cx="800.9" cy="143.8" rx="3.9" ry="3.3" fill="#212121"/>
<ellipse cx="900.2" cy="118.7" rx="3.8" ry="2.9" fill="#212121"/>
<ellipse cx="879.8" cy="249.2" rx="2.9" ry="4.5" fill="#212121"/>
<ellipse cx="865.4" cy="248.4" rx="2.1" ry="4.1" fill="#212121"/>
<ellipse cx="801.4" cy="158.2" rx="3.3" ry="2.1" fill="#212121"/>
<text x="868.5" y="189" font-size="11" text-anchor="middle" fill="#212121">poros a 2–15 mm de la piel</text>
<text x="756" y="284" font-size="12" fill="#2E7D32" font-weight="bold">Aceptar: sin poros en la</text>
<text x="756" y="300" font-size="12" fill="#2E7D32" >superficie; macro: ninguno a ≤ 10</text>
<text x="756" y="316" font-size="12" fill="#2E7D32" >mm de la piel</text>
<text x="756" y="336" font-size="12" fill="#EF6C00" font-weight="bold">Retener: ≤ 3 poros por cara,</text>
<text x="756" y="352" font-size="12" fill="#EF6C00" >profundidad ≤ 1 mm</text>
<text x="756" y="372" font-size="12" fill="#C62828" font-weight="bold">Rechazar: sopladuras abiertas o > 3</text>
<text x="756" y="388" font-size="12" fill="#C62828" >por cara</text>
<text x="756" y="408" font-size="12" fill="#212121" font-weight="bold">Causa: O activo alto (desoxidación</text>
<text x="756" y="424" font-size="12" fill="#212121" >baja), aceite húmedo o en exceso,</text>
<text x="756" y="440" font-size="12" fill="#212121" >H₂ / N₂ alto</text>
<rect x="5" y="467" width="245" height="385" fill="#FAFAFA" stroke="#B0BEC5"/>
<circle cx="21" cy="485" r="11" fill="#455A64"/><text x="21" y="489" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<text x="37" y="490" font-size="13.5" font-weight="bold" fill="#212121">Marcas de oscilación profundas</text>
<rect x="27.5" y="517" width="200" height="120" fill="#B0BEC5" stroke="#455A64" stroke-width="2"/>
<path d="M 37.5 517 q 6 60 0 120" stroke="#455A64" stroke-width="3" fill="none"/>
<path d="M 59.5 517 q 6 60 0 120" stroke="#455A64" stroke-width="1" fill="none"/>
<path d="M 81.5 517 q 6 60 0 120" stroke="#455A64" stroke-width="1" fill="none"/>
<path d="M 103.5 517 q 6 60 0 120" stroke="#455A64" stroke-width="1" fill="none"/>
<path d="M 125.5 517 q 6 60 0 120" stroke="#455A64" stroke-width="3" fill="none"/>
<path d="M 147.5 517 q 6 60 0 120" stroke="#455A64" stroke-width="1" fill="none"/>
<path d="M 169.5 517 q 6 60 0 120" stroke="#455A64" stroke-width="1" fill="none"/>
<path d="M 191.5 517 q 6 60 0 120" stroke="#455A64" stroke-width="1" fill="none"/>
<path d="M 213.5 517 q 6 60 0 120" stroke="#455A64" stroke-width="3" fill="none"/>
<text x="127.5" y="655" font-size="11" text-anchor="middle" fill="#212121">cara de la palanquilla (vista lateral) · paso = v / f</text>
<text x="15" y="677" font-size="12" fill="#2E7D32" font-weight="bold">Aceptar: profundidad ≤ 0.6 mm</text>
<text x="15" y="697" font-size="12" fill="#EF6C00" font-weight="bold">Retener: > 0.6 y ≤ 1.0 mm</text>
<text x="15" y="717" font-size="12" fill="#C62828" font-weight="bold">Rechazar: > 1.0 mm o con grieta</text>
<text x="15" y="733" font-size="12" fill="#C62828" >transversal en el fondo</text>
<text x="15" y="753" font-size="12" fill="#212121" font-weight="bold">Causa: carrera o frecuencia fuera</text>
<text x="15" y="769" font-size="12" fill="#212121" >de tabla, nivel inestable, poco</text>
<text x="15" y="785" font-size="12" fill="#212121" >aceite</text>
<rect x="252" y="467" width="245" height="385" fill="#FAFAFA" stroke="#B0BEC5"/>
<circle cx="268" cy="485" r="11" fill="#455A64"/><text x="268" y="489" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text>
<text x="284" y="490" font-size="13.5" font-weight="bold" fill="#212121">Rechupe y porosidad central</text>
<rect x="299.5" y="502.0" width="150" height="150" rx="6" fill="#B0BEC5" stroke="#455A64" stroke-width="2"/>
<polygon points="370.5,561 379.5,569 376.5,591 369.5,583" fill="#212121"/>
<circle cx="372.8" cy="562.4" r="1.2" fill="#212121"/>
<circle cx="355.1" cy="588.8" r="1.2" fill="#212121"/>
