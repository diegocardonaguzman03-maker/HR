<circle cx="391.0" cy="590.1" r="1.6" fill="#212121"/>
<circle cx="370.1" cy="559.6" r="2.0" fill="#212121"/>
<circle cx="355.2" cy="558.0" r="1.3" fill="#212121"/>
<circle cx="359.6" cy="570.0" r="1.1" fill="#212121"/>
<circle cx="352.5" cy="561.7" r="1.2" fill="#212121"/>
<circle cx="374.5" cy="577" r="30" fill="none" stroke="#C62828" stroke-dasharray="4 3"/>
<text x="374.5" y="632" font-size="11" text-anchor="middle" fill="#212121">rechupe + porosidad central (macro)</text>
<text x="262" y="677" font-size="12" fill="#2E7D32" font-weight="bold">Aceptar: grado macro ≤ 1.5</text>
<text x="262" y="697" font-size="12" fill="#EF6C00" font-weight="bold">Retener: grado 2 o rechupe ≤ 3 mm</text>
<text x="262" y="717" font-size="12" fill="#C62828" font-weight="bold">Rechazar: grado ≥ 2.5 o rechupe > 3</text>
<text x="262" y="733" font-size="12" fill="#C62828" >mm</text>
<text x="262" y="753" font-size="12" fill="#212121" font-weight="bold">Causa: sobrecalentamiento > 35 °C,</text>
<text x="262" y="769" font-size="12" fill="#212121" >EMS apagado, velocidad alta, poco</text>
<text x="262" y="785" font-size="12" fill="#212121" >enfriamiento</text>
<rect x="499" y="467" width="245" height="385" fill="#FAFAFA" stroke="#B0BEC5"/>
<circle cx="515" cy="485" r="11" fill="#455A64"/><text x="515" y="489" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text>
<text x="531" y="490" font-size="13.5" font-weight="bold" fill="#212121">Inclusiones de escoria</text>
<rect x="521.5" y="517" width="200" height="120" fill="#B0BEC5" stroke="#455A64" stroke-width="2"/>
<ellipse cx="571.5" cy="557" rx="9" ry="5" fill="#6D4C41" stroke="#212121"/>
<ellipse cx="651.5" cy="592" rx="6" ry="4" fill="#6D4C41" stroke="#212121"/>
<ellipse cx="681.5" cy="547" rx="4" ry="3" fill="#6D4C41" stroke="#212121"/>
<text x="621.5" y="655" font-size="11" text-anchor="middle" fill="#212121">cara de la palanquilla (vista lateral)</text>
<text x="509" y="677" font-size="12" fill="#2E7D32" font-weight="bold">Aceptar: ninguna visible</text>
<text x="509" y="697" font-size="12" fill="#EF6C00" font-weight="bold">Retener: 1–2 inclusiones ≤ 3 mm</text>
<text x="509" y="713" font-size="12" fill="#EF6C00" >(esmerilar)</text>
<text x="509" y="733" font-size="12" fill="#C62828" font-weight="bold">Rechazar: > 3 mm o > 2 por</text>
<text x="509" y="749" font-size="12" fill="#C62828" >palanquilla</text>
<text x="509" y="769" font-size="12" fill="#212121" font-weight="bold">Causa: cambio de olla con nivel</text>
<text x="509" y="785" font-size="12" fill="#212121" >bajo, arrastre de escoria de olla,</text>
<text x="509" y="801" font-size="12" fill="#212121" >chorro abierto (reoxidación)</text>
<rect x="746" y="467" width="245" height="385" fill="#FAFAFA" stroke="#B0BEC5"/>
<circle cx="762" cy="485" r="11" fill="#455A64"/><text x="762" y="489" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">8</text>
<text x="778" y="490" font-size="13.5" font-weight="bold" fill="#212121">Dimensión, rectitud y largo</text>
<path d="M 763.5 587 Q 868.5 547 973.5 587" stroke="#455A64" stroke-width="16" fill="none"/>
<line x1="763.5" y1="587" x2="973.5" y2="587" stroke="#C62828" stroke-dasharray="4 3"/>
<line x1="868.5" y1="567" x2="868.5" y2="587" stroke="#C62828" stroke-width="2"/>
<text x="874.5" y="607" font-size="11" fill="#C62828">flecha</text>
<text x="868.5" y="527" font-size="11" text-anchor="middle" fill="#212121">palanquilla de 12,000 mm (≈ 2.41 t)</text>
<rect x="850.5" y="607.0" width="36" height="36" rx="6" fill="#B0BEC5" stroke="#455A64" stroke-width="2"/>
<text x="894.5" y="629" font-size="11" fill="#212121">160 ± 3</text>
<text x="756" y="677" font-size="12" fill="#2E7D32" font-weight="bold">Aceptar: lado 160 ± 3 mm; flecha ≤</text>
<text x="756" y="693" font-size="12" fill="#2E7D32" >5 mm/m y ≤ 40 mm total; largo</text>
<text x="756" y="709" font-size="12" fill="#2E7D32" >12,000 ± 50 mm</text>
<text x="756" y="729" font-size="12" fill="#EF6C00" font-weight="bold">Retener: fuera de un límite; decide</text>
<text x="756" y="745" font-size="12" fill="#EF6C00" >C-09 con Laminación</text>
<text x="756" y="765" font-size="12" fill="#C62828" font-weight="bold">Rechazar: doblada, torcida o no</text>
<text x="756" y="781" font-size="12" fill="#C62828" >entra al horno de recalentamiento</text>
<text x="756" y="801" font-size="12" fill="#212121" font-weight="bold">Causa: enderezado frío,</text>
<text x="756" y="817" font-size="12" fill="#212121" >enfriamiento desigual en el lecho,</text>
<text x="756" y="833" font-size="12" fill="#212121" >corte fuera de escuadra</text>
<text x="500" y="870" font-size="11.5" text-anchor="middle" fill="#212121">Verde = aceptar · Naranja = retener (decide C-09) · Rojo = rechazar. Nunca liberes una palanquilla con defecto de rechazo sin disposición escrita de C-09.</text>
</svg>