<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500" y="26" font-size="17" font-weight="bold" text-anchor="middle" fill="#212121">Figura 4. CC2 — Defectos de la palanquilla 160 × 160 mm y límites de aceptación</text>
<text x="500" y="46" font-size="12" text-anchor="middle" fill="#212121">Límites de referencia para disposición en planta: TODOS [Validar con Ingeniería de Calidad (C-09) y con Laminación de largos].</text>
<text x="500" y="62" font-size="12" text-anchor="middle" fill="#212121">Macro = ataque ácido del corte transversal (ASTM E381) o impresión de azufre (Baumann). Escala interna de grados 0–4.</text>
<rect x="5" y="74" width="245" height="385" fill="#FAFAFA" stroke="#B0BEC5"/>
<circle cx="21" cy="92" r="11" fill="#455A64"/><text x="21" y="96" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<text x="37" y="97" font-size="13.5" font-weight="bold" fill="#212121">Romboidad</text>
<polygon points="49.5,116 195.5,106 205.5,252 59.5,262" fill="#B0BEC5" stroke="#455A64" stroke-width="2"/>
<line x1="49.5" y1="116" x2="205.5" y2="252" stroke="#C62828" stroke-width="2"/>
<line x1="195.5" y1="106" x2="59.5" y2="262" stroke="#2E7D32" stroke-width="2"/>
<text x="87.5" y="164" font-size="13" font-weight="bold" fill="#C62828">D1</text>
<text x="149.5" y="164" font-size="13" font-weight="bold" fill="#2E7D32">D2</text>
<text x="15" y="284" font-size="12" fill="#212121" >ΔD = D1 − D2 (medir en caliente con</text>
<text x="15" y="300" font-size="12" fill="#212121" >calibrador de diagonales)</text>
<text x="15" y="320" font-size="12" fill="#2E7D32" font-weight="bold">Aceptar: ΔD ≤ 6 mm</text>
<text x="15" y="340" font-size="12" fill="#EF6C00" font-weight="bold">Retener: ΔD > 6 y ≤ 11 mm (≤ 5 %)</text>
<text x="15" y="360" font-size="12" fill="#C62828" font-weight="bold">Rechazar: ΔD > 11 mm (> 5 %)</text>
<text x="15" y="380" font-size="12" fill="#212121" font-weight="bold">Causa: tubo desgastado, agua</text>
<text x="15" y="396" font-size="12" fill="#212121" >desigual, chorro descentrado, pie</text>
<text x="15" y="412" font-size="12" fill="#212121" >de rodillos desalineado</text>
<rect x="252" y="74" width="245" height="385" fill="#FAFAFA" stroke="#B0BEC5"/>
<circle cx="268" cy="92" r="11" fill="#455A64"/><text x="268" y="96" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<text x="284" y="97" font-size="13.5" font-weight="bold" fill="#212121">Grietas de esquina</text>
<rect x="299.5" y="109.0" width="150" height="150" rx="6" fill="#B0BEC5" stroke="#455A64" stroke-width="2"/>
<path d="M 301.5 119 l 8 4 l 3 8 M 309.5 111 l 4 9" stroke="#C62828" stroke-width="2.5" fill="none"/>
<path d="M 447.5 249 l -8 -4 l -3 -8 M 439.5 257 l -4 -9" stroke="#C62828" stroke-width="2.5" fill="none"/>
<text x="374.5" y="189" font-size="11" text-anchor="middle" fill="#212121">superficie / subsuperficie</text>
<text x="262" y="284" font-size="12" fill="#2E7D32" font-weight="bold">Aceptar: sin grietas visibles</text>
<text x="262" y="304" font-size="12" fill="#EF6C00" font-weight="bold">Retener: grieta ≤ 2 mm de</text>
<text x="262" y="320" font-size="12" fill="#EF6C00" >profundidad (esmerilar y</text>
<text x="262" y="336" font-size="12" fill="#EF6C00" >reinspeccionar)</text>
<text x="262" y="356" font-size="12" fill="#C62828" font-weight="bold">Rechazar: grieta > 2 mm o > 50 mm</text>
<text x="262" y="372" font-size="12" fill="#C62828" >de largo</text>
<text x="262" y="392" font-size="12" fill="#212121" font-weight="bold">Causa: romboidad, esquina de tubo</text>
<text x="262" y="408" font-size="12" fill="#212121" >gastada, enfriamiento fuerte en</text>
<text x="262" y="424" font-size="12" fill="#212121" >esquinas, enderezado &lt; 900 °C</text>
<rect x="499" y="74" width="245" height="385" fill="#FAFAFA" stroke="#B0BEC5"/>
<circle cx="515" cy="92" r="11" fill="#455A64"/><text x="515" y="96" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<text x="531" y="97" font-size="13.5" font-weight="bold" fill="#212121">Grietas en la diagonal</text>
<rect x="546.5" y="109.0" width="150" height="150" rx="6" fill="#B0BEC5" stroke="#455A64" stroke-width="2"/>
<path d="M 571.5 134 l 12 14 l 6 -2 l 14 16 l 5 -3 l 13 18" stroke="#C62828" stroke-width="2.5" fill="none"/>
<path d="M 671.5 234 l -12 -14 l -6 2 l -14 -16" stroke="#C62828" stroke-width="2.5" fill="none"/>
<line x1="546.5" y1="109" x2="696.5" y2="259" stroke="#455A64" stroke-dasharray="3 3"/>
<text x="621.5" y="254" font-size="11" text-anchor="middle" fill="#212121">macro (corte transversal)</text>
<text x="509" y="284" font-size="12" fill="#2E7D32" font-weight="bold">Aceptar: grado macro ≤ 1 (escala</text>
<text x="509" y="300" font-size="12" fill="#2E7D32" >interna 0–4)</text>
<text x="509" y="320" font-size="12" fill="#EF6C00" font-weight="bold">Retener: grado 2</text>
<text x="509" y="340" font-size="12" fill="#C62828" font-weight="bold">Rechazar: grado ≥ 3</text>
<text x="509" y="360" font-size="12" fill="#212121" font-weight="bold">Causa: romboidad, enfriamiento</text>
<text x="509" y="376" font-size="12" fill="#212121" >secundario desigual, rodillos</text>
<text x="509" y="392" font-size="12" fill="#212121" >desalineados o sobrepresión</text>
<rect x="746" y="74" width="245" height="385" fill="#FAFAFA" stroke="#B0BEC5"/>
<circle cx="762" cy="92" r="11" fill="#455A64"/><text x="762" y="96" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<text x="778" y="97" font-size="13.5" font-weight="bold" fill="#212121">Pinholes y sopladuras</text>
<rect x="793.5" y="109.0" width="150" height="150" rx="6" fill="#B0BEC5" stroke="#455A64" stroke-width="2"/>
<ellipse cx="922.2" cy="251.1" rx="2.1" ry="4.5" fill="#212121"/>
<ellipse cx="852.4" cy="113.6" rx="3.0" ry="2.1" fill="#212121"/>
<ellipse cx="799.9" cy="174.2" rx="3.1" ry="2.2" fill="#212121"/>
