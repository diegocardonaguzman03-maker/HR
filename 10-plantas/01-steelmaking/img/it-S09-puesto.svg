<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#C62828" fill-opacity="0.12"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#C62828" stroke-width="2" stroke-opacity="0.55"/>
    </pattern>
    <pattern id="hatchSlag" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="10" height="10" fill="#6D4C41" fill-opacity="0.18"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#6D4C41" stroke-width="2" stroke-opacity="0.5"/>
    </pattern>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E65100"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E88E5"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#212121"/>
    </marker>
  </defs>
  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">Figura IT-S09. Mi área: grúa de colada 250/63 t con olla llena (vista lateral de la nave de ollas)</text>
  <text x="500" y="46" text-anchor="middle" font-size="12" fill="#212121">Esquemático sin escala. Valores de MO-OLL-02, MM-GR-01 y MS-ACE-04; zonas según MS-ACE-01 [Supuesto — Validar con C-16 / OEM]</text>
  <line x1="40" y1="80" x2="960" y2="80" stroke="#455A64" stroke-width="4"/>
  <rect x="40" y="84" width="920" height="26" fill="#455A64" stroke="#263238" stroke-width="2"/>
  <text x="500" y="102" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Puente de la grúa de colada 250/63 t (doble freno, límites redundantes)</text>
  <rect x="110" y="110" width="90" height="60" fill="#CFD8DC" stroke="#455A64" stroke-width="2"/>
  <rect x="120" y="120" width="70" height="25" fill="#1E88E5" stroke="#455A64" stroke-width="1" fill-opacity="0.3"/>
  <text x="155" y="162" font-size="11" fill="#212121" text-anchor="middle" font-weight="bold">Cabina</text>
  <rect x="420" y="110" width="120" height="26" fill="#78909C" stroke="#263238" stroke-width="2"/>
  <text x="480" y="128" font-size="10" fill="#FFFFFF" text-anchor="middle">carro · frenos</text>
  <line x1="445" y1="136" x2="445" y2="200" stroke="#263238" stroke-width="2"/>
  <line x1="515" y1="136" x2="515" y2="200" stroke="#263238" stroke-width="2"/>
  <rect x="390" y="200" width="180" height="14" fill="#455A64" stroke="#263238" stroke-width="2"/>
  <line x1="400" y1="214" x2="400" y2="255" stroke="#263238" stroke-width="5"/>
  <line x1="560" y1="214" x2="560" y2="255" stroke="#263238" stroke-width="5"/>
  <polygon points="395,245 565,245 551,375 409,375" fill="#8D6E63" stroke="#455A64" stroke-width="2"/>
  <polygon points="403,277.5 557,277.5 545,367 415,367" fill="#E65100" stroke="#FF8F00" stroke-width="1"/>
  <rect x="403" y="267.5" width="154" height="10" fill="#6D4C41" stroke="#6D4C41" stroke-width="1"/>
  <circle cx="400" cy="262" r="8" fill="#455A64" stroke="#263238" stroke-width="1.5"/>
  <circle cx="560" cy="262" r="8" fill="#455A64" stroke="#263238" stroke-width="1.5"/>
  <line x1="600" y1="375" x2="600" y2="350" stroke="#212121" stroke-width="1.5" marker-end="url(#arrK)"/>
  <text x="608" y="360" font-size="11" fill="#212121" text-anchor="start">prueba de frenos: sube 100–200 mm,</text>
  <text x="608" y="374" font-size="11" fill="#212121" text-anchor="start">pausa 5 s (MO-OLL-02)</text>
  <path d="M150,300 L390,300" fill="none" stroke="#E65100" stroke-width="3" stroke-dasharray="10,6"/>
  <path d="M575,300 L800,300" fill="none" stroke="#E65100" stroke-width="3" stroke-dasharray="10,6" marker-end="url(#arrO)"/>
  <rect x="60" y="330" width="110" height="120" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="115" y="380" font-size="12" fill="#212121" text-anchor="middle" font-weight="bold">LF</text>
  <text x="115" y="396" font-size="11" fill="#212121" text-anchor="middle">(origen)</text>
  <rect x="610" y="400" width="70" height="50" fill="#B0BEC5" stroke="#455A64" stroke-width="2"/>
  <text x="645" y="430" font-size="10" fill="#212121" text-anchor="middle">equipo</text>
  <line x1="700" y1="375" x2="700" y2="400" stroke="#212121" stroke-width="1"/>
  <line x1="693" y1="375" x2="707" y2="375" stroke="#212121" stroke-width="1"/>
  <line x1="693" y1="400" x2="707" y2="400" stroke="#212121" stroke-width="1"/>
  <text x="712" y="392" font-size="11" fill="#212121" text-anchor="start" font-weight="bold">holgura ≥ 1 m</text>
  <rect x="830" y="260" width="110" height="20" fill="#455A64" stroke="#263238" stroke-width="2"/>
  <rect x="875" y="280" width="20" height="170" fill="#455A64" stroke="#263238" stroke-width="2"/>
  <text x="885" y="250" font-size="12" fill="#212121" text-anchor="middle" font-weight="bold">Torreta CC1/CC2</text>
  <text x="885" y="236" font-size="11" fill="#212121" text-anchor="middle">(destino)</text>
  <rect x="180" y="450" width="90" height="14" fill="#FBC02D" stroke="#F9A825" stroke-width="1.2" fill-opacity="0.28"/>
  <rect x="270" y="450" width="520" height="14" fill="url(#hatchRed)" stroke="#C62828" stroke-width="1.5"/>
  <rect x="790" y="450" width="60" height="14" fill="#FBC02D" stroke="#F9A825" stroke-width="1.2" fill-opacity="0.28"/>
  <line x1="20" y1="450" x2="980" y2="450" stroke="#455A64" stroke-width="3"/>
  <text x="530" y="480" font-size="11" fill="#C62828" text-anchor="middle">Bajo la ruta: roja = proyección ± 5 m · amarilla ± 5–15 m · nadie bajo ni junto a la carga</text>
  <rect x="300" y="488" width="150" height="30" fill="none" stroke="#C62828" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="375" y="508" font-size="11" fill="#C62828" text-anchor="middle">fosa de emergencia seca</text>
  <circle cx="770" cy="423" r="6" fill="#212121" stroke="#212121" stroke-width="1"/>
  <line x1="770" y1="429" x2="770" y2="445" stroke="#212121" stroke-width="3"/>
  <line x1="762" y1="435" x2="778" y2="435" stroke="#212121" stroke-width="2"/>
  <rect x="765" y="429" width="10" height="9" fill="#FF8F00" stroke="#FF8F00" stroke-width="1"/>
  <text x="735" y="330" font-size="11" fill="#212121" text-anchor="start" font-weight="bold">S-13 señalero</text>
  <text x="735" y="344" font-size="10" fill="#212121" text-anchor="start">(un solo señalero, radio)</text>
  <rect x="470" y="488" width="250" height="30" fill="#43A047" stroke="#2E7D32" stroke-width="1.5" fill-opacity="0.18"/>
  <text x="595" y="508" font-size="11" fill="#2E7D32" text-anchor="middle">pasillo peatonal protegido</text>
  <path d="M730,503 L960,503" fill="none" stroke="#2E7D32" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrG)"/>
  <rect x="20" y="540" width="960" height="270" fill="#FAFAFA" stroke="#455A64" stroke-width="1"/>
  <text x="35" y="562" font-size="14" fill="#212121" text-anchor="start" font-weight="bold">Leyenda</text>
  <text x="35" y="582" font-size="12" fill="#212121" text-anchor="start">1  Cabina climatizada con extintor: rotación cada 2 h; relevo con la grúa sin carga</text>
  <text x="35" y="600" font-size="12" fill="#212121" text-anchor="start">2  Carro y frenos: 2 frenos independientes y 2 límites superiores (prueba por turno)</text>
  <text x="35" y="618" font-size="12" fill="#212121" text-anchor="start">3  Traviesa con ganchos laminares (≥ 250 t): sin grietas, con seguros</text>
  <text x="35" y="636" font-size="12" fill="#212121" text-anchor="start">4  Muñones de la olla: confirma que los 2 ganchos están asentados</text>
  <text x="35" y="654" font-size="12" fill="#212121" text-anchor="start">5  Olla llena ≈ 230 t (acero + tara + escoria); límite ≤ 240 t [Supuesto]</text>
  <text x="35" y="672" font-size="12" fill="#212121" text-anchor="start">6  Altura mínima segura: ≥ 1 m sobre el obstáculo más alto de la ruta</text>
  <text x="35" y="690" font-size="12" fill="#212121" text-anchor="start">7  Zona roja bajo la ruta: si ves a alguien, detén el traslado</text>
  <text x="35" y="708" font-size="12" fill="#212121" text-anchor="start">8  Torreta de CC1/CC2: aproximación en marcha lenta con señales de S-13</text>
  <text x="35" y="726" font-size="12" fill="#212121" text-anchor="start">9  Fosa de emergencia seca: destino de una olla con fuga o perforación</text>
  <text x="35" y="744" font-size="12" fill="#212121" text-anchor="start">10  Señalero S-13: confirma enganche y asentamiento; PARO lo da cualquiera</text>
  <text x="35" y="762" font-size="12" fill="#212121" text-anchor="start">11  LF: origen de la olla liberada por S-06</text>
  <text x="560" y="562" font-size="13" fill="#212121" text-anchor="start" font-weight="bold">Zonas y valores clave</text>
  <rect x="560" y="574" width="18" height="14" fill="#C62828" stroke="#C62828" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="586" font-size="12" fill="#212121" text-anchor="start">ROJA: solo personal esencial, EPP aluminizado</text>
  <rect x="560" y="594" width="18" height="14" fill="#FBC02D" stroke="#F9A825" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="606" font-size="12" fill="#212121" text-anchor="start">AMARILLA: autorizado, tras barrera, EPP completo</text>
  <rect x="560" y="614" width="18" height="14" fill="#43A047" stroke="#2E7D32" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="626" font-size="12" fill="#212121" text-anchor="start">VERDE: tránsito con EPP básico de nave</text>
  <line x1="560" y1="641" x2="578" y2="641" stroke="#2E7D32" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="585" y="646" font-size="12" fill="#212121" text-anchor="start">Ruta de escape → salida (verde en el muro)</text>
  <text x="560" y="670" font-size="12" fill="#212121" text-anchor="start">Velocidad con olla llena ≤ 50 % [Validar con OEM]</text>
  <text x="560" y="688" font-size="12" fill="#212121" text-anchor="start">Tiempo LF → torreta ≤ 8 min [Supuesto]</text>
  <text x="560" y="706" font-size="12" fill="#212121" text-anchor="start">Bordo libre ≥ 300 mm antes de trasladar</text>
  <text x="560" y="724" font-size="12" fill="#212121" text-anchor="start">Coraza &gt; 350 °C en la ruta: ruta de emergencia [Supuesto]</text>
  <text x="560" y="742" font-size="12" fill="#212121" text-anchor="start">Nunca sobre púlpitos, oficinas, comedores ni fosas con agua</text>
  <text x="560" y="760" font-size="12" fill="#C62828" text-anchor="start">MS-ACE-04 indica prueba de 200–300 mm y 10 s: pendiente</text>
  <text x="560" y="778" font-size="12" fill="#C62828" text-anchor="start">de homologar con MO-OLL-02 [Validar con C-16 / OEM]</text>
  <g font-size="12" font-weight="bold" fill="#ffffff">
    <circle cx="110" cy="110" r="11" fill="#212121"/><text x="110" y="114" text-anchor="middle">1</text>
    <circle cx="548" cy="123" r="11" fill="#212121"/><text x="548" y="127" text-anchor="middle">2</text>
    <circle cx="390" cy="200" r="11" fill="#212121"/><text x="390" y="204" text-anchor="middle">3</text>
    <circle cx="400" cy="262" r="11" fill="#212121"/><text x="400" y="266" text-anchor="middle">4</text>
    <circle cx="480" cy="330" r="11" fill="#212121"/><text x="480" y="334" text-anchor="middle">5</text>
    <circle cx="610" cy="400" r="11" fill="#212121"/><text x="610" y="404" text-anchor="middle">6</text>
    <circle cx="270" cy="457" r="11" fill="#212121"/><text x="270" y="461" text-anchor="middle">7</text>
    <circle cx="830" cy="260" r="11" fill="#212121"/><text x="830" y="264" text-anchor="middle">8</text>
    <circle cx="300" cy="503" r="11" fill="#212121"/><text x="300" y="507" text-anchor="middle">9</text>
    <circle cx="770" cy="410" r="11" fill="#212121"/><text x="770" y="414" text-anchor="middle">10</text>
    <circle cx="60" cy="330" r="11" fill="#212121"/><text x="60" y="334" text-anchor="middle">11</text>
  </g>
</svg>
