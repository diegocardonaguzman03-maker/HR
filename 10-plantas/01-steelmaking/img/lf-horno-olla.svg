  <text x="115" y="148" text-anchor="middle" font-size="11" fill="#212121">2 líneas: CaSi · Al · C</text>
  <text x="115" y="164" text-anchor="middle" font-size="11" fill="#212121">150–250 m/min [Supuesto]</text>
