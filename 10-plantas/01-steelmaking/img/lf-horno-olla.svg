    <circle cx="600" cy="330" r="11" fill="#C62828"/><text x="600" y="334" text-anchor="middle">11</text>
    <circle cx="880" cy="640" r="11" fill="#43A047"/><text x="880" y="644" text-anchor="middle">12</text>
  </g>
  <rect x="640" y="360" width="350" height="240" fill="#FAFAFA" stroke="#455A64"/>
  <text x="650" y="380" font-weight="bold" fill="#212121">Leyenda y parámetros</text>
  <g font-size="11" fill="#212121">
    <text x="650" y="398">1 Bóveda enfriada por agua (vigilar fugas)</text>
    <text x="650" y="415">2 3 electrodos de grafito 457 mm</text>
    <text x="650" y="432">3 Mástil / regulación de electrodos</text>
    <text x="650" y="449">4 Extracción de humos</text>
    <text x="650" y="466">5 Acero 150 t · envío = líquidus + SH + pérdidas</text>
    <text x="650" y="483">6 Escoria reductora (FeO + MnO bajo [Validar])</text>
    <text x="650" y="500">7 Tapón poroso: fuerte 400–600 · suave 50–150 NL/min</text>
    <text x="650" y="517">8 Carro de olla con báscula</text>
    <text x="650" y="534">9 Alimentador de alambre (CaSi, Al, C)</text>
    <text x="650" y="551">10 Adiciones a granel (cal, FeMn, FeSi, SiMn, FeNb)</text>
    <text x="650" y="568">11 Lanza manipuladora: termopar desechable, O, muestra</text>
    <text x="650" y="585">12 Estación de argón (caudal y presión de respaldo)</text>
  </g>
  <text x="20" y="700" font-size="11" fill="#C62828">Objetivos: S ≤ 0.010% · Al soluble 0.020–0.045% (CC1) · agitación suave ≥ 8 min antes del envío · geometría ilustrativa [Validar con OEM / Ingeniería de Proceso]</text>
