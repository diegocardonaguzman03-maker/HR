  </defs>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#212121">Figura 8. Estación de horno olla (LF-1 / LF-2)</text>
  <text x="500" y="47" text-anchor="middle" font-size="12" fill="#455A64">Transformador 25 MVA · electrodos 457 mm (18") · calentamiento 4–5 °C/min · tratamiento 35–45 min [Validar con OEM / Ingeniería de Proceso]</text>

