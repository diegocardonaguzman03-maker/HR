    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker>
  </defs>
  <text x="500" y="28" font-size="16" text-anchor="middle" fill="#212121" font-weight="bold">Figura IT-C17. Mi área de supervisión: patio de chatarra y materiales (Supervisor de Patio)</text>
  <text x="500" y="48" font-size="12" text-anchor="middle" fill="#212121">Puntos de verificación de controles críticos (VCC). Valores de MO-EAF-02, MS-ACE-03/04/07. Distancias [Supuesto — Validar con C-16 / ESR]</text>
  <rect x="20" y="60" width="960" height="470" fill="none" stroke="#455A64" stroke-width="3" />
  <text x="40" y="80" font-size="12" text-anchor="start" fill="#455A64" font-weight="bold">PATIO DE CHATARRA Y ALMACÉN DE MATERIALES — mi recorrido de supervisión (sin escala)</text>
  <rect x="40" y="95" width="920" height="420" fill="#FFF3C4" stroke="#FF8F00" stroke-width="1.5" stroke-dasharray="4,3"/><text x="44" y="109" font-size="12" text-anchor="start" fill="#8D4B00" font-weight="bold">Zona amarilla: tránsito grúa–vehículo–peatón</text>
  <rect x="80" y="140" width="14" height="55" fill="#C62828" stroke="#C62828" stroke-width="1.5" /><rect x="130" y="140" width="14" height="55" fill="#C62828" stroke="#C62828" stroke-width="1.5" /><text x="112" y="133" font-size="12" text-anchor="middle" fill="#C62828" font-weight="bold">Pórtico</text>
  <rect x="170" y="140" width="90" height="50" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5" /><text x="215" y="170" font-size="12" text-anchor="middle" fill="#212121">Báscula</text>
  <circle cx="130" cy="280" r="50" fill="url(#hatchRed)" stroke="#C62828" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="112" y="268" width="36" height="24" fill="#455A64" stroke="#455A64" stroke-width="1.5" /><text x="130" y="345" font-size="12" text-anchor="middle" fill="#C62828" font-weight="bold">Aislamiento ≥ 10 m</text>
  <rect x="300" y="130" width="120" height="55" fill="#FFEBEE" stroke="#C62828" stroke-width="2" /><text x="360" y="155" font-size="12" text-anchor="middle" fill="#C62828" font-weight="bold">Rechazos</text><text x="360" y="173" font-size="12" text-anchor="middle" fill="#C62828">(actas)</text>
  <path d="M280,330 l35,-55 l35,55 z" fill="#8D6E63" stroke="#455A64"/>
