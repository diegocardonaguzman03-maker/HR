  <path d="M550,330 l35,-55 l35,55 z" fill="#8D6E63" stroke="#455A64"/>
  <text x="440" y="346" font-size="12" text-anchor="middle" fill="#212121">Pilas por tipo (inventario ± 2%)</text>
  <circle cx="640" cy="230" r="55" fill="url(#hatchRed)" stroke="#C62828" stroke-width="2" stroke-dasharray="6,3"/><text x="640" y="189" font-size="12" text-anchor="middle" fill="#C62828" font-weight="bold">Roja</text>
  <circle cx="640" cy="238" r="18" fill="#455A64"/>
  <rect x="740" y="160" width="190" height="110" fill="#F5F5F5" stroke="#455A64" stroke-width="1.5" /><text x="835" y="180" font-size="12" text-anchor="middle" fill="#455A64" font-weight="bold">Liberación de canasta</text>
  <path d="M800,190 L870,190 L860,235 L810,235 Z" fill="#455A64" fill-opacity="0.25" stroke="#455A64" stroke-width="2"/><path d="M808,202 l12,-8 l10,10 l12,-9 l10,9 l10,-8" fill="none" stroke="#6D4C41" stroke-width="3"/>
  <text x="835" y="262" font-size="12" text-anchor="middle" fill="#212121">seca · 55–70 t · receta</text>
  <rect x="740" y="300" width="190" height="70" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5" /><text x="835" y="325" font-size="12" text-anchor="middle" fill="#455A64" font-weight="bold">Almacén de fundentes</text><text x="835" y="343" font-size="12" text-anchor="middle" fill="#212121">cal · dolomita · carbón</text><text x="835" y="361" font-size="12" text-anchor="middle" fill="#212121">ferroaleaciones</text>
  <rect x="280" y="390" width="170" height="60" fill="#FFF8E1" stroke="#FF8F00" stroke-width="2" /><text x="365" y="415" font-size="12" text-anchor="middle" fill="#E65100" font-weight="bold">Oxicorte (día)</text><text x="365" y="433" font-size="12" text-anchor="middle" fill="#212121">permiso en caliente</text>
  <rect x="520" y="400" width="150" height="60" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" /><text x="595.0" y="434.0" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">Caseta de patio</text>
  <rect x="740" y="400" width="190" height="60" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" /><text x="835.0" y="434.0" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">Punto de reunión</text>
  <line x1="60" y1="480" x2="940" y2="480" stroke="#43A047" stroke-width="3"/><text x="300" y="500" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">Pasillo peatonal pintado (separación grúa–peatón)</text>
