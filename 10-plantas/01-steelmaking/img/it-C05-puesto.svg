  <circle cx="800" cy="125" r="11" fill="#212121"/><text x="800" y="129" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">6</text>
  <circle cx="640" cy="255" r="11" fill="#212121"/><text x="640" y="259" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">7</text>
  <circle cx="640" cy="355" r="11" fill="#212121"/><text x="640" y="359" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">8</text>
  <circle cx="800" cy="355" r="11" fill="#212121"/><text x="800" y="359" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">9</text>
  <circle cx="300" cy="485" r="11" fill="#212121"/><text x="300" y="489" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">10</text>
  <rect x="20" y="570" width="960" height="160" fill="#FAFAFA" stroke="#455A64" stroke-width="1" />
  <text x="30" y="590" font-size="13" text-anchor="start" fill="#212121" font-weight="bold">Leyenda (números del dibujo)</text>
  <circle cx="40" cy="610" r="11" fill="#212121"/><text x="40" y="614" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text><text x="58" y="614" font-size="12" text-anchor="start" fill="#212121">Púlpitos EAF-1/2: HMI de agua, energía y alarmas</text>
  <circle cx="40" cy="630" r="11" fill="#212121"/><text x="40" y="634" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text><text x="58" y="634" font-size="12" text-anchor="start" fill="#212121">Tablero de llaves cautivas: VCC conteo llaves = personas</text>
  <circle cx="40" cy="650" r="11" fill="#212121"/><text x="40" y="654" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text><text x="58" y="654" font-size="12" text-anchor="start" fill="#212121">Horno: roja ≤ 15 m en carga; fuga &gt; 2% = sin arco</text>
  <circle cx="40" cy="670" r="11" fill="#212121"/><text x="40" y="674" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text><text x="58" y="674" font-size="12" text-anchor="start" fill="#212121">EBT y fosa: roja ≤ 10 m; sirena ≥ 30 s; fosa seca</text>
  <circle cx="40" cy="690" r="11" fill="#212121"/><text x="40" y="694" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text><text x="58" y="694" font-size="12" text-anchor="start" fill="#212121">LF: tratamiento 35–45 min; T de envío por grado</text>
  <circle cx="520" cy="610" r="11" fill="#212121"/><text x="520" y="614" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">6</text><text x="538" y="614" font-size="12" text-anchor="start" fill="#212121">Ollas: apertura libre ≥ 98%; precalentadas</text>
  <circle cx="520" cy="630" r="11" fill="#212121"/><text x="520" y="634" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">7</text><text x="538" y="634" font-size="12" text-anchor="start" fill="#212121">Ruta de olla llena: &gt; 240 t no se iza sin C-04</text>
  <circle cx="520" cy="650" r="11" fill="#212121"/><text x="520" y="654" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">8</text><text x="538" y="654" font-size="12" text-anchor="start" fill="#212121">Oficina de turno: bitácora, charla de 5 min</text>
  <circle cx="520" cy="670" r="11" fill="#212121"/><text x="520" y="674" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">9</text><text x="538" y="674" font-size="12" text-anchor="start" fill="#212121">Punto de reunión: conteo de mi gente ≤ 10 min</text>
  <circle cx="520" cy="690" r="11" fill="#212121"/><text x="520" y="694" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">10</text><text x="538" y="694" font-size="12" text-anchor="start" fill="#212121">Rutas de escape de la nave</text>
  <text x="30" y="718" font-size="13" text-anchor="start" fill="#212121" font-weight="bold">Zonas:</text><rect x="90" y="706" width="26" height="16" fill="url(#hatchRed)" stroke="#C62828" stroke-width="2" /><text x="122" y="718" font-size="12" text-anchor="start" fill="#212121">Roja: solo personal esencial con EPP aluminizado</text><rect x="430" y="706" width="26" height="16" fill="#FFF3C4" stroke="#FF8F00" stroke-width="1.5" /><text x="462" y="718" font-size="12" text-anchor="start" fill="#212121">Amarilla: paso con precaución</text><rect x="660" y="706" width="26" height="16" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" /><text x="692" y="718" font-size="12" text-anchor="start" fill="#212121">Verde: refugio / segura</text><line x1="850" y1="714" x2="890" y2="714" stroke="#43A047" stroke-width="4" stroke-dasharray="10,5" marker-end="url(#arrG)"/><text x="896" y="718" font-size="12" text-anchor="start" fill="#212121">Escape</text>
</svg>
