    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker>
  </defs>
  <text x="500" y="28" font-size="16" text-anchor="middle" fill="#212121" font-weight="bold">Figura IT-C05. Mi área de supervisión: hornos EAF, LF y ollas (Supervisor de Hornos)</text>
  <text x="500" y="48" font-size="12" text-anchor="middle" fill="#212121">Puntos de verificación de controles críticos (VCC). Valores de FT-ACE-001 v0.3 y MO/MS. Distancias [Supuesto — Validar con C-16]</text>
  <rect x="20" y="60" width="960" height="470" fill="none" stroke="#455A64" stroke-width="3" />
  <text x="40" y="80" font-size="12" text-anchor="start" fill="#455A64" font-weight="bold">NAVE DE HORNOS Y NAVE DE OLLAS / LF — mi recorrido de supervisión (sin escala)</text>
  <line x1="600" y1="60" x2="600" y2="530" stroke="#455A64" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="40" y="95" width="550" height="420" fill="#FFF3C4" stroke="#FF8F00" stroke-width="1.5" stroke-dasharray="4,3"/><text x="44" y="109" font-size="12" text-anchor="start" fill="#8D4B00" font-weight="bold">Nave de hornos</text>
  <rect x="610" y="95" width="350" height="420" fill="#FFF3C4" stroke="#FF8F00" stroke-width="1.5" stroke-dasharray="4,3"/><text x="614" y="109" font-size="12" text-anchor="start" fill="#8D4B00" font-weight="bold">Nave de ollas / LF</text>
  <circle cx="170" cy="230" r="90" fill="url(#hatchRed)" stroke="#C62828" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="170" cy="230" r="60" fill="#8D6E63" stroke="#455A64" stroke-width="4"/><circle cx="170" cy="230" r="44" fill="#E65100" fill-opacity="0.85"/><circle cx="152" cy="220" r="8" fill="#455A64"/><circle cx="188" cy="220" r="8" fill="#455A64"/><circle cx="170" cy="246" r="8" fill="#455A64"/><text x="170" y="306" font-size="12" text-anchor="middle" fill="#212121" font-weight="bold">EAF-1</text>
  <circle cx="420" cy="230" r="90" fill="url(#hatchRed)" stroke="#C62828" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="420" cy="230" r="60" fill="#8D6E63" stroke="#455A64" stroke-width="4"/><circle cx="420" cy="230" r="44" fill="#E65100" fill-opacity="0.85"/><circle cx="402" cy="220" r="8" fill="#455A64"/><circle cx="438" cy="220" r="8" fill="#455A64"/><circle cx="420" cy="246" r="8" fill="#455A64"/><text x="420" y="306" font-size="12" text-anchor="middle" fill="#212121" font-weight="bold">EAF-2</text>
  <rect x="120" y="360" width="120" height="90" fill="url(#hatchRed)" stroke="#C62828" stroke-width="2" stroke-dasharray="6,3"/><text x="124" y="374" font-size="12" text-anchor="start" fill="#C62828" font-weight="bold">EBT-1</text>
  <rect x="370" y="360" width="120" height="90" fill="url(#hatchRed)" stroke="#C62828" stroke-width="2" stroke-dasharray="6,3"/><text x="374" y="374" font-size="12" text-anchor="start" fill="#C62828" font-weight="bold">EBT-2</text>
  <circle cx="180" cy="410" r="22" fill="#8D6E63" stroke="#455A64" stroke-width="3"/><circle cx="180" cy="410" r="13" fill="#FF8F00"/>
  <circle cx="430" cy="410" r="22" fill="#8D6E63" stroke="#455A64" stroke-width="3"/><circle cx="430" cy="410" r="13" fill="#FF8F00"/>
  <rect x="270" y="110" width="60" height="40" fill="#ECEFF1" stroke="#455A64" stroke-width="2" /><text x="300" y="135" font-size="12" text-anchor="middle" fill="#212121">Púlpitos</text>
  <rect x="270" y="170" width="60" height="34" fill="#ffffff" stroke="#455A64" stroke-width="1.5" /><text x="300" y="192" font-size="12" text-anchor="middle" fill="#212121">Llaves</text>
  <rect x="640" y="130" width="120" height="90" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5" /><text x="700" y="150" font-size="12" text-anchor="middle" fill="#455A64" font-weight="bold">LF-1 / LF-2</text><text x="700" y="170" font-size="12" text-anchor="middle" fill="#212121">S ≤ 0.010%</text><text x="700" y="188" font-size="12" text-anchor="middle" fill="#212121">Ar suave ≥ 8 min</text>
  <rect x="800" y="130" width="140" height="90" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5" /><text x="870" y="150" font-size="12" text-anchor="middle" fill="#455A64" font-weight="bold">Preparación de</text><text x="870" y="168" font-size="12" text-anchor="middle" fill="#455A64" font-weight="bold">ollas</text><text x="870" y="188" font-size="12" text-anchor="middle" fill="#212121">1,000–1,100 °C</text>
  <rect x="640" y="260" width="300" height="60" fill="url(#hatchRed)" stroke="#C62828" stroke-width="2" stroke-dasharray="6,3"/><text x="644" y="274" font-size="12" text-anchor="start" fill="#C62828" font-weight="bold">Ruta de olla llena ± 5 m (≈ 230 t)</text>
  <rect x="640" y="360" width="140" height="60" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" /><text x="710.0" y="394.0" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">Oficina de turno</text>
  <rect x="800" y="360" width="140" height="60" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" /><text x="870.0" y="394.0" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">Punto de reunión</text>
