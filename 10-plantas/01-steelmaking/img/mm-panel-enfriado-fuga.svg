<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1E88E5"/>
    </marker>
    <marker id="cota" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,4 L8,4 M4,0 L4,8" stroke="#212121" stroke-width="1"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#212121">Figura MM-EAF-01. Panel enfriado por agua: medición de caudal y detección de fugas</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#455A64">EAF-1 / EAF-2 · agua total ≈ 2,200 m³/h a 4–6 bar · valores de tiempo y dimensiones [Validar con OEM / Ingeniería de Mantenimiento]</text>

  <!-- Colector de suministro -->
  <line x1="100" y1="90" x2="100" y2="470" stroke="#1E88E5" stroke-width="10"/>
  <text x="100" y="84" text-anchor="middle" fill="#1E88E5" font-weight="bold">Suministro</text>
  <!-- Colector de retorno -->
  <line x1="690" y1="90" x2="690" y2="470" stroke="#1565C0" stroke-width="10"/>
  <text x="690" y="84" text-anchor="middle" fill="#1565C0" font-weight="bold">Retorno</text>

  <!-- Línea de entrada -->
  <line x1="100" y1="150" x2="280" y2="150" stroke="#1E88E5" stroke-width="6" marker-end="url(#flecha)"/>
  <!-- Panel: serpentín -->
  <rect x="255" y="125" width="275" height="290" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <path d="M 280 150 H 500 A 20 20 0 0 1 500 190 H 280 A 20 20 0 0 0 280 230 H 500 A 20 20 0 0 1 500 270 H 280 A 20 20 0 0 0 280 310 H 500 A 20 20 0 0 1 500 350 H 280 A 20 20 0 0 0 280 390 H 500" fill="none" stroke="#1E88E5" stroke-width="12" stroke-linecap="round"/>
  <path d="M 280 150 H 500 A 20 20 0 0 1 500 190 H 280 A 20 20 0 0 0 280 230 H 500 A 20 20 0 0 1 500 270 H 280 A 20 20 0 0 0 280 310 H 500 A 20 20 0 0 1 500 350 H 280 A 20 20 0 0 0 280 390 H 500" fill="none" stroke="#455A64" stroke-width="2" stroke-dasharray="1 0" opacity="0.4"/>
  <!-- Cara caliente -->
  <rect x="255" y="415" width="275" height="10" fill="#FF8F00"/>
  <text x="392" y="440" text-anchor="middle" font-size="12" fill="#E65100">Cara caliente (hacia el baño / escoria)</text>
  <!-- Fuga -->
  <circle cx="400" cy="270" r="7" fill="#C62828"/>
  <path d="M 400 277 q -8 14 0 26 q 8 14 0 26" stroke="#C62828" stroke-width="2" fill="none"/>
  <text x="412" y="300" fill="#C62828" font-size="12" font-weight="bold">Fuga</text>

  <!-- Línea de salida -->
  <line x1="500" y1="390" x2="690" y2="390" stroke="#1565C0" stroke-width="6" marker-end="url(#flecha)"/>

  <!-- V1 -->
  <path d="M 125 138 L 145 162 L 145 138 L 125 162 Z" fill="#ffffff" stroke="#212121" stroke-width="2"/>
  <line x1="135" y1="150" x2="135" y2="125" stroke="#212121" stroke-width="2"/>
  <rect x="127" y="118" width="16" height="8" fill="#C62828"/>
  <!-- PT -->
  <line x1="180" y1="150" x2="180" y2="120" stroke="#212121" stroke-width="1.5"/>
  <circle cx="180" cy="108" r="13" fill="#ffffff" stroke="#212121" stroke-width="1.5"/>
  <text x="180" y="112" text-anchor="middle" font-size="10">PT</text>
  <!-- FT entrada -->
  <circle cx="228" cy="150" r="15" fill="#ffffff" stroke="#212121" stroke-width="2"/>
  <text x="228" y="154" text-anchor="middle" font-size="10" font-weight="bold">FT</text>
  <!-- Venteo -->
  <line x1="515" y1="150" x2="515" y2="105" stroke="#1E88E5" stroke-width="3"/>
  <path d="M 505 110 L 525 124 L 525 110 L 505 124 Z" transform="rotate(90 515 117)" fill="#ffffff" stroke="#212121" stroke-width="1.5"/>
  <!-- TT -->
  <line x1="548" y1="390" x2="548" y2="360" stroke="#212121" stroke-width="1.5"/>
  <circle cx="548" cy="348" r="13" fill="#ffffff" stroke="#212121" stroke-width="1.5"/>
  <text x="548" y="352" text-anchor="middle" font-size="10">TT</text>
  <!-- FT salida -->
  <circle cx="598" cy="390" r="15" fill="#ffffff" stroke="#212121" stroke-width="2"/>
  <text x="598" y="394" text-anchor="middle" font-size="10" font-weight="bold">FT</text>
  <!-- V2 -->
  <path d="M 640 378 L 660 402 L 660 378 L 640 402 Z" fill="#ffffff" stroke="#212121" stroke-width="2"/>
  <line x1="650" y1="390" x2="650" y2="365" stroke="#212121" stroke-width="2"/>
  <rect x="642" y="358" width="16" height="8" fill="#C62828"/>
  <!-- Dren -->
  <line x1="570" y1="390" x2="570" y2="455" stroke="#1565C0" stroke-width="3"/>
  <path d="M 560 440 L 580 440 L 560 460 L 580 460 Z" fill="#ffffff" stroke="#212121" stroke-width="1.5"/>

  <!-- Señales al PLC -->
  <polyline points="228,135 228,72 830,72 830,95" fill="none" stroke="#455A64" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polyline points="598,405 598,485 830,485 830,440" fill="none" stroke="#455A64" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polyline points="561,348 610,348 610,300 718,300" fill="none" stroke="#455A64" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polyline points="193,108 205,108 205,72" fill="none" stroke="#455A64" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Cotas -->
  <line x1="240" y1="125" x2="240" y2="415" stroke="#212121" stroke-width="1" marker-start="url(#cota)" marker-end="url(#cota)"/>
  <text x="232" y="270" text-anchor="middle" font-size="11" transform="rotate(-90 232 270)">Alto panel ≈ 1.5–2.0 m [Validar OEM]</text>
  <text x="120" y="462" font-size="11" fill="#212121">Tubo típ. Ø 70 × 10 mm (ASTM A106-B) · espesor mín. 5 mm por UT [Validar OEM]</text>

  <!-- Caja de lógica -->
  <rect x="718" y="95" width="228" height="345" rx="6" fill="#FAFAFA" stroke="#455A64" stroke-width="2"/>
  <text x="832" y="118" text-anchor="middle" font-weight="bold" fill="#212121">11 · Lógica de fuga (PLC)</text>
  <text x="832" y="142" text-anchor="middle" font-size="12">ΔQ % = (Q ent − Q sal) / Q ent × 100</text>
  <text x="832" y="160" text-anchor="middle" font-size="11" fill="#455A64">por circuito, filtrado 5 s [Validar OEM]</text>
  <rect x="730" y="172" width="204" height="44" rx="4" fill="#FFF3E0" stroke="#FF8F00" stroke-width="2"/>
  <text x="832" y="190" text-anchor="middle" font-weight="bold" fill="#E65100">ΔQ &gt; 2 % → ALARMA</text>
  <text x="832" y="207" text-anchor="middle" font-size="11">Avisa S-01 y C-05; inspecciona</text>
  <rect x="730" y="224" width="204" height="58" rx="4" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="832" y="242" text-anchor="middle" font-weight="bold" fill="#C62828">ΔQ &gt; 4 % → DISPARO</text>
  <text x="832" y="258" text-anchor="middle" font-size="11">Abre interruptor del arco,</text>
  <text x="832" y="273" text-anchor="middle" font-size="11">corta O₂/GN/carbono; no bascular</text>
  <text x="730" y="306" font-size="12">• T salida &gt; 60 °C → alarma</text>
  <text x="730" y="326" font-size="12">• P entrada &lt; 3 bar → alarma</text>
  <text x="730" y="346" font-size="12">• Normal 4–6 bar; ΔT 10–25 °C [Sup.]</text>
  <text x="730" y="366" font-size="12">• Calibración FT: ±0.5 % (anual)</text>
  <text x="730" y="386" font-size="12">• Comparar FT ent/sal en seco:</text>
  <text x="742" y="404" font-size="12">desviación ≤ 0.5 %</text>
  <text x="730" y="428" font-size="11" fill="#455A64">Fuente: FT-ACE-001 §2</text>

  <!-- Números -->
  <g font-size="12" font-weight="bold" fill="#ffffff">
    <circle cx="80" cy="300" r="11" fill="#212121"/><text x="80" y="304" text-anchor="middle">1</text>
    <circle cx="135" cy="185" r="11" fill="#212121"/><text x="135" y="189" text-anchor="middle">2</text>
    <circle cx="180" cy="78" r="11" fill="#212121"/><text x="180" y="82" text-anchor="middle">3</text>
    <circle cx="255" cy="175" r="11" fill="#212121"/><text x="255" y="179" text-anchor="middle">4</text>
    <circle cx="545" cy="250" r="11" fill="#212121"/><text x="545" y="254" text-anchor="middle">5</text>
    <circle cx="548" cy="318" r="11" fill="#212121"/><text x="548" y="322" text-anchor="middle">6</text>
    <circle cx="598" cy="420" r="11" fill="#212121"/><text x="598" y="424" text-anchor="middle">7</text>
    <circle cx="650" cy="420" r="11" fill="#212121"/><text x="650" y="424" text-anchor="middle">8</text>
    <circle cx="712" cy="460" r="11" fill="#212121"/><text x="712" y="464" text-anchor="middle">9</text>
    <circle cx="545" cy="470" r="11" fill="#212121"/><text x="545" y="474" text-anchor="middle">10</text>
  </g>

  <!-- Leyenda -->
  <rect x="20" y="505" width="920" height="140" fill="#FAFAFA" stroke="#B0BEC5"/>
  <text x="32" y="526" font-weight="bold">Leyenda</text>
  <g font-size="12" fill="#212121">
    <text x="32" y="548">1 Colector de suministro (4–6 bar)</text>
    <text x="32" y="568">2 Válvula de aislamiento de entrada V1 (punto LOTO, candado rojo)</text>
    <text x="32" y="588">3 Transmisor de presión PT (alarma &lt; 3 bar)</text>
    <text x="32" y="608">4 Medidor de caudal de entrada FT-ent (electromagnético)</text>
    <text x="32" y="628">5 Panel de tubos en serpentín (pared o bóveda)</text>
    <text x="480" y="548">6 Transmisor de temperatura de salida TT (alarma &gt; 60 °C)</text>
    <text x="480" y="568">7 Medidor de caudal de salida FT-sal (electromagnético)</text>
    <text x="480" y="588">8 Válvula de aislamiento de salida V2 (punto LOTO)</text>
    <text x="480" y="608">9 Colector de retorno   10 Venteo y dren (drenado y prueba hidrostática)</text>
    <text x="480" y="628">11 PLC: lógica de fuga ΔQ (alarma 2 %, disparo 4 %)</text>
  </g>
</svg>
