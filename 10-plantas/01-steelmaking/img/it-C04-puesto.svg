  <circle cx="820" cy="530" r="16" fill="#43A047" stroke="#2E7D32" stroke-width="2"/>
  <text x="820" y="534" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">PR3</text>
  <path d="M820,480 L820,510" fill="none" stroke="#2E7D32" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrG)"/>
  <rect x="20" y="560" width="960" height="290" fill="#FAFAFA" stroke="#455A64" stroke-width="1"/>
  <text x="35" y="582" font-size="14" fill="#212121" text-anchor="start" font-weight="bold">Leyenda</text>
  <text x="35" y="602" font-size="12" fill="#212121" text-anchor="start">1  Pórtico de radiación y chatarra seca (MS-ACE-03, MS-ACE-07)</text>
  <text x="35" y="620" font-size="12" fill="#212121" text-anchor="start">2  EAF: agua de paneles Δ caudal ≤ 2 %; roja ≤ 10 m del EBT al vaciar</text>
  <text x="35" y="638" font-size="12" fill="#212121" text-anchor="start">3  Fosas bajo vaciado y foso de escoria: cero agua estancada</text>
  <text x="35" y="656" font-size="12" fill="#212121" text-anchor="start">4  LF: plataforma de electrodos con llave cautiva; fosas con monitor de O₂</text>
  <text x="35" y="674" font-size="12" fill="#212121" text-anchor="start">5  Preparación de ollas: cara caliente ≥ 1,000 °C y lista firmada</text>
  <text x="35" y="692" font-size="12" fill="#212121" text-anchor="start">6  Grúas de colada: checklist diario, doble freno, ruta despejada (soy dueño)</text>
  <text x="35" y="710" font-size="12" fill="#212121" text-anchor="start">7  Fosa de emergencia seca y libre (1 olla)</text>
  <text x="35" y="728" font-size="12" fill="#212121" text-anchor="start">8  CC1: agua de molde; agua de emergencia entra en ≤ 15 s</text>
  <text x="35" y="746" font-size="12" fill="#212121" text-anchor="start">9  CC2: 6 líneas, nivel radiométrico con Cs-137 (MS-ACE-07)</text>
  <text x="35" y="764" font-size="12" fill="#212121" text-anchor="start">10  Torre de agua de emergencia y bombas diésel (prueba mensual MM-CC-03)</text>
  <text x="35" y="782" font-size="12" fill="#212121" text-anchor="start">11  Oficina de turno: puesto de mando inicial del Comandante del Incidente</text>
  <text x="560" y="582" font-size="13" fill="#212121" text-anchor="start" font-weight="bold">Zonas y tiempos del CI (MS-ACE-09)</text>
  <rect x="560" y="594" width="18" height="14" fill="#C62828" stroke="#C62828" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="606" font-size="12" fill="#212121" text-anchor="start">ROJA: solo personal esencial, EPP aluminizado</text>
  <rect x="560" y="614" width="18" height="14" fill="#FBC02D" stroke="#F9A825" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="626" font-size="12" fill="#212121" text-anchor="start">AMARILLA: autorizado, tras barrera, EPP completo</text>
  <rect x="560" y="634" width="18" height="14" fill="#43A047" stroke="#2E7D32" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="646" font-size="12" fill="#212121" text-anchor="start">VERDE: tránsito con EPP básico de nave</text>
  <line x1="560" y1="661" x2="578" y2="661" stroke="#2E7D32" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="585" y="666" font-size="12" fill="#212121" text-anchor="start">Ruta de escape → salida (verde en el muro)</text>
  <text x="560" y="690" font-size="12" fill="#212121" text-anchor="start">30 s: todos a zona verde o refugio y alarma</text>
  <text x="560" y="708" font-size="12" fill="#212121" text-anchor="start">≤ 1 min: el púlpito me reporta · ≤ 2 min: estado seguro</text>
  <text x="560" y="726" font-size="12" fill="#212121" text-anchor="start">≤ 5 min: brigada en el punto · ≤ 10 min: conteo completo</text>
  <text x="560" y="744" font-size="12" fill="#212121" text-anchor="start">Evacuación: fuga EAF o perforación de olla ≥ 25 m</text>
  <text x="560" y="762" font-size="12" fill="#212121" text-anchor="start">Breakout: bajo la máquina y ≥ 20 m · gas: todo el sector</text>
  <text x="560" y="780" font-size="12" fill="#C62828" text-anchor="start">Canal 1 de radio = solo CI y líderes de sector [Supuesto]</text>
  <text x="560" y="798" font-size="12" fill="#C62828" text-anchor="start">PR1 hornos y patio · PR2 ollas y LF · PR3 CC1 y CC2</text>
