  <text x="330" y="334" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">EAF-2</text>
  <rect x="215" y="430" width="90" height="40" fill="url(#hatchSlag)" stroke="#6D4C41" stroke-width="2"/>
  <text x="260" y="455" font-size="11" fill="#212121" text-anchor="middle">fosas</text>
  <circle cx="520" cy="160" r="26" fill="#E65100" stroke="#8D6E63" stroke-width="5"/>
  <text x="520" y="200" font-size="11" fill="#212121" text-anchor="middle" font-weight="bold">LF-1</text>
  <circle cx="600" cy="160" r="26" fill="#E65100" stroke="#8D6E63" stroke-width="5"/>
  <text x="600" y="200" font-size="11" fill="#212121" text-anchor="middle" font-weight="bold">LF-2</text>
  <rect x="490" y="250" width="140" height="50" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="560" y="280" font-size="11" fill="#212121" text-anchor="middle">preparación de ollas</text>
