  <circle cx="330" cy="170" r="30" fill="#8D6E63" stroke="#455A64" stroke-width="2"/>
  <text x="330" y="174" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">EAF-1</text>
  <circle cx="330" cy="330" r="60" fill="#FBC02D" stroke="#F9A825" stroke-width="1.2" fill-opacity="0.28"/>
