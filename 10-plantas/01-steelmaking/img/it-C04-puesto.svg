  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">Figura IT-C04. Mi turno en la nave: puntos de verificación (VCC), puesto de mando y puntos de reunión</text>
  <text x="500" y="46" text-anchor="middle" font-size="12" fill="#212121">Esquemático sin escala, vista en planta. Basado en MS-ACE-01 (Figura 1) y MS-ACE-09; ubicaciones [Supuesto — Validar con C-16]</text>
