<text x="500.0" y="46" font-size="12" fill="#212121" text-anchor="middle">Cada oficio: Técnico C → B → A. Flechas M1–M5 = ascenso con certificación TD-P07 de los procesos MM- del oficio + DC-3 (ver §3.3).</text>
