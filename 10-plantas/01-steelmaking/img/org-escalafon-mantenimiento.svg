<text x="20" y="599" font-size="12" fill="#212121" text-anchor="start">M1  Ingreso → S-26: MS-ACE-02 (LOTO), MS-ACE-10 (altura) · DC-3 NOM-009, NOM-006, NOM-017</text>
<text x="20" y="618" font-size="12" fill="#212121" text-anchor="start">M2  S-26 → S-19 C: MS-ACE-02/05/10, MM-GR-01 (inspección) · NOM-004, NOM-033 · examen de suficiencia (art. 153-U)</text>
<text x="20" y="637" font-size="12" fill="#212121" text-anchor="start">M3  Técnico C → B: procesos MM- del oficio como R + 150 órdenes de trabajo en CMMS · NOM del oficio: S-20/S-21 NOM-029, S-23 NOM-027,</text>
