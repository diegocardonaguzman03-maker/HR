  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#212121">Figura 7. Corte de la olla de 150 t: refractario, válvula deslizante y tapón poroso</text>
  <text x="500" y="47" text-anchor="middle" font-size="12" fill="#455A64">Flota de 10 ollas (7 en ciclo) · vida del refractario 60–80 coladas · dimensiones ilustrativas [Validar con OEM / Especialista de Refractarios C-15]</text>

  <!-- coraza -->
  <path d="M130,90 L550,90 L520,600 L160,600 Z" fill="#455A64"/>
