    <circle cx="440" cy="560" r="11" fill="#C62828"/><text x="440" y="564" text-anchor="middle">11</text>
    <circle cx="530" cy="655" r="11" fill="#43A047"/><text x="530" y="659" text-anchor="middle">12</text>
