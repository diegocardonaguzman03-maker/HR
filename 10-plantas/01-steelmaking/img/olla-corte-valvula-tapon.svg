  <text x="340" y="360" text-anchor="middle" fill="#ffffff" font-weight="bold">acero líquido 150 t</text>
  <text x="340" y="380" text-anchor="middle" fill="#ffffff" font-size="12">cara caliente precalentada 1,000–1,100 °C</text>

