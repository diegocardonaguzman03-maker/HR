  <rect x="580" y="520" width="410" height="210" fill="#FAFAFA" stroke="#455A64"/>
  <text x="590" y="540" font-weight="bold" fill="#212121">Leyenda</text>
  <g font-size="11" fill="#212121">
    <text x="590" y="558">1 Coraza de acero (termografía: alarma &gt; 350 °C [Supuesto])</text>
    <text x="590" y="575">2 Revestimiento de seguridad (permanente)</text>
    <text x="590" y="592">3 Línea de escoria MgO-C (desgaste crítico)</text>
    <text x="590" y="609">4 Barril Al₂O₃-MgO-C · 5 Fondo Al₂O₃-MgO-C</text>
    <text x="590" y="626">6 Bloque de asiento (well block) · 7 Arena de cromita</text>
    <text x="590" y="643">8 Válvula deslizante (placas de 2 o 3 piezas)</text>
    <text x="590" y="660">9 Buza colectora · 10 Cilindro hidráulico</text>
    <text x="590" y="677">11 Tapón poroso (1–2) · 12 Línea de argón + acople</text>
    <text x="590" y="694">13 Muñones (2) · 14 Escoria de olla</text>
    <text x="590" y="716" fill="#C62828">Olla fría fuera de ciclo &gt; 4 h: precalentar ≥ 8 h</text>
