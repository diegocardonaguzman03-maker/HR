  <rect x="195" y="409" width="10" height="9" fill="#9E9E9E" stroke="#9E9E9E" stroke-width="1"/>
  <text x="170" y="342" font-size="11" fill="#212121" text-anchor="start">Posición de medición</text>
  <text x="170" y="356" font-size="11" fill="#212121" text-anchor="start">(de lado, ≥ 1.5 m)</text>
  <path d="M185,400 L60,400" fill="none" stroke="#2E7D32" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrG)"/>
  <text x="40" y="390" font-size="11" fill="#2E7D32" text-anchor="start" font-weight="bold">zona verde / PR2</text>
  <rect x="20" y="530" width="960" height="280" fill="#FAFAFA" stroke="#455A64" stroke-width="1"/>
  <text x="35" y="552" font-size="14" fill="#212121" text-anchor="start" font-weight="bold">Leyenda</text>
  <text x="35" y="572" font-size="12" fill="#212121" text-anchor="start">1  Plataforma de electrodos: solo con interruptor abierto y llave cautiva / LOTO</text>
  <text x="35" y="590" font-size="12" fill="#212121" text-anchor="start">2  Electrodos de 457 mm (18"): nunca te acerques con arco encendido</text>
  <text x="35" y="608" font-size="12" fill="#212121" text-anchor="start">3  Bóveda enfriada por agua: si hay alarma de fuga, evacúa a ≥ 25 m</text>
  <text x="35" y="626" font-size="12" fill="#212121" text-anchor="start">4  Alimentador de alambre: metros y velocidad según receta; guías cerradas</text>
  <text x="35" y="644" font-size="12" fill="#212121" text-anchor="start">5  Bobinas de alambre: secas, bajo techo, izaje con dispositivo certificado</text>
  <text x="35" y="662" font-size="12" fill="#212121" text-anchor="start">6  Tapón poroso en el fondo de la olla: el argón hace burbujear el baño</text>
  <text x="35" y="680" font-size="12" fill="#212121" text-anchor="start">7  Estación de argón y conexión rápida: revisa fugas en cada conexión</text>
  <text x="35" y="698" font-size="12" fill="#212121" text-anchor="start">8  Lanza de medición: T, O y muestra con sonda seca</text>
  <text x="35" y="716" font-size="12" fill="#212121" text-anchor="start">9  Mi posición de medición: de lado, con EPP aluminizado, ≤ 2 min en roja</text>
  <text x="35" y="734" font-size="12" fill="#212121" text-anchor="start">10  Monitor de O₂ en la fosa: alarma &lt; 19.5 % o &gt; 23.5 %</text>
  <text x="560" y="552" font-size="13" fill="#212121" text-anchor="start" font-weight="bold">Zonas y valores clave</text>
  <rect x="560" y="564" width="18" height="14" fill="#C62828" stroke="#C62828" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="576" font-size="12" fill="#212121" text-anchor="start">ROJA: solo personal esencial, EPP aluminizado</text>
  <rect x="560" y="584" width="18" height="14" fill="#FBC02D" stroke="#F9A825" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="596" font-size="12" fill="#212121" text-anchor="start">AMARILLA: autorizado, tras barrera, EPP completo</text>
  <rect x="560" y="604" width="18" height="14" fill="#43A047" stroke="#2E7D32" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="616" font-size="12" fill="#212121" text-anchor="start">VERDE: tránsito con EPP básico de nave</text>
  <line x1="560" y1="631" x2="578" y2="631" stroke="#2E7D32" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="585" y="636" font-size="12" fill="#212121" text-anchor="start">Ruta de escape → salida (verde en el muro)</text>
  <text x="560" y="660" font-size="12" fill="#212121" text-anchor="start">Ar inicial 100–200 NL/min · fuerte 400–600 NL/min</text>
  <text x="560" y="678" font-size="12" fill="#212121" text-anchor="start">Ar suave 50–150 NL/min, ≥ 8 min sin adiciones</text>
  <text x="560" y="696" font-size="12" fill="#212121" text-anchor="start">CaSi 0.3–0.5 kg/t a 150–250 m/min [Supuesto]</text>
  <text x="560" y="714" font-size="12" fill="#212121" text-anchor="start">Nadie frente a la ventana durante la inyección de CaSi</text>
  <text x="560" y="732" font-size="12" fill="#212121" text-anchor="start">Detector personal: CO 25 ppm → sal; 200 ppm → evacuación</text>
  <text x="560" y="750" font-size="12" fill="#C62828" text-anchor="start">Entrada a fosa: permiso, medición O₂ → LEL → CO y vigía</text>
