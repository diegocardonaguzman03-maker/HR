  <rect x="495" y="397" width="20" height="8" fill="#43A047" stroke="#2E7D32" stroke-width="1"/>
  <rect x="340" y="212" width="240" height="28" fill="#455A64" stroke="#263238" stroke-width="2"/>
  <line x1="345" y1="226" x2="575" y2="226" stroke="#1E88E5" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="420" y="100" width="16" height="150" fill="#616161" stroke="#263238" stroke-width="1"/>
  <rect x="452" y="100" width="16" height="150" fill="#616161" stroke="#263238" stroke-width="1"/>
  <rect x="484" y="100" width="16" height="150" fill="#616161" stroke="#263238" stroke-width="1"/>
  <rect x="330" y="150" width="260" height="8" fill="#455A64" stroke="#263238" stroke-width="1.5"/>
  <line x1="340" y1="150" x2="340" y2="128" stroke="#455A64" stroke-width="2"/>
  <line x1="380" y1="150" x2="380" y2="128" stroke="#455A64" stroke-width="2"/>
  <line x1="420" y1="150" x2="420" y2="128" stroke="#455A64" stroke-width="2"/>
