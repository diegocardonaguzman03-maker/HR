  <text x="200" y="120" font-size="12" fill="#212121" text-anchor="start" font-weight="bold">Plataforma de electrodos</text>
  <text x="200" y="136" font-size="11" fill="#212121" text-anchor="start">interruptor abierto +</text>
  <text x="200" y="150" font-size="11" fill="#C62828" text-anchor="start">llave cautiva o LOTO</text>
  <rect x="720" y="150" width="130" height="60" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="785" y="175" font-size="12" fill="#212121" text-anchor="middle" font-weight="bold">Alimentador</text>
  <text x="785" y="192" font-size="11" fill="#212121" text-anchor="middle">2 líneas · guías cerradas</text>
  <path d="M720,170 L620,170 L545,205 L530,330" fill="none" stroke="#212121" stroke-width="2"/>
  <path d="M720,190 L630,190 L560,210 L545,330" fill="none" stroke="#9E9E9E" stroke-width="2"/>
  <text x="628" y="236" font-size="11" fill="#212121" text-anchor="start">alambre CaSi / Al / C</text>
  <circle cx="760" cy="330" r="32" fill="#CFD8DC" stroke="#455A64" stroke-width="2"/>
  <circle cx="760" cy="330" r="10" fill="#FFFFFF" stroke="#455A64" stroke-width="1"/>
  <circle cx="830" cy="330" r="32" fill="#CFD8DC" stroke="#455A64" stroke-width="2"/>
  <circle cx="830" cy="330" r="10" fill="#FFFFFF" stroke="#455A64" stroke-width="1"/>
