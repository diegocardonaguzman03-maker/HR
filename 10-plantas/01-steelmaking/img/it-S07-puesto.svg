  </defs>
  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">Figura IT-S07. Mi estación: piso del horno olla — alambre, argón y medición (vista lateral)</text>
  <text x="500" y="46" text-anchor="middle" font-size="12" fill="#212121">Esquemático sin escala. Valores de MO-LF-01 y FT-ACE-001 §3; zonas según MS-ACE-01 [Supuesto — Validar con C-16]</text>
  <rect x="150" y="430" width="130" height="14" fill="#FBC02D" stroke="#F9A825" stroke-width="1.2" fill-opacity="0.28"/>
  <rect x="280" y="430" width="360" height="14" fill="url(#hatchRed)" stroke="#C62828" stroke-width="1.5"/>
  <rect x="640" y="430" width="130" height="14" fill="#FBC02D" stroke="#F9A825" stroke-width="1.2" fill-opacity="0.28"/>
  <line x1="20" y1="430" x2="980" y2="430" stroke="#455A64" stroke-width="3"/>
  <text x="460" y="460" font-size="12" fill="#C62828" text-anchor="middle">Roja ≤ 5 m de la ventana / agujero de muestreo · Amarilla 5–15 m</text>
  <rect x="340" y="466" width="240" height="40" fill="none" stroke="#C62828" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="460" y="490" font-size="11" fill="#C62828" text-anchor="middle">Fosa del carro: aquí se acumula el argón</text>
  <rect x="595" y="472" width="34" height="22" fill="#FFFFFF" stroke="#43A047" stroke-width="2"/>
  <text x="612" y="487" font-size="12" fill="#2E7D32" text-anchor="middle" font-weight="bold">O₂</text>
  <rect x="350" y="405" width="220" height="22" fill="#455A64" stroke="#263238" stroke-width="1.5"/>
