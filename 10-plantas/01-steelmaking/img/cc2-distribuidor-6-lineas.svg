<text x="560" y="680" font-size="13" font-weight="bold" fill="#212121">Leyenda</text>
<text x="560" y="700" font-size="12" fill="#212121">1 Carcasa de acero del distribuidor</text>
<text x="560" y="719" font-size="12" fill="#212121">2 Refractario permanente</text>
<text x="560" y="738" font-size="12" fill="#212121">3 Revestimiento de trabajo (proyectado MgO) [Validar]</text>
<text x="560" y="757" font-size="12" fill="#212121">4 Almohadilla / caja de impacto bajo el tubo de olla</text>
<text x="560" y="776" font-size="12" fill="#212121">5 Presas bajas con perforaciones (diques)</text>
<text x="560" y="795" font-size="12" fill="#212121">6 Tubo protector de olla con sello de argón</text>
<text x="560" y="814" font-size="12" fill="#212121">7 Bloque asiento (well block)</text>
<text x="560" y="833" font-size="12" fill="#212121">8 Buza calibrada ZrO₂ Ø 20–24 mm (160 mm; nominal 22)</text>
<text x="560" y="852" font-size="12" fill="#212121">9 Mecanismo de cambio rápido / placa ciega</text>
<text x="560" y="871" font-size="12" fill="#212121">10 Capa de cubierta (polvo cubridor) sobre el acero</text>
<text x="560" y="890" font-size="12" fill="#212121">11 Chorro abierto hacia el molde</text>
<text x="560" y="909" font-size="12" fill="#212121">12 Molde (tubo de Cu) de cada línea</text>
<text x="560" y="928" font-size="12" fill="#C62828">Capacidad 30 t · nivel de operación 700–850 mm</text>
<text x="560" y="947" font-size="12" fill="#C62828">Sobrecalentamiento 20–35 °C (medir en el distribuidor)</text>
<text x="560" y="966" font-size="12" fill="#C62828">Orden de apertura sugerido: L3-L4, L2-L5, L1-L6 [Validar]</text>
