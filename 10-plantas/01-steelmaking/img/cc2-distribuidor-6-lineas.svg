<text x="30" y="878" font-size="11" fill="#212121">Para cerrar una línea se empuja una PLACA CIEGA (sin orificio) al lugar de la buza.</text>
<text x="30" y="894" font-size="11" fill="#212121">Respaldo: tapón cónico con varilla de taponeo desde la tapa del distribuidor.</text>
