<text x="828.5" y="356" text-anchor="end" font-size="11" fill="#455A64">EBT, proyección, agua</text>
<text x="945" y="350" text-anchor="middle" font-size="12" fill="#212121">0 kWh/t</text>
<text x="945" y="365" text-anchor="middle" font-size="12" fill="#43A047">0 Nm³/t</text>
<line x1="905" y1="385" x2="990" y2="385" stroke="#212121"/>
<text x="945" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#212121">560 kWh/t</text>
<text x="945" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#43A047">35 Nm³/t (total)</text>
<rect x="20" y="440" width="960" height="185" fill="#FAFAFA" stroke="#455A64"/>
<text x="30" y="460" font-size="12" font-weight="bold" fill="#212121">Leyenda y notas</text>
<text x="30" y="480" font-size="12" fill="#212121">(1) Carga: 3 min por canasta, arco apagado. Con 2.ª canasta suma ≈ 3 min más (tap-to-tap ≈ 58 min).</text>
<text x="30" y="500" font-size="12" fill="#212121">(2) Fusión de canasta: perforación con tap bajo (≈ 2 min), luego tap máximo con quemadores en modo quemador.</text>
<text x="30" y="520" font-size="12" fill="#212121">(3) DRI por el 5.º agujero a 30–35 kg/min/MW (≈ 3.6–4.2 t/min a ≈ 119 MW); inicia con ≥ 70% de la canasta fundida y escoria espumosa.</text>
<text x="30" y="540" font-size="12" fill="#212121">(4) Afino: DRI detenido, medición de T y O activo, ajuste final a 1,630 ± 15 °C.   (5) Vaciado EBT de 150 t, adiciones, talón 20–30 t retenido.</text>
<text x="30" y="560" font-size="12" fill="#212121">(6) Preparación: inspección, llenado del EBT, proyección refractaria, verificación de agua.   (7) Barra amarilla = arco encendido.</text>
<text x="30" y="580" font-size="12" fill="#C62828">Nota (FT-ACE-001 v0.3): 560 kWh/t ≈ 84 MWh ≈ 42–44 min a ≈ 119 MW activos; cada +15 kWh/t alarga el arco ≈ 1 min.</text>
<text x="30" y="600" font-size="12" fill="#C62828">Ver la inconsistencia registrada en MO-EAF-04. [Validar con OEM / Ingeniería de Proceso]</text>
</svg>