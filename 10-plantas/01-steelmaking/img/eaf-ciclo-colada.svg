<text x="786.0" y="306" text-anchor="end" font-size="11" fill="#455A64">T y O activo</text>
<text x="945" y="300" text-anchor="middle" font-size="12" fill="#212121">50 kWh/t</text>
<text x="945" y="315" text-anchor="middle" font-size="12" fill="#43A047">4 Nm³/t</text>
