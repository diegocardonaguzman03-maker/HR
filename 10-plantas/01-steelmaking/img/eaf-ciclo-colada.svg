<rect x="840.0" y="335" width="60.0" height="32" fill="#6D4C41" rx="3"/>
<text x="870.0" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">5 min</text>
<text x="834.0" y="356" text-anchor="end" font-size="11" fill="#455A64">150 t a la olla</text>
<text x="945" y="350" text-anchor="middle" font-size="12" fill="#212121">0 kWh/t</text>
