<line x1="905" y1="385" x2="990" y2="385" stroke="#212121"/>
<text x="945" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#212121">640 kWh/t</text>
<text x="945" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#43A047">32 Nm³/t (total)</text>
<rect x="20" y="440" width="960" height="185" fill="#FAFAFA" stroke="#455A64"/>
<text x="30" y="460" font-size="12" fill="#212121"><tspan font-weight="bold">Leyenda y notas</tspan></text>
<text x="30" y="480" font-size="12" fill="#212121">(1) Preparación (MO-EAF-01): verificación de agua, proyección, EBT con arena seca; queda un pie líquido de 30–40 t para fundir el DRI.</text>
<text x="30" y="500" font-size="12" fill="#212121">(2) Canasta de retornos internos (MO-EAF-02): 10–20 t sobre el pie líquido, 1 de cada 2–4 coladas; suma ≈ 3 min (tap-to-tap ≈ 63 min; promedio ≈ 61 min).</text>
<text x="30" y="520" font-size="12" fill="#212121">(3) Arranque sobre pie líquido: tap 12, arco estable, espuma formándose; DRI en rampa 20 → 32 kg/min/MW. No hay perforación ni fusión de canasta.</text>
<text x="30" y="540" font-size="12" fill="#212121">(4) DRI por el 5.º agujero a 30–35 kg/min/MW (≈ 3.5–4.3 t/min) con tap 15 solo con arco cubierto.   (5) Afino: DRI detenido, T y O activo, 1,630 ± 15 °C.</text>
<text x="30" y="560" font-size="12" fill="#212121">(6) Vaciado EBT de 150 t con adiciones; talón de 30–40 t retenido.   (7) Barra amarilla = arco encendido.</text>
<text x="30" y="580" font-size="12" fill="#C62828">Balance (FT-ACE-001 v0.4 §9): 640 kWh/t × 150 t = 96 MWh ≈ 50 min a ≈ 115 MW medios (límite 119 MW = 140 MVA × FP 0.85).</text>
<text x="30" y="600" font-size="12" fill="#C62828">2.2 Mt/año = 7,333 coladas por horno; a ≈ 61 min cierra con ≈ 5 % de holgura. Arriba de ≈ 680 kWh/t no alcanza. [Validar con OEM / Ingeniería de Proceso]</text>
</svg>
