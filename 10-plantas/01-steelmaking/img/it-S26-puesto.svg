="#212121">B reductores (muestra trimestral)</text><text x="400" y="620" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">C poleas</text><text x="400" y="635" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">D ruedas y rieles</text><text x="400" y="650" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Anclaje certificado ≥ 22.2 kN</text><text x="400" y="665" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Grúa en LOTO: E1a, E1b, E1c,</text><text x="400" y="680" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">E-M2 y grúa vecina (E-M3)</text><text x="30" y="755" font-size="12" text-anchor="start" font-weight="bold" fill="#212121">Lubricante, cantidad y frecuencia según la carta de lubricación del CMMS. Sin contaminación cruzada.</text>
