<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#1E88E5"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#212121">Figura MM-CC-03. Agua de molde (circuito cerrado) y sistema de agua de emergencia</text>
  <text x="480" y="51" text-anchor="middle" font-size="12" fill="#455A64">CC1 y CC2 · cambio automático a emergencia ≤ 15 s (FT-ACE-001 §4–§5) · configuración [Validar con OEM / Ingeniería de Mantenimiento]</text>

  <!-- Tanque -->
  <rect x="40" y="380" width="150" height="110" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <rect x="40" y="410" width="150" height="80" fill="#64B5F6" opacity="0.6"/>
  <text x="115" y="440" text-anchor="middle" font-size="12" font-weight="bold">Tanque de agua</text>
  <text x="115" y="456" text-anchor="middle" font-size="12" font-weight="bold">tratada (cerrado)</text>

  <!-- Succión y bombas principales -->
  <line x1="190" y1="470" x2="400" y2="470" stroke="#1E88E5" stroke-width="5"/>
  <g stroke="#1E88E5" stroke-width="4">
    <line x1="250" y1="470" x2="250" y2="440"/><line x1="310" y1="470" x2="310" y2="440"/><line x1="370" y1="470" x2="370" y2="440"/>
    <line x1="250" y1="396" x2="250" y2="360"/><line x1="310" y1="396" x2="310" y2="360"/><line x1="370" y1="396" x2="370" y2="360"/>
  </g>
  <g fill="#ffffff" stroke="#212121" stroke-width="2">
    <circle cx="250" cy="418" r="22"/><circle cx="310" cy="418" r="22"/><circle cx="370" cy="418" r="22"/>
  </g>
  <g font-size="10" font-weight="bold" text-anchor="middle"><text x="250" y="422">P-1</text><text x="310" y="422">P-2</text><text x="370" y="422">P-3</text></g>
  <text x="310" y="505" text-anchor="middle" font-size="11">Bombas eléctricas principales (2 + 1 reserva)</text>
  <!-- Cabezal de suministro -->
  <line x1="250" y1="360" x2="740" y2="360" stroke="#1E88E5" stroke-width="6" marker-end="url(#f)"/>
  <!-- HX -->
  <rect x="420" y="335" width="70" height="50" fill="#ffffff" stroke="#212121" stroke-width="2"/>
  <path d="M 425 375 L 440 345 L 455 375 L 470 345 L 485 375" stroke="#C62828" fill="none" stroke-width="2"/>
  <text x="455" y="400" text-anchor="middle" font-size="10">Intercambiador</text>
  <!-- Filtro -->
  <polygon points="520,340 545,340 545,380 520,380" fill="#ffffff" stroke="#212121" stroke-width="2"/>
  <line x1="520" y1="340" x2="545" y2="380" stroke="#212121"/>
  <text x="532" y="400" text-anchor="middle" font-size="10">Filtro ΔP</text>

  <!-- Torre de emergencia -->
  <rect x="610" y="80" width="100" height="110" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/>
  <rect x="610" y="100" width="100" height="90" fill="#64B5F6" opacity="0.6"/>
  <line x1="620" y1="190" x2="620" y2="250" stroke="#455A64" stroke-width="4"/>
  <line x1="700" y1="190" x2="700" y2="250" stroke="#455A64" stroke-width="4"/>
  <text x="660" y="140" text-anchor="middle" font-size="12" font-weight="bold">Torre de</text>
  <text x="660" y="156" text-anchor="middle" font-size="12" font-weight="bold">emergencia</text>
  <circle cx="735" cy="120" r="14" fill="#ffffff" stroke="#212121" stroke-width="1.5"/>
  <text x="735" y="124" text-anchor="middle" font-size="10">LT</text>
  <line x1="710" y1="120" x2="721" y2="120" stroke="#212121"/>
  <!-- Bajante con XV-1 -->
  <line x1="660" y1="190" x2="660" y2="360" stroke="#1E88E5" stroke-width="5"/>
  <path d="M 648 262 L 672 262 L 648 290 L 672 290 Z" fill="#ffffff" stroke="#C62828" stroke-width="2"/>
  <rect x="672" y="266" width="28" height="20" fill="#FFEBEE" stroke="#C62828"/>
  <text x="686" y="280" text-anchor="middle" font-size="9">FO</text>
  <text x="706" y="282" font-size="11" fill="#C62828" font-weight="bold">XV-1</text>
  <!-- Retención en bajante -->
  <path d="M 652 320 L 668 320 L 660 334 Z" fill="#212121"/>

  <!-- Diesel -->
  <line x1="115" y1="380" x2="115" y2="230" stroke="#1E88E5" stroke-width="4"/>
  <line x1="115" y1="230" x2="600" y2="230" stroke="#1E88E5" stroke-width="4"/>
  <line x1="600" y1="230" x2="600" y2="360" stroke="#1E88E5" stroke-width="4"/>
  <rect x="190" y="200" width="70" height="60" rx="6" fill="#ECEFF1" stroke="#212121" stroke-width="2"/>
  <text x="225" y="228" text-anchor="middle" font-size="11" font-weight="bold">D-1</text>
  <text x="225" y="244" text-anchor="middle" font-size="10">diésel</text>
  <rect x="290" y="200" width="70" height="60" rx="6" fill="#ECEFF1" stroke="#212121" stroke-width="2"/>
  <text x="325" y="228" text-anchor="middle" font-size="11" font-weight="bold">D-2</text>
  <text x="325" y="244" text-anchor="middle" font-size="10">diésel</text>
  <path d="M 592 300 L 608 300 L 600 314 Z" fill="#212121"/>
  <text x="290" y="190" text-anchor="middle" font-size="11">Bombas diésel de emergencia (1 + 1), arranque automático</text>
  <rect x="390" y="205" width="60" height="18" fill="#FFF3E0" stroke="#FF8F00"/>
  <text x="420" y="218" text-anchor="middle" font-size="9">Tanque diésel</text>

  <!-- Moldes -->
  <rect x="748" y="300" width="200" height="130" fill="#FFE0B2" stroke="#E65100" stroke-width="2"/>
  <text x="848" y="330" text-anchor="middle" font-weight="bold">Moldes</text>
  <text x="848" y="350" text-anchor="middle" font-size="10.5">CC1: caras anchas ≈ 4,200 L/min c/u</text>
  <text x="848" y="366" text-anchor="middle" font-size="10.5">caras angostas ≈ 450 L/min c/u</text>
  <text x="848" y="382" text-anchor="middle" font-size="10.5">CC2: ≈ 2,000 L/min por línea</text>
  <text x="848" y="398" text-anchor="middle" font-size="10.5">Alarma: Q &lt; 90 %; ΔT &gt; 11 °C (CC1)</text>
  <text x="848" y="414" text-anchor="middle" font-size="10.5">ΔT &gt; 12 °C (CC2)</text>
  <!-- Instrumentos -->
  <circle cx="715" cy="330" r="13" fill="#ffffff" stroke="#212121" stroke-width="1.5"/>
  <text x="715" y="334" text-anchor="middle" font-size="9">PT</text>
  <line x1="715" y1="343" x2="715" y2="360" stroke="#212121"/>
  <circle cx="760" cy="455" r="13" fill="#ffffff" stroke="#212121" stroke-width="1.5"/>
  <text x="760" y="459" text-anchor="middle" font-size="9">FT</text>
  <circle cx="800" cy="455" r="13" fill="#ffffff" stroke="#212121" stroke-width="1.5"/>
  <text x="800" y="459" text-anchor="middle" font-size="9">TT</text>
  <!-- Retorno -->
  <line x1="845" y1="430" x2="845" y2="540" stroke="#1565C0" stroke-width="5"/>
  <line x1="845" y1="540" x2="150" y2="540" stroke="#1565C0" stroke-width="5"/>
  <line x1="150" y1="540" x2="150" y2="490" stroke="#1565C0" stroke-width="5" marker-end="url(#f)"/>
  <text x="500" y="558" text-anchor="middle" font-size="11">Retorno caliente al tanque (vía intercambiador / torre de enfriamiento del circuito)</text>

  <!-- Números -->
  <g font-size="12" font-weight="bold" fill="#ffffff">
    <circle cx="30" cy="370" r="11" fill="#212121"/><text x="30" y="374" text-anchor="middle">1</text>
    <circle cx="400" cy="418" r="11" fill="#212121"/><text x="400" y="422" text-anchor="middle">2</text>
    <circle cx="455" cy="322" r="11" fill="#212121"/><text x="455" y="326" text-anchor="middle">3</text>
    <circle cx="532" cy="322" r="11" fill="#212121"/><text x="532" y="326" text-anchor="middle">4</text>
    <circle cx="595" cy="92" r="11" fill="#212121"/><text x="595" y="96" text-anchor="middle">5</text>
    <circle cx="636" cy="276" r="11" fill="#212121"/><text x="636" y="280" text-anchor="middle">6</text>
    <circle cx="175" cy="212" r="11" fill="#212121"/><text x="175" y="216" text-anchor="middle">7</text>
    <circle cx="582" cy="306" r="11" fill="#212121"/><text x="582" y="310" text-anchor="middle">8</text>
    <circle cx="735" cy="292" r="11" fill="#212121"/><text x="735" y="296" text-anchor="middle">9</text>
    <circle cx="780" cy="480" r="11" fill="#212121"/><text x="780" y="484" text-anchor="middle">10</text>
  </g>

  <!-- Lógica -->
  <rect x="20" y="572" width="440" height="138" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <g font-size="12" fill="#212121">
    <text x="32" y="592" font-weight="bold" fill="#C62828" font-size="11.5">Cambio automático · prueba mensual en paro · diésel semanal</text>
    <text x="32" y="612">Disparo: pérdida de energía de P-1/P-2/P-3, o P cabezal</text>
    <text x="32" y="628">&lt; P mín (PSLL), o Q molde &lt; 80 % [Validar OEM]</text>
    <text x="32" y="648">→ XV-1 abre por falla-abierta (resorte / sin energía)</text>
    <text x="32" y="666">→ arranca D-1 (D-2 si D-1 no da presión en 10 s)</text>
    <text x="32" y="684" font-weight="bold">Criterio: Q en molde ≥ 90 % en ≤ 15 s</text>
    <text x="32" y="702">Autonomía torre ≥ tiempo de vaciado de la línea [Validar]</text>
  </g>
  <!-- Leyenda -->
  <rect x="470" y="572" width="470" height="138" fill="#FAFAFA" stroke="#B0BEC5"/>
  <g font-size="12" fill="#212121">
    <text x="482" y="592" font-weight="bold">Leyenda</text>
    <text x="482" y="610">1 Tanque de agua tratada   2 Bombas principales P-1/2/3</text>
    <text x="482" y="628">3 Intercambiador de placas   4 Filtro/colador con ΔP</text>
    <text x="482" y="646">5 Torre elevada con transmisor de nivel LT</text>
    <text x="482" y="664">6 XV-1 válvula de cambio falla-abierta (FO)</text>
    <text x="482" y="682">7 Bombas diésel D-1/D-2   8 Válvulas de retención</text>
    <text x="482" y="700">9 PT cabezal   10 FT/TT por cara (CC1) o línea (CC2)</text>
  </g>
</svg>
