<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="fl" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#455A64"/></marker>
    <marker id="fm" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#E65100"/></marker>
  </defs>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#212121">Figura 1. Flujo general de la Acería (Complejo Acería Norte)</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#455A64">Valores de FT-ACE-001 v0.1 · 2.2 Mt/año de acero líquido · operación 24/7</text>

  <!-- 1 DRI -->
  <rect x="30" y="90" width="170" height="80" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="115" y="115" text-anchor="middle" font-weight="bold" fill="#212121">(1) Planta DRI</text>
  <text x="115" y="135" text-anchor="middle" font-size="12" fill="#212121">DRI/HBI · 60% de la carga</text>
  <text x="115" y="152" text-anchor="middle" font-size="12" fill="#212121">caliente 500–650 °C</text>
  <!-- 2 transportador -->
  <line x1="200" y1="130" x2="330" y2="130" stroke="#455A64" stroke-width="4" marker-end="url(#fl)"/>
  <text x="265" y="112" text-anchor="middle" font-size="12" fill="#212121">(2) transportador</text>
  <text x="265" y="154" text-anchor="middle" font-size="11" fill="#455A64">3.5–5.0 t/min</text>

  <!-- 3 Patio -->
  <rect x="30" y="300" width="170" height="80" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="115" y="325" text-anchor="middle" font-weight="bold" fill="#212121">(3) Patio de chatarra</text>
  <text x="115" y="345" text-anchor="middle" font-size="12" fill="#212121">pórtico de radiación</text>
  <text x="115" y="362" text-anchor="middle" font-size="12" fill="#212121">40% de la carga</text>
  <line x1="200" y1="340" x2="330" y2="250" stroke="#455A64" stroke-width="4" marker-end="url(#fl)"/>
  <text x="215" y="410" font-size="12" fill="#212121">(4) canasta 90 m³</text>
  <text x="215" y="426" font-size="11" fill="#455A64">55–70 t · grúa 120/40 t</text>

  <!-- 5 EAF -->
  <rect x="335" y="90" width="180" height="190" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2.5"/>
  <text x="425" y="115" text-anchor="middle" font-weight="bold" fill="#212121">(5) EAF-1 / EAF-2</text>
  <text x="425" y="137" text-anchor="middle" font-size="12" fill="#212121">AC · 140 MVA · 3 × 610 mm</text>
  <text x="425" y="155" text-anchor="middle" font-size="12" fill="#212121">150 t vaciado · talón 20–30 t</text>
  <text x="425" y="173" text-anchor="middle" font-size="12" fill="#212121">tap-to-tap 55 min</text>
  <text x="425" y="191" text-anchor="middle" font-size="11" fill="#212121">560–620 kWh/t · O₂ 30–40 Nm³/t</text>
  <text x="425" y="209" text-anchor="middle" font-size="12" fill="#212121">C 8–12 kg/t · cal 30–45 kg/t</text>
  <text x="425" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#C62828">Vaciado EBT 1,630 ± 15 °C</text>
  <text x="425" y="252" text-anchor="middle" font-size="12" fill="#212121">O activo 500–900 ppm</text>
  <text x="425" y="270" text-anchor="middle" font-size="12" fill="#212121">22–24 coladas/día/horno</text>

  <!-- 6 humos -->
  <rect x="345" y="330" width="160" height="60" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
  <text x="425" y="355" text-anchor="middle" font-weight="bold" fill="#212121">(6) Humos (DES)</text>
  <text x="425" y="373" text-anchor="middle" font-size="11" fill="#212121">4.º agujero → casa de bolsas</text>
  <line x1="425" y1="280" x2="425" y2="328" stroke="#43A047" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#fl)"/>
  <!-- 7 escoria -->
  <rect x="345" y="420" width="160" height="55" rx="6" fill="#EFEBE9" stroke="#6D4C41" stroke-width="2"/>
  <text x="425" y="443" text-anchor="middle" font-weight="bold" fill="#212121">(7) Escoria EAF</text>
  <text x="425" y="461" text-anchor="middle" font-size="11" fill="#212121">portaollas de escoria (S-10)</text>
  <path d="M335,250 C300,300 300,420 343,445" fill="none" stroke="#6D4C41" stroke-width="3" marker-end="url(#fl)"/>

  <!-- 8 Olla -->
  <line x1="515" y1="185" x2="585" y2="185" stroke="#E65100" stroke-width="5" marker-end="url(#fm)"/>
  <rect x="590" y="140" width="140" height="90" rx="6" fill="#FFF8E1" stroke="#FF8F00" stroke-width="2"/>
  <text x="660" y="165" text-anchor="middle" font-weight="bold" fill="#212121">(8) Olla 150 t</text>
  <text x="660" y="185" text-anchor="middle" font-size="12" fill="#212121">precalentada</text>
  <text x="660" y="202" text-anchor="middle" font-size="12" fill="#212121">1,000–1,100 °C</text>
  <text x="660" y="219" text-anchor="middle" font-size="12" fill="#212121">aleación + Ar</text>

  <!-- 9 LF -->
  <line x1="660" y1="230" x2="660" y2="290" stroke="#E65100" stroke-width="5" marker-end="url(#fm)"/>
  <rect x="580" y="295" width="160" height="100" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="2.5"/>
  <text x="660" y="320" text-anchor="middle" font-weight="bold" fill="#212121">(9) LF-1 / LF-2</text>
  <text x="660" y="339" text-anchor="middle" font-size="12" fill="#212121">25 MVA · 4–5 °C/min</text>
  <text x="660" y="356" text-anchor="middle" font-size="12" fill="#212121">S ≤ 0.010% · Al 0.020–0.045%</text>
  <text x="660" y="373" text-anchor="middle" font-size="12" fill="#212121">CaSi · Ar suave ≥ 8 min</text>
  <text x="660" y="389" text-anchor="middle" font-size="12" fill="#212121">35–45 min</text>

  <!-- 10 CC1, 11 CC2 -->
  <line x1="740" y1="330" x2="800" y2="260" stroke="#E65100" stroke-width="5" marker-end="url(#fm)"/>
  <line x1="740" y1="365" x2="800" y2="440" stroke="#E65100" stroke-width="5" marker-end="url(#fm)"/>
  <text x="752" y="352" font-size="11" fill="#455A64">grúa 250/63 t</text>
  <rect x="805" y="200" width="170" height="95" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="890" y="225" text-anchor="middle" font-weight="bold" fill="#212121">(10) CC1 planchón</text>
  <text x="890" y="244" text-anchor="middle" font-size="12" fill="#212121">230 × 900–1,650 mm</text>
  <text x="890" y="261" text-anchor="middle" font-size="12" fill="#212121">≈ 1.3 Mt/año</text>
  <text x="890" y="280" text-anchor="middle" font-size="11" fill="#455A64">→ laminación en caliente</text>
  <rect x="805" y="410" width="170" height="95" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="890" y="435" text-anchor="middle" font-weight="bold" fill="#212121">(11) CC2 palanquilla</text>
  <text x="890" y="454" text-anchor="middle" font-size="12" fill="#212121">6 líneas · 160 × 160 mm</text>
  <text x="890" y="471" text-anchor="middle" font-size="12" fill="#212121">≈ 0.9 Mt/año</text>
  <text x="890" y="490" text-anchor="middle" font-size="11" fill="#455A64">→ laminación de largos</text>

  <!-- 12 ciclo ollas -->
  <path d="M890,505 C890,590 660,600 660,520 L660,480" fill="none" stroke="#455A64" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#fl)"/>
  <rect x="580" y="430" width="160" height="50" rx="6" fill="#EFEBE9" stroke="#8D6E63" stroke-width="2"/>
  <text x="660" y="452" text-anchor="middle" font-weight="bold" font-size="12" fill="#212121">(12) Preparación de olla</text>
  <text x="660" y="469" text-anchor="middle" font-size="11" fill="#212121">válvula, arena, tapón, precal.</text>
  <path d="M580,455 C540,455 540,230 588,215" fill="none" stroke="#455A64" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#fl)"/>
  <text x="770" y="585" text-anchor="middle" font-size="11" fill="#455A64">olla vacía regresa (10 ollas: 7 en ciclo, 3 reserva/mtto.)</text>

  <!-- leyenda -->
  <rect x="30" y="500" width="530" height="120" fill="#FAFAFA" stroke="#455A64"/>
  <text x="40" y="520" font-weight="bold" fill="#212121">Leyenda</text>
  <line x1="40" y1="540" x2="80" y2="540" stroke="#E65100" stroke-width="5"/><text x="90" y="544" fill="#212121">Acero líquido</text>
  <line x1="40" y1="562" x2="80" y2="562" stroke="#455A64" stroke-width="4"/><text x="90" y="566" fill="#212121">Materiales sólidos / olla vacía</text>
  <line x1="40" y1="584" x2="80" y2="584" stroke="#43A047" stroke-width="3" stroke-dasharray="6,4"/><text x="90" y="588" fill="#212121">Gases / humos</text>
  <line x1="40" y1="606" x2="80" y2="606" stroke="#6D4C41" stroke-width="3"/><text x="90" y="610" fill="#212121">Escoria</text>
  <text x="330" y="544" font-size="11" fill="#212121">MO-EAF-01…08: (2)–(5), (7)</text>
  <text x="330" y="566" font-size="11" fill="#212121">MO-OLL-01: (12) · MO-OLL-02: (8)→(10)/(11)</text>
  <text x="330" y="588" font-size="11" fill="#212121">MO-LF-01: (9)</text>
  <text x="330" y="610" font-size="11" fill="#C62828">[Validar con OEM / Ingeniería de Proceso]</text>
</svg>
