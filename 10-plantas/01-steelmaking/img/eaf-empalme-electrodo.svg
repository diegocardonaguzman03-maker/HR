<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#212121"/></marker>
    <marker id="r" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#C62828"/></marker>
  </defs>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#212121">Figura 6. Columna de electrodos, empalme con niple y marcas de posición</text>
  <text x="500" y="47" text-anchor="middle" font-size="12" fill="#455A64">Grafito UHP 610 mm (24") · niple cónico 4TPI · valores de torque y distancias [Validar con OEM / Ingeniería de Proceso]</text>

  <!-- A: columna en el horno -->
  <text x="160" y="80" text-anchor="middle" font-weight="bold" fill="#212121">A. Columna en operación</text>
  <rect x="60" y="120" width="200" height="16" fill="#90A4AE" stroke="#455A64"/>
  <rect x="120" y="108" width="80" height="44" fill="#455A64"/>
  <rect x="136" y="92" width="48" height="448" fill="#757575" stroke="#424242"/>
  <!-- juntas -->
  
  <line x1="136" y1="300" x2="184" y2="300" stroke="#FFD600" stroke-width="3"/>
  <!-- bóveda -->
  <path d="M40,420 L118,410 M202,410 L280,420" stroke="#1E88E5" stroke-width="12"/>
  <rect x="112" y="400" width="96" height="22" fill="#8D6E63"/>
  <!-- escoria/baño -->
  <rect x="40" y="560" width="240" height="22" fill="#6D4C41"/>
  <rect x="40" y="582" width="240" height="40" fill="#E65100"/>
  <path d="M160,540 l-4,8 l6,5 l-4,7" stroke="#FFD600" stroke-width="3" fill="none"/>
  <!-- marcas -->
  <line x1="190" y1="300" x2="260" y2="250" stroke="#212121"/>
  <text x="262" y="246" font-size="11" fill="#212121">junta</text>
  <line x1="200" y1="152" x2="290" y2="152" stroke="#C62828" stroke-dasharray="4,3"/>
  <line x1="290" y1="152" x2="290" y2="300" stroke="#C62828" marker-end="url(#r)"/>
  <line x1="290" y1="300" x2="290" y2="152" stroke="#C62828" marker-end="url(#r)"/>
  <text x="296" y="215" font-size="11" fill="#C62828">junta ≥ 300 mm</text>
  <text x="296" y="230" font-size="11" fill="#C62828">bajo la mordaza</text>
  <text x="296" y="245" font-size="11" fill="#C62828">[Validar OEM]</text>
  <line x1="136" y1="380" x2="100" y2="380" stroke="#212121"/>
  <text x="96" y="376" text-anchor="end" font-size="11" fill="#212121">marca de</text>
  <text x="96" y="390" text-anchor="end" font-size="11" fill="#212121">deslizamiento</text>
  <rect x="136" y="376" width="48" height="6" fill="#FFFFFF"/>
  <text x="20" y="650" font-size="11" fill="#212121">Consumo 1.3–1.6 kg/t ≈ 140 mm de columna por colada</text>
  <text x="20" y="666" font-size="11" fill="#212121">Adición típica cada ≈ 18–20 coladas por columna [Supuesto]</text>

  <!-- B: detalle de junta -->
  <text x="530" y="80" text-anchor="middle" font-weight="bold" fill="#212121">B. Detalle del empalme</text>
  <rect x="440" y="100" width="180" height="200" fill="#757575" stroke="#424242"/>
  <rect x="440" y="306" width="180" height="200" fill="#9E9E9E" stroke="#424242"/>
  <!-- cajas (sockets) -->
  <path d="M480,300 L495,210 L565,210 L580,300 Z" fill="#ffffff" stroke="#424242"/>
  <path d="M480,306 L495,396 L565,396 L580,306 Z" fill="#ffffff" stroke="#424242"/>
  <!-- niple -->
  <path d="M497,214 L563,214 L577,303 L563,392 L497,392 L483,303 Z" fill="#616161" stroke="#212121" stroke-width="2"/>
  <g stroke="#BDBDBD">
    <line x1="490" y1="240" x2="570" y2="240"/><line x1="488" y1="260" x2="572" y2="260"/><line x1="486" y1="280" x2="574" y2="280"/>
    <line x1="486" y1="326" x2="574" y2="326"/><line x1="488" y1="346" x2="572" y2="346"/><line x1="490" y1="366" x2="570" y2="366"/>
  </g>
  <line x1="620" y1="303" x2="700" y2="303" stroke="#C62828"/>
  <text x="705" y="300" font-size="12" font-weight="bold" fill="#C62828">caras en contacto:</text>
  <text x="705" y="316" font-size="12" fill="#C62828">laina 0.1 mm NO entra</text>
  <!-- torque -->
  <path d="M430,150 A110,30 0 0 0 640,150" fill="none" stroke="#43A047" stroke-width="4" marker-end="url(#a)"/>
  <text x="530" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">torque ≈ 4,500 N·m ± 10%</text>
  <text x="648" y="140" font-size="11" fill="#212121">[Validar tabla OEM]</text>
  <!-- cotas -->
  <line x1="440" y1="525" x2="620" y2="525" stroke="#212121" marker-end="url(#a)"/>
  <line x1="620" y1="525" x2="440" y2="525" stroke="#212121" marker-end="url(#a)"/>
  <text x="530" y="542" text-anchor="middle" font-size="12" fill="#212121">Ø 610 mm</text>
  <line x1="700" y1="100" x2="700" y2="290" stroke="#212121" marker-end="url(#a)"/>
  <line x1="700" y1="290" x2="700" y2="100" stroke="#212121" marker-end="url(#a)"/>
  <text x="706" y="190" font-size="11" fill="#212121">longitud electrodo</text>
  <text x="706" y="204" font-size="11" fill="#212121">≈ 2,700 mm [Validar]</text>

  <!-- C: secuencia -->
  <rect x="770" y="330" width="220" height="210" rx="6" fill="#FAFAFA" stroke="#455A64"/>
  <text x="880" y="352" text-anchor="middle" font-weight="bold" fill="#212121">C. Secuencia en el soporte</text>
  <g font-size="11" fill="#212121">
    <text x="780" y="374">1 Limpia caja y niple con aire seco</text>
    <text x="780" y="392">2 Rosca niple en el electrodo nuevo</text>
    <text x="780" y="410">3 Coloca tapón de izaje (100%</text>
    <text x="780" y="424">   de roscas enganchadas)</text>
    <text x="780" y="442">4 Baja a ≤ 50 mm/s y alinea</text>
    <text x="780" y="460">5 Aprieta con llave al torque</text>
    <text x="780" y="478">6 Verifica laina 0.1 mm y marca</text>
    <text x="780" y="496">7 Registra torque y n.º de serie</text>
    <text x="780" y="520" fill="#C62828">Arco apagado + LOTO antes de subir</text>
  </g>

  <!-- números -->
  <g font-weight="bold" font-size="12" fill="#ffffff">
    <circle cx="220" cy="128" r="11" fill="#C62828"/><text x="220" y="132" text-anchor="middle">1</text>
    <circle cx="100" cy="110" r="11" fill="#C62828"/><text x="100" y="114" text-anchor="middle">2</text>
    <circle cx="115" cy="300" r="11" fill="#C62828"/><text x="115" y="304" text-anchor="middle">3</text>
    <circle cx="60" cy="400" r="11" fill="#C62828"/><text x="60" y="404" text-anchor="middle">4</text>
    <circle cx="530" cy="303" r="11" fill="#C62828"/><text x="530" y="307" text-anchor="middle">5</text>
    <circle cx="460" cy="230" r="11" fill="#C62828"/><text x="460" y="234" text-anchor="middle">6</text>
    <circle cx="420" cy="165" r="11" fill="#43A047"/><text x="420" y="169" text-anchor="middle">7</text>
  </g>
  <rect x="330" y="570" width="660" height="140" fill="#FAFAFA" stroke="#455A64"/>
  <text x="340" y="590" font-weight="bold" fill="#212121">Leyenda</text>
  <g font-size="11.5" fill="#212121">
    <text x="340" y="610">1 Brazo portaelectrodo · 2 Mordaza (anillo de sujeción) · 3 Junta (niple) · 4 Delta de bóveda</text>
    <text x="340" y="628">5 Niple cónico 4TPI (doble cono) · 6 Caja roscada del electrodo · 7 Sentido de apriete (torque)</text>
    <text x="340" y="646">Marca de deslizamiento: línea de pintura a la cara inferior de la mordaza para medir cada deslizamiento.</text>
    <text x="340" y="664">Nunca dejes la junta dentro de la zona de contacto de la mordaza ni en el delta durante la operación.</text>
    <text x="340" y="682" fill="#C62828">Torque, longitud de electrodo, velocidad de bajada y distancias: [Validar con OEM / Ingeniería de Proceso].</text>
  </g>
</svg>
