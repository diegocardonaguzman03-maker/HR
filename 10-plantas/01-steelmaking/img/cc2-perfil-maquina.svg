<rect x="10" y="616" width="980" height="194" fill="#FAFAFA" stroke="#B0BEC5"/>
<text x="20" y="634" font-size="13" font-weight="bold" fill="#212121">Leyenda</text>
<text x="24" y="654" font-size="12.5" fill="#212121">1 Torreta de ollas de 2 brazos (giro con olla llena)</text>
<text x="24" y="673" font-size="12.5" fill="#212121">2 Olla de 150 t con válvula deslizante</text>
<text x="24" y="692" font-size="12.5" fill="#212121">3 Tubo protector de olla con sello de argón</text>
<text x="24" y="711" font-size="12.5" fill="#212121">4 Distribuidor de 30 t (nivel 700–850 mm)</text>
<text x="24" y="730" font-size="12.5" fill="#212121">5 Buza calibrada ZrO₂ Ø 15–17 mm + cambio rápido</text>
<text x="24" y="749" font-size="12.5" fill="#212121">6 Molde de tubo Cu-Ag 1,000 mm + EMS; agua ≈ 2,000 L/min</text>
<text x="24" y="768" font-size="12.5" fill="#212121">7 Fuente Cs-137 (con obturador) y detector de nivel ±5 mm</text>
<text x="24" y="787" font-size="12.5" fill="#212121">8 Oscilador: 150–250 cpm, carrera 6–10 mm</text>
<text x="24" y="806" font-size="12.5" fill="#212121">9 Pie de rodillos (foot rolls) con rociado</text>
<text x="514" y="654" font-size="12.5" fill="#212121">10 Zonas de rociado Z1–Z3: agua específica 1.5–2.0 L/kg</text>
<text x="514" y="673" font-size="12.5" fill="#212121">11 Radio de la máquina: 9 m (centro marcado +)</text>
<text x="514" y="692" font-size="12.5" fill="#212121">12 Extractores-enderezadores multipunto (barra falsa rígida)</text>
<text x="514" y="711" font-size="12.5" fill="#212121">13 Punto final de solidificación (depende de la velocidad)</text>
<text x="514" y="730" font-size="12.5" fill="#212121">14 Oxicorte automático (O₂ + gas natural), corte a 12 m</text>
<text x="514" y="749" font-size="12.5" fill="#212121">15 Marcadora (colada · línea · secuencia · consecutivo)</text>
<text x="514" y="768" font-size="12.5" fill="#212121">16 Transferencia y lecho de enfriamiento</text>
<text x="514" y="787" font-size="12.5" fill="#212121">17 Tanque elevado + bombas diésel de agua de emergencia (≤ 15 s)</text>
<text x="514" y="806" font-size="12.5" fill="#C62828">Línea roja punteada = zona controlada de radiación (Cs-137)</text>
</svg>