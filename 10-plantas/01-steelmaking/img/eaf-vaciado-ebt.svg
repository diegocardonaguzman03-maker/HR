<text x="862" y="435" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D47A1">retroinclina a −3°</text>
<text x="862" y="452" text-anchor="middle" font-size="11" fill="#212121">al peso objetivo o 1.ª escoria</text>
<text x="862" y="468" text-anchor="middle" font-size="11" fill="#212121">talón 20–30 t + escoria en el horno</text>
<rect x="20" y="475" width="960" height="36" fill="#FFEBEE" stroke="#C62828" stroke-width="2" stroke-dasharray="8,4"/>
<text x="500" y="498" text-anchor="middle" font-weight="bold" fill="#C62828">PASO CRÍTICO — ZONA DE EXCLUSIÓN durante todo el vaciado: nadie en la fosa, bajo el horno ni en la vía del carro de olla</text>
<rect x="20" y="520" width="960" height="170" fill="#FAFAFA" stroke="#455A64"/>
<text x="30" y="540" font-size="12" font-weight="bold" fill="#212121">Leyenda y parámetros clave</text>
<text x="30" y="562" font-size="12" fill="#212121">Naranja = acero líquido · café oscuro = escoria · beige = arena de llenado del EBT · verde = argón por el tapón poroso · negro = compuerta (flap) del EBT.</text>
<text x="30" y="584" font-size="12" fill="#212121">Temperatura de vaciado 1,630 ± 15 °C · O activo 500–900 ppm · C 0.04–0.08% · P ≤ 0.015% (FT-ACE-001 §2).</text>
<text x="30" y="606" font-size="12" fill="#212121">Adiciones (desoxidantes, ferroaleaciones, cal/escoria sintética): iniciar con ≈ 20% del peso en la olla (≈ 30 t) y terminar antes del 80% (≈ 120 t).</text>
<text x="30" y="628" font-size="12" fill="#212121">Cierre: retroinclinación inmediata al alcanzar 150 t en la báscula de la olla o al detectar escoria (cámara IR/visual). Arrastre de escoria objetivo ≤ 5 kg/t [Supuesto].</text>
<text x="30" y="650" font-size="12" fill="#C62828">Apertura libre del EBT objetivo ≥ 95% [Supuesto]; si no abre: ALTO, nadie se asoma; aplica MO-EAF-07 §9 (lanceo de O₂ desde posición protegida).</text>
<text x="30" y="672" font-size="12" fill="#C62828">Tiempos, ángulos y diámetro del agujero de vaciado: [Validar con OEM / Ingeniería de Proceso].</text>
</svg>