<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" width="1000" height="740" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#C62828" fill-opacity="0.12"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#C62828" stroke-width="2" stroke-opacity="0.5"/>
    </pattern>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#43A047"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E65100"/></marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker>
  </defs>
  <text x="500" y="28" font-size="16" text-anchor="middle" fill="#212121" font-weight="bold">Figura IT-S04. Mi área de trabajo: grúa de carga de la nave de hornos</text>
  <text x="500" y="48" font-size="12" text-anchor="middle" fill="#212121">Valores de FT-ACE-001 v0.3 §6, MO-EAF-02/08, MM-EAF-02 y MS-ACE-04. Distancias [Supuesto — Validar con C-16]</text>
  <rect x="20" y="60" width="960" height="470" fill="none" stroke="#455A64" stroke-width="3" />
  <text x="40" y="80" font-size="12" text-anchor="start" fill="#455A64" font-weight="bold">NAVE DE HORNOS — grúa de carga 120/40 t (vista en planta, sin escala)</text>
  <line x1="40" y1="110" x2="960" y2="110" stroke="#455A64" stroke-width="6"/>
  <line x1="40" y1="500" x2="960" y2="500" stroke="#455A64" stroke-width="6"/>
  <text x="950" y="102" font-size="12" text-anchor="end" fill="#455A64">Riel de la grúa</text>
  <rect x="170" y="280" width="480" height="60" fill="#FFF3C4" stroke="#FF8F00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="170" y="295" width="480" height="30" fill="url(#hatchRed)" stroke="#C62828" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="180" y="272" font-size="12" text-anchor="start" fill="#C62828" font-weight="bold">Ruta de la canasta: roja ± 5 m</text>
  <line x1="180" y1="310" x2="600" y2="310" stroke="#455A64" stroke-width="3" marker-end="url(#arrS)"/>
  <rect x="420" y="110" width="30" height="390" fill="#455A64" stroke="#455A64" stroke-width="1.5" fill-opacity="0.35"/>
  <rect x="425" y="250" width="20" height="30" fill="#455A64" stroke="#455A64" stroke-width="1.5" />
  <rect x="452" y="460" width="44" height="30" fill="#ECEFF1" stroke="#455A64" stroke-width="2" /><text x="505" y="480" font-size="12" text-anchor="start" fill="#212121" font-weight="bold">Cabina</text>
  <rect x="60" y="280" width="110" height="60" fill="#F5F5F5" stroke="#455A64" stroke-width="1.5" /><text x="115" y="355" font-size="12" text-anchor="middle" fill="#212121">Carro portacanastas</text>
  <path d="M80,285 L150,285 L140,330 L90,330 Z" fill="#455A64" fill-opacity="0.25" stroke="#455A64" stroke-width="2"/><path d="M88,297 l12,-8 l10,10 l12,-9 l10,9 l10,-8" fill="none" stroke="#6D4C41" stroke-width="3"/>
  <circle cx="720" cy="310" r="120" fill="url(#hatchRed)" stroke="#C62828" stroke-width="2" stroke-dasharray="6,3"/><text x="720" y="204" font-size="12" text-anchor="middle" fill="#C62828" font-weight="bold">Roja ≤ 15 m</text>
  <circle cx="720" cy="310" r="70" fill="#8D6E63" stroke="#455A64" stroke-width="4"/><circle cx="720" cy="310" r="54" fill="#E65100" fill-opacity="0.85"/><circle cx="702" cy="300" r="8" fill="#455A64"/><circle cx="738" cy="300" r="8" fill="#455A64"/><circle cx="720" cy="326" r="8" fill="#455A64"/><text x="720" y="396" font-size="12" text-anchor="middle" fill="#212121" font-weight="bold">EAF · bóveda girada</text>
  <rect x="820" y="420" width="120" height="60" fill="#ECEFF1" stroke="#455A64" stroke-width="2" /><text x="880" y="445" font-size="12" text-anchor="middle" fill="#455A64" font-weight="bold">Púlpito</text><text x="880" y="463" font-size="12" text-anchor="middle" fill="#C62828">no pasar encima</text>
  <rect x="560" y="140" width="110" height="50" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5" /><text x="615" y="160" font-size="12" text-anchor="middle" fill="#212121">Soporte de</text><text x="615" y="178" font-size="12" text-anchor="middle" fill="#212121">empalme</text>
  <rect x="820" y="140" width="120" height="50" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5" /><text x="880" y="160" font-size="12" text-anchor="middle" fill="#212121">Base bóveda</text><text x="880" y="178" font-size="12" text-anchor="middle" fill="#212121">de reserva</text>
  <rect x="200" y="130" width="150" height="50" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" /><text x="275.0" y="159.0" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">Estacionamiento</text>
  <polyline points="470,490 470,520 380,520" fill="none" stroke="#43A047" stroke-width="4" stroke-dasharray="10,5" marker-end="url(#arrG)"/>
  <text x="370" y="524" font-size="12" text-anchor="end" fill="#1B5E20">Escalera de cabina</text>
  <circle cx="500" cy="450" r="11" fill="#212121"/><text x="500" y="454" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
  <circle cx="415" cy="245" r="11" fill="#212121"/><text x="415" y="249" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
  <circle cx="60" cy="275" r="11" fill="#212121"/><text x="60" y="279" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
  <circle cx="380" cy="290" r="11" fill="#212121"/><text x="380" y="294" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
  <circle cx="720" cy="225" r="11" fill="#212121"/><text x="720" y="229" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
  <circle cx="820" cy="415" r="11" fill="#212121"/><text x="820" y="419" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">6</text>
  <circle cx="560" cy="135" r="11" fill="#212121"/><text x="560" y="139" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">7</text>
  <circle cx="820" cy="135" r="11" fill="#212121"/><text x="820" y="139" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">8</text>
  <circle cx="200" cy="125" r="11" fill="#212121"/><text x="200" y="129" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">9</text>
  <circle cx="480" cy="520" r="11" fill="#212121"/><text x="480" y="524" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">10</text>
  <rect x="20" y="570" width="960" height="160" fill="#FAFAFA" stroke="#455A64" stroke-width="1" />
  <text x="30" y="590" font-size="13" text-anchor="start" fill="#212121" font-weight="bold">Leyenda (números del dibujo)</text>
  <circle cx="40" cy="610" r="11" fill="#212121"/><text x="40" y="614" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text><text x="58" y="614" font-size="12" text-anchor="start" fill="#212121">Cabina: inspección pre-uso al inicio de turno</text>
  <circle cx="40" cy="630" r="11" fill="#212121"/><text x="40" y="634" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text><text x="58" y="634" font-size="12" text-anchor="start" fill="#212121">Gancho principal 120 t / auxiliar 40 t (concha)</text>
  <circle cx="40" cy="650" r="11" fill="#212121"/><text x="40" y="654" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text><text x="58" y="654" font-size="12" text-anchor="start" fill="#212121">Canasta 55–70 t en el carro (≤ 70 t, nada sobre el borde)</text>
  <circle cx="40" cy="670" r="11" fill="#212121"/><text x="40" y="674" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text><text x="58" y="674" font-size="12" text-anchor="start" fill="#212121">Ruta: altura mínima, lento, nadie a ± 5 m</text>
  <circle cx="40" cy="690" r="11" fill="#212121"/><text x="40" y="694" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text><text x="58" y="694" font-size="12" text-anchor="start" fill="#212121">Horno: abro la concha a 0.5–1.0 m sobre la coraza</text>
  <circle cx="520" cy="610" r="11" fill="#212121"/><text x="520" y="614" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">6</text><text x="538" y="614" font-size="12" text-anchor="start" fill="#212121">Púlpito y refugios: nunca carga encima</text>
  <circle cx="520" cy="630" r="11" fill="#212121"/><text x="520" y="634" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">7</text><text x="538" y="634" font-size="12" text-anchor="start" fill="#212121">Electrodos: modo fino ≤ 50 mm/s</text>
  <circle cx="520" cy="650" r="11" fill="#212121"/><text x="520" y="654" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">8</text><text x="538" y="654" font-size="12" text-anchor="start" fill="#212121">Bóveda: prueba de levante a 100 mm, 1 min</text>
  <circle cx="520" cy="670" r="11" fill="#212121"/><text x="520" y="674" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">9</text><text x="538" y="674" font-size="12" text-anchor="start" fill="#212121">Estacionamiento: gancho arriba, fuera de la ruta</text>
  <circle cx="520" cy="690" r="11" fill="#212121"/><text x="520" y="694" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">10</text><text x="538" y="694" font-size="12" text-anchor="start" fill="#212121">Escape: escalera de la cabina</text>
  <text x="30" y="718" font-size="13" text-anchor="start" fill="#212121" font-weight="bold">Zonas:</text><rect x="90" y="706" width="26" height="16" fill="url(#hatchRed)" stroke="#C62828" stroke-width="2" /><text x="122" y="718" font-size="12" text-anchor="start" fill="#212121">Roja: solo personal esencial con EPP aluminizado</text><rect x="430" y="706" width="26" height="16" fill="#FFF3C4" stroke="#FF8F00" stroke-width="1.5" /><text x="462" y="718" font-size="12" text-anchor="start" fill="#212121">Amarilla: paso con precaución</text><rect x="660" y="706" width="26" height="16" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" /><text x="692" y="718" font-size="12" text-anchor="start" fill="#212121">Verde: refugio / segura</text><line x1="850" y1="714" x2="890" y2="714" stroke="#43A047" stroke-width="4" stroke-dasharray="10,5" marker-end="url(#arrG)"/><text x="896" y="718" font-size="12" text-anchor="start" fill="#212121">Escape</text>
</svg>
