<text x="34" y="560" font-size="13" font-weight="bold" fill="#212121">Leyenda</text>
<text x="34" y="584" font-size="12" fill="#212121">(1) Torreta de ollas tipo mariposa, 2 brazos, con pesaje de olla</text>
<text x="504" y="584" font-size="12" fill="#212121">(2) Olla de 150 t (acero + escoria) sobre el distribuidor</text>
<text x="34" y="608" font-size="12" fill="#212121">(3) Tubo protector de olla con sello de argón</text>
<text x="504" y="608" font-size="12" fill="#212121">(4) Distribuidor de 45 t con barra tapón; nivel 900–1,100 mm</text>
<text x="34" y="632" font-size="12" fill="#212121">(5) Molde Cu-Ag/Ni, 900 mm; SEN inmersión 120–160 mm</text>
<text x="504" y="632" font-size="12" fill="#212121">(6) Mesa de oscilación hidráulica 120–200 cpm, carrera 4–8 mm</text>
<text x="34" y="656" font-size="12" fill="#212121">(7) Fin del arco / enderezado (zona de desdoblado)</text>
<text x="504" y="656" font-size="12" fill="#212121">(8) Segmentos 1–14 (gap según tabla de conicidad ± 0.5 mm)</text>
<text x="34" y="680" font-size="12" fill="#212121">(9) Máquina de oxicorte (O₂ + gas natural)</text>
<text x="504" y="680" font-size="12" fill="#212121">(10) Mesa de salida hacia marcado y mesa de enfriamiento</text>
<text x="34" y="704" font-size="12" fill="#212121">Z1–Z10: zonas de enfriamiento secundario (niebla aire–agua), 0.8–1.2 L/kg</text>
<text x="504" y="704" font-size="12" fill="#212121">Trazo naranja oscuro: núcleo líquido (cráter) a 1.2 m/min ≈ 22 m</text>
