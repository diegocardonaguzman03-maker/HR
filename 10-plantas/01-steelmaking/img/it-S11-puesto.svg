<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#C62828" fill-opacity="0.12"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#C62828" stroke-width="2" stroke-opacity="0.55"/>
    </pattern>
    <pattern id="hatchSlag" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="10" height="10" fill="#6D4C41" fill-opacity="0.18"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#6D4C41" stroke-width="2" stroke-opacity="0.5"/>
    </pattern>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E65100"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E88E5"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#212121"/>
    </marker>
  </defs>
  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">Figura IT-S11. Mi área: laboratorio de acería y puntos de muestreo en la nave (vista en planta)</text>
  <text x="500" y="46" text-anchor="middle" font-size="12" fill="#212121">Esquemático sin escala. Valores de MO-EAF-06, MO-LF-01 y DP S-11; zonas según MS-ACE-01 [Supuesto — Validar con C-16]</text>
  <rect x="40" y="80" width="520" height="400" fill="#43A047" stroke="#2E7D32" stroke-width="1.2" fill-opacity="0.18"/>
  <rect x="40" y="80" width="520" height="400" fill="none" stroke="#455A64" stroke-width="3"/>
  <text x="300" y="100" font-size="12" fill="#455A64" text-anchor="middle" font-weight="bold">LABORATORIO DE ACERÍA (clima controlado)</text>
  <rect x="280" y="474" width="40" height="12" fill="#43A047" stroke="#2E7D32" stroke-width="1"/>
  <rect x="70" y="130" width="150" height="60" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/>
  <text x="145" y="156" font-size="11" fill="#212121" text-anchor="middle" font-weight="bold">Receptor del</text>
  <text x="145" y="174" font-size="10" fill="#212121" text-anchor="middle">tubo neumático</text>
  <rect x="70" y="250" width="150" height="60" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/>
  <text x="145" y="276" font-size="11" fill="#212121" text-anchor="middle" font-weight="bold">Cortadora y</text>
  <text x="145" y="294" font-size="10" fill="#212121" text-anchor="middle">desbastadora (guardas)</text>
  <rect x="240" y="130" width="150" height="60" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/>
  <text x="315" y="156" font-size="11" fill="#212121" text-anchor="middle" font-weight="bold">Espectrómetro</text>
  <text x="315" y="174" font-size="10" fill="#212121" text-anchor="middle">de emisión óptica (OES)</text>
  <rect x="240" y="250" width="150" height="60" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/>
  <text x="315" y="276" font-size="11" fill="#212121" text-anchor="middle" font-weight="bold">Analizadores C/S</text>
  <text x="315" y="294" font-size="10" fill="#212121" text-anchor="middle">y O/N (combustión)</text>
  <rect x="240" y="370" width="150" height="60" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/>
  <text x="315" y="396" font-size="11" fill="#212121" text-anchor="middle" font-weight="bold">Patrones</text>
  <text x="315" y="414" font-size="10" fill="#212121" text-anchor="middle">certificados</text>
  <rect x="70" y="370" width="150" height="60" fill="#FFFFFF" stroke="#455A64" stroke-width="2"/>
  <text x="145" y="396" font-size="11" fill="#212121" text-anchor="middle" font-weight="bold">Estación LIMS</text>
  <text x="145" y="414" font-size="10" fill="#212121" text-anchor="middle">y radio al púlpito</text>
  <rect x="430" y="140" width="20" height="70" fill="#43A047" stroke="#455A64" stroke-width="1.5" fill-opacity="0.5" rx="8"/>
  <rect x="460" y="140" width="20" height="70" fill="#43A047" stroke="#455A64" stroke-width="1.5" fill-opacity="0.5" rx="8"/>
  <rect x="490" y="140" width="20" height="70" fill="#1E88E5" stroke="#455A64" stroke-width="1.5" fill-opacity="0.5" rx="8"/>
  <line x1="420" y1="170" x2="520" y2="170" stroke="#212121" stroke-width="2"/>
  <text x="475" y="228" font-size="11" fill="#212121" text-anchor="middle">Cilindros Ar / O₂</text>
  <text x="475" y="242" font-size="11" fill="#212121" text-anchor="middle">con cadena</text>
  <path d="M145,190 L145,250" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrK)"/>
  <path d="M220,280 L240,170" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrK)"/>
  <path d="M315,190 L315,250" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrK)"/>
  <path d="M240,400 L220,400" fill="none" stroke="#212121" stroke-width="2" marker-end="url(#arrK)"/>
  <text x="420" y="300" font-size="11" fill="#212121" text-anchor="start">Muestra → prepara →</text>
  <text x="420" y="314" font-size="11" fill="#212121" text-anchor="start">analiza → reporta</text>
  <text x="420" y="332" font-size="12" fill="#E65100" text-anchor="start" font-weight="bold">≤ 4 min [Supuesto]</text>
  <rect x="600" y="80" width="380" height="400" fill="none" stroke="#455A64" stroke-width="3"/>
  <text x="790" y="100" font-size="12" fill="#455A64" text-anchor="middle" font-weight="bold">NAVE (salidas al piso)</text>
  <circle cx="700" cy="170" r="55" fill="#FBC02D" stroke="#F9A825" stroke-width="1.2" fill-opacity="0.28"/>
  <circle cx="700" cy="170" r="32" fill="url(#hatchRed)" stroke="#C62828" stroke-width="1.5"/>
  <circle cx="700" cy="170" r="12" fill="#E65100" stroke="#FF8F00" stroke-width="1.5"/>
  <text x="765" y="166" font-size="11" fill="#212121" text-anchor="start" font-weight="bold">EAF: puerta</text>
  <circle cx="700" cy="290" r="55" fill="#FBC02D" stroke="#F9A825" stroke-width="1.2" fill-opacity="0.28"/>
  <circle cx="700" cy="290" r="32" fill="url(#hatchRed)" stroke="#C62828" stroke-width="1.5"/>
  <circle cx="700" cy="290" r="12" fill="#E65100" stroke="#FF8F00" stroke-width="1.5"/>
  <text x="765" y="286" font-size="11" fill="#212121" text-anchor="start" font-weight="bold">LF: agujero de muestreo</text>
  <circle cx="700" cy="410" r="55" fill="#FBC02D" stroke="#F9A825" stroke-width="1.2" fill-opacity="0.28"/>
  <circle cx="700" cy="410" r="32" fill="url(#hatchRed)" stroke="#C62828" stroke-width="1.5"/>
  <circle cx="700" cy="410" r="12" fill="#E65100" stroke="#FF8F00" stroke-width="1.5"/>
  <text x="765" y="406" font-size="11" fill="#212121" text-anchor="start" font-weight="bold">CC: distribuidor</text>
  <text x="765" y="184" font-size="10" fill="#C62828" text-anchor="start">roja ≤ 5 m</text>
  <text x="765" y="304" font-size="10" fill="#C62828" text-anchor="start">roja ≤ 5 m</text>
  <text x="765" y="424" font-size="10" fill="#C62828" text-anchor="start">plataforma de colada</text>
  <path d="M650,170 L590,170 L590,114 L145,114 L145,128" fill="none" stroke="#1E88E5" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrB)"/>
  <path d="M650,290 L580,290 L580,114" fill="none" stroke="#1E88E5" stroke-width="2" stroke-dasharray="6,4"/>
  <path d="M650,410 L570,410 L570,114" fill="none" stroke="#1E88E5" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="830" y="250" font-size="11" fill="#1E88E5" text-anchor="start">tubo neumático</text>
  <path d="M300,440 L300,472" fill="none" stroke="#2E7D32" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrG)"/>
  <rect x="20" y="520" width="960" height="290" fill="#FAFAFA" stroke="#455A64" stroke-width="1"/>
  <text x="35" y="542" font-size="14" fill="#212121" text-anchor="start" font-weight="bold">Leyenda</text>
  <text x="35" y="562" font-size="12" fill="#212121" text-anchor="start">1  Receptor del tubo neumático: verifica número de colada y momento</text>
  <text x="35" y="580" font-size="12" fill="#212121" text-anchor="start">2  Preparación: corta y desbasta con guardas puestas (NOM-004)</text>
  <text x="35" y="598" font-size="12" fill="#212121" text-anchor="start">3  Espectrómetro OES: estandarización por turno; programa por familia</text>
  <text x="35" y="616" font-size="12" fill="#212121" text-anchor="start">4  Analizadores C/S y O/N por combustión con patrones certificados</text>
  <text x="35" y="634" font-size="12" fill="#212121" text-anchor="start">5  Cilindros de argón y O₂ asegurados con cadena (NOM-020, MS-ACE-06)</text>
  <text x="35" y="652" font-size="12" fill="#212121" text-anchor="start">6  Patrones certificados: verificación diaria antes de reportar</text>
  <text x="35" y="670" font-size="12" fill="#212121" text-anchor="start">7  LIMS y radio: reporta al púlpito (S-01 EAF, S-06 LF) y a nivel 2</text>
  <text x="35" y="688" font-size="12" fill="#212121" text-anchor="start">8  EAF: la muestra la toma S-02 con la lanza (M1, M2, M3)</text>
  <text x="35" y="706" font-size="12" fill="#212121" text-anchor="start">9  LF: la muestra la toma S-07; yo libero la química de envío</text>
  <text x="35" y="724" font-size="12" fill="#212121" text-anchor="start">10  Distribuidor de CC: analizo y reporto desviaciones (C)</text>
  <text x="560" y="542" font-size="13" fill="#212121" text-anchor="start" font-weight="bold">Zonas y valores clave</text>
  <rect x="560" y="554" width="18" height="14" fill="#C62828" stroke="#C62828" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="566" font-size="12" fill="#212121" text-anchor="start">ROJA: solo personal esencial, EPP aluminizado</text>
  <rect x="560" y="574" width="18" height="14" fill="#FBC02D" stroke="#F9A825" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="586" font-size="12" fill="#212121" text-anchor="start">AMARILLA: autorizado, tras barrera, EPP completo</text>
  <rect x="560" y="594" width="18" height="14" fill="#43A047" stroke="#2E7D32" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="606" font-size="12" fill="#212121" text-anchor="start">VERDE: tránsito con EPP básico de nave</text>
  <line x1="560" y1="621" x2="578" y2="621" stroke="#2E7D32" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="585" y="626" font-size="12" fill="#212121" text-anchor="start">Ruta de escape → salida (verde en el muro)</text>
  <text x="560" y="650" font-size="12" fill="#212121" text-anchor="start">Tiempo de análisis ≤ 4 min (3–5); alarma &gt; 6 min</text>
  <text x="560" y="668" font-size="12" fill="#212121" text-anchor="start">Muestra sin porosidad ni escoria; si no, pide otra</text>
  <text x="560" y="686" font-size="12" fill="#212121" text-anchor="start">Fuera de tolerancia en patrones: recalibra antes de reportar</text>
  <text x="560" y="704" font-size="12" fill="#212121" text-anchor="start">En el piso: EPP aluminizado, solo con el ejecutor en roja</text>
  <text x="560" y="722" font-size="12" fill="#212121" text-anchor="start">Muestra caliente: pinzas y guantes; enfría en posición protegida</text>
  <text x="560" y="740" font-size="12" fill="#C62828" text-anchor="start">Puedo retener un resultado y pedir nueva muestra</text>
  <g font-size="12" font-weight="bold" fill="#ffffff">
    <circle cx="70" cy="130" r="11" fill="#212121"/><text x="70" y="134" text-anchor="middle">1</text>
    <circle cx="70" cy="250" r="11" fill="#212121"/><text x="70" y="254" text-anchor="middle">2</text>
    <circle cx="240" cy="130" r="11" fill="#212121"/><text x="240" y="134" text-anchor="middle">3</text>
    <circle cx="240" cy="250" r="11" fill="#212121"/><text x="240" y="254" text-anchor="middle">4</text>
    <circle cx="430" cy="140" r="11" fill="#212121"/><text x="430" y="144" text-anchor="middle">5</text>
    <circle cx="240" cy="370" r="11" fill="#212121"/><text x="240" y="374" text-anchor="middle">6</text>
    <circle cx="70" cy="370" r="11" fill="#212121"/><text x="70" y="374" text-anchor="middle">7</text>
    <circle cx="700" cy="138" r="11" fill="#212121"/><text x="700" y="142" text-anchor="middle">8</text>
    <circle cx="700" cy="258" r="11" fill="#212121"/><text x="700" y="262" text-anchor="middle">9</text>
    <circle cx="700" cy="378" r="11" fill="#212121"/><text x="700" y="382" text-anchor="middle">10</text>
  </g>
</svg>
