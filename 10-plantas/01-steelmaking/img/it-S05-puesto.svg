  <path d="M520,330 l40,-60 l40,60 z" fill="#8D6E63" stroke="#455A64"/><text x="560" y="346" font-size="12" text-anchor="middle" fill="#212121">Fragmentada</text>
  <path d="M630,330 l40,-60 l40,60 z" fill="#8D6E63" stroke="#455A64"/><text x="670" y="346" font-size="12" text-anchor="middle" fill="#212121">Pesada</text>
  <path d="M740,330 l40,-60 l40,60 z" fill="#8D6E63" stroke="#455A64"/><text x="780" y="346" font-size="12" text-anchor="middle" fill="#212121">Retorno</text>
  <rect x="420" y="135" width="130" height="60" fill="#FFEBEE" stroke="#C62828" stroke-width="2" /><text x="485" y="160" font-size="12" text-anchor="middle" fill="#C62828" font-weight="bold">Área de rechazo</text><text x="485" y="178" font-size="12" text-anchor="middle" fill="#C62828">(prohibidos)</text>
  <circle cx="640" cy="205" r="55" fill="url(#hatchRed)" stroke="#C62828" stroke-width="2" stroke-dasharray="6,3"/><text x="640" y="164" font-size="12" text-anchor="middle" fill="#C62828" font-weight="bold">Roja</text>
  <circle cx="640" cy="213" r="20" fill="#455A64"/><text x="640" y="217" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">Imán</text>
  <rect x="760" y="150" width="170" height="110" fill="#F5F5F5" stroke="#455A64" stroke-width="1.5" /><text x="845" y="170" font-size="12" text-anchor="middle" fill="#455A64" font-weight="bold">Armado de canasta</text>
  <path d="M810,180 L880,180 L870,230 L820,230 Z" fill="#455A64" fill-opacity="0.25" stroke="#455A64" stroke-width="2"/><path d="M818,192 l12,-8 l10,10 l12,-9 l10,9 l10,-8" fill="none" stroke="#6D4C41" stroke-width="3"/>
  <text x="845" y="252" font-size="12" text-anchor="middle" fill="#212121">55–70 t · seca</text>
  <rect x="760" y="380" width="170" height="50" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5" /><text x="845" y="410" font-size="12" text-anchor="middle" fill="#212121">Carro portacanastas</text>
  <line x1="845" y1="265" x2="845" y2="375" stroke="#455A64" stroke-width="3" marker-end="url(#arrS)"/>
  <line x1="930" y1="405" x2="970" y2="405" stroke="#455A64" stroke-width="3" marker-end="url(#arrS)"/><text x="965" y="395" font-size="12" text-anchor="end" fill="#212121">Nave</text>
  <rect x="300" y="390" width="170" height="70" fill="#FFF8E1" stroke="#FF8F00" stroke-width="2" /><text x="385" y="415" font-size="12" text-anchor="middle" fill="#E65100" font-weight="bold">Oxicorte (día)</text><text x="385" y="433" font-size="12" text-anchor="middle" fill="#212121">permiso en caliente</text><text x="385" y="451" font-size="12" text-anchor="middle" fill="#212121">+ vigía de fuego</text>
  <rect x="560" y="420" width="160" height="60" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" /><text x="640.0" y="454.0" font-size="12" text-anchor="middle" fill="#1B5E20" font-weight="bold">Caseta / refugio</text>
