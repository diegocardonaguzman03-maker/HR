  <rect x="60" y="225" width="190" height="115" fill="none" stroke="#C62828" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="155" cy="275" r="42" fill="url(#hatchRed)" stroke="#C62828" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="135" y="262" width="40" height="26" fill="#455A64" stroke="#455A64" stroke-width="1.5" />
  <text x="155" y="333" font-size="12" text-anchor="middle" fill="#C62828" font-weight="bold">Aislamiento ≥ 10 m</text>
  <path d="M300,330 l40,-60 l40,60 z" fill="#8D6E63" stroke="#455A64"/><text x="340" y="346" font-size="12" text-anchor="middle" fill="#212121">Rebaba</text>
