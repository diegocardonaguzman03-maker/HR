    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E65100"/></marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker>
  </defs>
  <text x="500" y="28" font-size="16" text-anchor="middle" fill="#212121" font-weight="bold">Figura IT-S05. Mi área de trabajo: patio de chatarra</text>
  <text x="500" y="48" font-size="12" text-anchor="middle" fill="#212121">Valores de MO-EAF-02, MS-ACE-03/04/07. Distancias y velocidad [Supuesto / Validar con ESR (C-16) y OEM]</text>
  <rect x="20" y="60" width="960" height="470" fill="none" stroke="#455A64" stroke-width="3" />
  <text x="40" y="80" font-size="12" text-anchor="start" fill="#455A64" font-weight="bold">PATIO DE CHATARRA (vista en planta, sin escala)</text>
  <rect x="40" y="95" width="920" height="420" fill="#FFF3C4" stroke="#FF8F00" stroke-width="1.5" stroke-dasharray="4,3"/><text x="44" y="109" font-size="12" text-anchor="start" fill="#8D4B00" font-weight="bold">Zona amarilla: tránsito de camiones y grúas</text>
  <line x1="50" y1="170" x2="140" y2="170" stroke="#455A64" stroke-width="3" marker-end="url(#arrS)"/><text x="50" y="160" font-size="12" text-anchor="start" fill="#212121">Camiones</text>
  <rect x="150" y="140" width="16" height="65" fill="#C62828" stroke="#C62828" stroke-width="1.5" /><rect x="214" y="140" width="16" height="65" fill="#C62828" stroke="#C62828" stroke-width="1.5" />
  <text x="190" y="133" font-size="12" text-anchor="middle" fill="#C62828" font-weight="bold">Pórtico ≤ 8 km/h</text>
