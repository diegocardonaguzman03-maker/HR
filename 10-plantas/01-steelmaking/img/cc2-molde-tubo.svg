<text x="780" y="450" font-size="11" text-anchor="middle" fill="#212121">ranura de agua 10–12 m/s (azul)</text>
<text x="780" y="465" font-size="11" text-anchor="middle" fill="#212121">radio de esquina [Validar OEM]</text>
<rect x="610" y="492" width="380" height="208" fill="#FAFAFA" stroke="#B0BEC5"/>
<text x="620" y="512" font-size="12" font-weight="bold" fill="#212121">Especificaciones clave (FT-ACE-001 §5)</text>
<text x="620" y="531" font-size="12"  fill="#212121">Conicidad del tubo: 0.8–1.0 %/m</text>
<text x="620" y="550" font-size="12"  fill="#212121">Agua de molde ≈ 2,000 L/min por línea</text>
<text x="620" y="569" font-size="12"  fill="#212121">Velocidad en la ranura: 10–12 m/s</text>
<text x="620" y="588" font-size="12"  fill="#212121">ΔT 6–10 °C · alarma ΔT &gt; 12 °C o caudal &lt; 90 %</text>
<text x="620" y="607" font-size="12"  fill="#212121">Falla de agua: emergencia automática ≤ 15 s</text>
<text x="620" y="626" font-size="12"  fill="#212121">Aceite de colza: 15–25 mL/min por línea</text>
<text x="620" y="645" font-size="12"  fill="#212121">Nivel radiométrico Cs-137: ±5 mm</text>
<text x="620" y="664" font-size="12"  fill="#C62828">Antes de intervenir: obturador CERRADO + candado</text>
<text x="620" y="683" font-size="12"  fill="#C62828">+ medición con el ESR + dosímetro personal</text>
<rect x="10" y="718" width="980" height="132" fill="#FAFAFA" stroke="#B0BEC5"/>
<text x="20" y="736" font-size="13" font-weight="bold" fill="#212121">Leyenda</text>
<text x="24" y="756" font-size="12.5" fill="#212121">1 Chorro abierto desde la buza calibrada</text>
<text x="24" y="776" font-size="12.5" fill="#212121">2 Brida superior con ranuras de aceite</text>
<text x="24" y="796" font-size="12.5" fill="#212121">3 Tubo de Cu-Ag (pared ≈ 15 mm [Validar])</text>
<text x="24" y="816" font-size="12.5" fill="#212121">4 Ranura de agua primaria (flujo hacia arriba)</text>
<text x="24" y="836" font-size="12.5" fill="#212121">5 Camisa / chaqueta de acero</text>
<text x="349" y="756" font-size="12.5" fill="#212121">6 Entrada de agua (abajo)</text>
<text x="349" y="776" font-size="12.5" fill="#212121">7 Salida de agua (arriba)</text>
<text x="349" y="796" font-size="12.5" fill="#212121">8 Menisco (nivel del acero en el molde)</text>
<text x="349" y="816" font-size="12.5" fill="#212121">9 Piel solidificada (crece hacia abajo)</text>
<text x="349" y="836" font-size="12.5" fill="#212121">10 Núcleo líquido</text>
<text x="674" y="756" font-size="12.5" fill="#212121">11 Agitador electromagnético (EMS)</text>
<text x="674" y="776" font-size="12.5" fill="#212121">12 Fuente sellada Cs-137 con obturador</text>
<text x="674" y="796" font-size="12.5" fill="#212121">13 Detector de centelleo</text>
<text x="674" y="816" font-size="12.5" fill="#212121">14 Zona controlada señalizada (trébol)</text>
<text x="674" y="836" font-size="12.5" fill="#212121">15 Mesa de oscilación</text>
