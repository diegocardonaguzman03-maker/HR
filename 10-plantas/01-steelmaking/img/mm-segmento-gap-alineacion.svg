<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="c" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,4 L8,4 M4,0 L4,8" stroke="#212121" stroke-width="1"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#212121">Figura MM-CC-02. Medición de gap y alineación de segmentos (CC1) y guías (CC2)</text>
  <text x="480" y="51" text-anchor="middle" font-size="12" fill="#455A64">Gap según la tabla de conicidad de la máquina, tolerancia ±0.5 mm (FT-ACE-001 §4) · valores de ejemplo [Supuesto]</text>

  <!-- A. Gap -->
  <text x="40" y="82" font-weight="bold" fill="#455A64">A. Medición de gap con dispositivo tipo "gap checker" (máquina fría, sin planchón)</text>
  <rect x="60" y="95" width="440" height="36" fill="#CFD8DC" stroke="#455A64"/>
  <text x="280" y="118" text-anchor="middle" font-size="11">Bastidor superior (lado suelto, radio interior) + cilindros de apriete</text>
  <g fill="#90A4AE" stroke="#455A64" stroke-width="2">
    <circle cx="110" cy="160" r="28"/><circle cx="195" cy="160" r="28"/><circle cx="280" cy="160" r="28"/><circle cx="365" cy="160" r="28"/><circle cx="450" cy="160" r="28"/>
    <circle cx="110" cy="262" r="28"/><circle cx="195" cy="262" r="28"/><circle cx="280" cy="262" r="28"/><circle cx="365" cy="262" r="28"/><circle cx="450" cy="262" r="28"/>
  </g>
  <rect x="60" y="291" width="440" height="30" fill="#CFD8DC" stroke="#455A64"/>
  <text x="280" y="311" text-anchor="middle" font-size="11">Bastidor inferior (lado fijo, radio exterior = referencia)</text>
  <rect x="60" y="188" width="440" height="46" fill="none" stroke="#E65100" stroke-dasharray="6 4"/>
  <text x="478" y="214" text-anchor="end" font-size="10" fill="#E65100">posición del planchón</text>
  <!-- gap checker -->
  <rect x="228" y="197" width="104" height="28" rx="4" fill="#455A64"/>
  <text x="280" y="215" text-anchor="middle" font-size="10" fill="#ffffff">Gap checker</text>
  <line x1="280" y1="197" x2="280" y2="188" stroke="#212121" stroke-width="4"/>
  <line x1="280" y1="225" x2="280" y2="234" stroke="#212121" stroke-width="4"/>
  <line x1="80" y1="211" x2="228" y2="211" stroke="#455A64" stroke-width="3"/>
  <text x="150" y="206" text-anchor="middle" font-size="10">tirado por la barra falsa →</text>
  <!-- cota gap -->
  <line x1="520" y1="188" x2="520" y2="234" stroke="#212121" marker-start="url(#c)" marker-end="url(#c)"/>
  <line x1="478" y1="188" x2="525" y2="188" stroke="#212121" stroke-width="0.8"/>
  <line x1="478" y1="234" x2="525" y2="234" stroke="#212121" stroke-width="0.8"/>
  <text x="528" y="208" font-size="12" font-weight="bold">Gap</text>
  <text x="528" y="224" font-size="11">±0.5 mm</text>

  <!-- Gráfica gap vs segmento -->
  <rect x="600" y="80" width="340" height="250" fill="#FAFAFA" stroke="#B0BEC5"/>
  <text x="770" y="100" text-anchor="middle" font-size="12" font-weight="bold">Reporte del gap checker (ejemplo)</text>
  <line x1="640" y1="300" x2="920" y2="300" stroke="#212121"/>
  <line x1="640" y1="300" x2="640" y2="115" stroke="#212121"/>
  <polygon points="640,140 920,210 920,250 640,180" fill="#43A047" opacity="0.18"/>
  <line x1="640" y1="160" x2="920" y2="230" stroke="#43A047" stroke-width="2"/>
  <g fill="#1E88E5">
    <circle cx="660" cy="163" r="4"/><circle cx="680" cy="170" r="4"/><circle cx="700" cy="172" r="4"/><circle cx="720" cy="182" r="4"/>
    <circle cx="740" cy="183" r="4"/><circle cx="760" cy="190" r="4"/><circle cx="800" cy="202" r="4"/><circle cx="820" cy="203" r="4"/>
    <circle cx="840" cy="210" r="4"/><circle cx="860" cy="213" r="4"/><circle cx="880" cy="222" r="4"/><circle cx="900" cy="226" r="4"/>
  </g>
  <circle cx="780" cy="228" r="6" fill="#C62828"/>
  <text x="790" y="248" font-size="10" fill="#C62828">Seg. 7: +0.8 mm → corregir</text>
  <text x="780" y="318" text-anchor="middle" font-size="11">Segmento 0 → 14</text>
  <text x="628" y="210" font-size="11" text-anchor="middle" transform="rotate(-90 628 210)">Gap (mm)</text>
  <text x="890" y="150" font-size="10" text-anchor="end" fill="#43A047">Nominal ± 0.5 mm</text>

  <!-- B. Alineación -->
  <text x="40" y="360" font-weight="bold" fill="#455A64">B. Alineación del lado fijo con plantilla de arco (R 9.5 m CC1 / R 9 m CC2)</text>
  <g fill="#90A4AE" stroke="#455A64" stroke-width="2">
    <circle cx="136" cy="411" r="18"/><circle cx="220" cy="419" r="18"/><circle cx="304" cy="430" r="18"/>
    <circle cx="388" cy="446" r="18"/><circle cx="472" cy="471" r="18"/><circle cx="556" cy="490" r="18"/>
  </g>
  <path d="M 110 389 Q 360 396 600 480" fill="none" stroke="#FF8F00" stroke-width="8" opacity="0.85"/>
  <text x="250" y="382" font-size="11" fill="#E65100" font-weight="bold">Plantilla de arco (radio de la máquina)</text>
  <rect x="100" y="425" width="230" height="50" fill="none" stroke="#455A64" stroke-dasharray="5 4"/>
  <text x="215" y="490" text-anchor="middle" font-size="11">Segmento n</text>
  <rect x="360" y="445" width="220" height="70" fill="none" stroke="#455A64" stroke-dasharray="5 4"/>
  <text x="470" y="530" text-anchor="middle" font-size="11">Segmento n + 1</text>
  <!-- laina -->
  <rect x="462" y="449" width="22" height="4" fill="#C62828" transform="rotate(20 473 451)"/>
  <line x1="476" y1="446" x2="470" y2="420" stroke="#C62828"/>
  <text x="405" y="414" font-size="11" fill="#C62828" font-weight="bold">Laina: 0.6 mm → fuera</text>

  <rect x="620" y="350" width="320" height="180" fill="#FAFAFA" stroke="#455A64" stroke-width="1.5"/>
  <g font-size="11.5">
    <text x="632" y="372" font-weight="bold">Tolerancias [Validar OEM]</text>
    <text x="632" y="392">• Gap: nominal de tabla ±0.5 mm</text>
    <text x="632" y="410">• Alineación entre segmentos: ±0.5 mm</text>
    <text x="644" y="426">(objetivo ≤ 0.3 mm)</text>
    <text x="632" y="444">• Molde → segmento 0 / pie de rodillos: ±0.3 mm</text>
    <text x="632" y="462">• Excentricidad de rodillo (runout) ≤ 0.2 mm</text>
    <text x="632" y="480">• Desgaste de diámetro de rodillo ≤ 2 mm</text>
    <text x="632" y="498">• Rodillo gira libre a mano (sin trabarse)</text>
    <text x="632" y="516">• CC2 guías y pie de rodillos: ±0.5 mm</text>
  </g>

  <!-- Números -->
  <g font-size="12" font-weight="bold" fill="#ffffff">
    <circle cx="40" cy="160" r="11" fill="#212121"/><text x="40" y="164" text-anchor="middle">1</text>
    <circle cx="40" cy="262" r="11" fill="#212121"/><text x="40" y="266" text-anchor="middle">2</text>
    <circle cx="345" cy="211" r="11" fill="#212121"/><text x="345" y="215" text-anchor="middle">3</text>
    <circle cx="545" cy="175" r="11" fill="#212121"/><text x="545" y="179" text-anchor="middle">4</text>
    <circle cx="90" cy="396" r="11" fill="#212121"/><text x="90" y="400" text-anchor="middle">5</text>
    <circle cx="500" cy="470" r="11" fill="#212121"/><text x="500" y="474" text-anchor="middle">6</text>
  </g>

  <!-- Leyenda -->
  <rect x="20" y="550" width="920" height="140" fill="#FAFAFA" stroke="#B0BEC5"/>
  <g font-size="12" fill="#212121">
    <text x="32" y="572" font-weight="bold">Leyenda</text>
    <text x="32" y="594">1 Rodillos superiores (lado suelto)   2 Rodillos inferiores (lado fijo, referencia del arco)</text>
    <text x="32" y="614">3 Gap checker: sensores LVDT de gap, rotación de rodillo, inclinación y presión de boquillas; tirado por la barra falsa</text>
    <text x="32" y="634">4 Cota de gap: se compara con la tabla de conicidad del grado/sección vigente</text>
    <text x="32" y="654">5 Plantilla de arco apoyada en 2 rodillos de referencia   6 Laina calibrada o indicador de carátula en el rodillo a verificar</text>
    <text x="32" y="676" fill="#455A64">Frecuencia: gap checker en cada paro programado de CC1 (y tras cambio de segmento); alineación con plantilla tras cada cambio de segmento/guía.</text>
  </g>
</svg>
