<text x="20" y="668" font-size="12" fill="#212121" text-anchor="start">3  S-02 → S-01: MO-EAF-02/03/04/07 + simulador EAF 40 h · NOM-020</text>
<text x="20" y="686" font-size="12" fill="#212121" text-anchor="start">4  Ingreso → S-08: MS-ACE-01/05 · NOM-017, NOM-033</text>
<text x="20" y="704" font-size="12" fill="#212121" text-anchor="start">5  S-08 → S-07: MO-OLL-01, MO-LF-01 (ayudante) · NOM-020, NOM-018</text>
<text x="20" y="722" font-size="12" fill="#212121" text-anchor="start">6  S-07 → S-06: MO-LF-01 (como A), MO-EAF-06 + simulador LF 24 h</text>
<text x="20" y="740" font-size="12" fill="#212121" text-anchor="start">7  Ingreso → S-05: MO-EAF-02, MS-ACE-07 · NOM-006, NOM-012, NOM-027</text>
<text x="20" y="758" font-size="12" fill="#212121" text-anchor="start">8  S-05 → S-04: MO-EAF-02/08, MS-ACE-04 + simulador grúa · NOM-006</text>
<text x="20" y="776" font-size="12" fill="#212121" text-anchor="start">9  S-04 → S-09: MO-OLL-02, MO-EAF-07, MO-CC1/CC2-05 · NOM-006</text>
<text x="510" y="632" font-size="12" fill="#212121" text-anchor="start">10 S-03 o S-05 → S-10: MO-EAF-05, MS-ACE-03 · equipo móvil pesado</text>
<text x="510" y="650" font-size="12" fill="#212121" text-anchor="start">11 Ingreso → S-11: MO-EAF-06, MO-LF-01 (muestreo) · NOM-010, NOM-018</text>
<text x="510" y="668" font-size="12" fill="#212121" text-anchor="start">12 Ingreso → S-15 / S-17: MO-CC1/CC2-01 o -08 · NOM-033 / NOM-006</text>
<text x="510" y="686" font-size="12" fill="#212121" text-anchor="start">13 S-15 → S-14; S-17 → S-16: MO-CC1/CC2-02 a -07 o -08 · NOM-012 / NOM-027</text>
<text x="510" y="704" font-size="12" fill="#212121" text-anchor="start">14 S-14 o S-16 → S-13: MO-CC1/CC2-01/03/05/06/07, MO-OLL-02 · NOM-009</text>
<text x="510" y="722" font-size="12" fill="#212121" text-anchor="start">15 S-13 → S-12: MO-CC1/CC2-02/03/04/07 + simulador 40 h · NOM-012 (POE CC2)</text>
<text x="510" y="740" font-size="12" fill="#212121" text-anchor="start">16 S-11 (o S-14 / S-16, punteada) → S-18: MO-CC1/CC2-09 · metrología</text>
<text x="510" y="758" font-size="12" fill="#212121" text-anchor="start">L  S-06 ↔ S-01: MO-EAF-03/04/07 · solo si el CCT permite el cambio de línea</text>
