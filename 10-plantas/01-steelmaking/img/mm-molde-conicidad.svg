<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="c" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,4 L8,4 M4,0 L4,8" stroke="#212121" stroke-width="1"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#212121">Figura MM-CC-01. Medición de conicidad y desgaste del molde (CC1 placas · CC2 tubo)</text>
  <text x="480" y="51" text-anchor="middle" font-size="12" fill="#455A64">Conicidad exagerada en el dibujo · tolerancias [Validar con OEM / Ingeniería de Mantenimiento]</text>

  <!-- PANEL IZQUIERDO: CC1 -->
  <text x="240" y="82" text-anchor="middle" font-weight="bold" fill="#455A64">A. CC1: molde de placas (vista frontal, cara ancha al fondo)</text>
  <rect x="90" y="110" width="300" height="320" fill="#FFE0B2" stroke="#E65100" stroke-width="1.5"/>
  <text x="240" y="430" text-anchor="middle" font-size="11" fill="#E65100" dy="-6">Cara ancha Cu-Ag + Ni</text>
  <!-- caras angostas -->
  <polygon points="90,110 112,110 124,430 90,430" fill="#FFB74D" stroke="#E65100" stroke-width="2"/>
  <polygon points="390,110 368,110 356,430 390,430" fill="#FFB74D" stroke="#E65100" stroke-width="2"/>
  <!-- menisco -->
  <line x1="112" y1="150" x2="368" y2="150" stroke="#1E88E5" stroke-dasharray="5 4"/>
  <text x="240" y="145" text-anchor="middle" font-size="11" fill="#1E88E5">Menisco ≈ 100 mm bajo el borde</text>
  <!-- cotas Ws y Wi -->
  <line x1="112" y1="125" x2="368" y2="125" stroke="#212121" marker-start="url(#c)" marker-end="url(#c)"/>
  <text x="240" y="121" text-anchor="middle" font-size="12" font-weight="bold">Ws (superior)</text>
  <line x1="124" y1="415" x2="356" y2="415" stroke="#212121" marker-start="url(#c)" marker-end="url(#c)"/>
  <text x="240" y="409" text-anchor="middle" font-size="12" font-weight="bold">Wi (inferior)</text>
  <!-- puntos de medición -->
  <g fill="#C62828">
    <circle cx="113" cy="160" r="5"/><circle cx="118" cy="270" r="5"/><circle cx="123" cy="395" r="5"/>
    <circle cx="367" cy="160" r="5"/><circle cx="362" cy="270" r="5"/><circle cx="357" cy="395" r="5"/>
  </g>
  <text x="60" y="164" font-size="11" fill="#C62828">P1</text>
  <text x="60" y="274" font-size="11" fill="#C62828">P2</text>
  <text x="60" y="399" font-size="11" fill="#C62828">P3</text>
  <!-- conicímetro -->
  <rect x="330" y="170" width="16" height="215" fill="#455A64" transform="rotate(-2.2 338 277)"/>
  <rect x="300" y="250" width="44" height="30" rx="3" fill="#212121"/>
  <text x="322" y="270" text-anchor="middle" font-size="10" fill="#76FF03">1.10</text>
  <!-- L -->
  <line x1="410" y1="160" x2="410" y2="395" stroke="#212121" marker-start="url(#c)" marker-end="url(#c)"/>
  <text x="422" y="280" font-size="12" font-weight="bold">L</text>
  <text x="240" y="455" text-anchor="middle" font-size="12">Conicidad (%/m) = (Ws − Wi) / (Wi × L) × 100</text>
  <text x="240" y="473" text-anchor="middle" font-size="11" fill="#455A64">Ej.: Wi = 1,250 mm, L = 0.80 m, 1.10 %/m → Ws − Wi = 11.0 mm (5.5 mm/lado)</text>

  <!-- PANEL DERECHO: CC2 -->
  <text x="720" y="82" text-anchor="middle" font-weight="bold" fill="#455A64">B. CC2: tubo 160 × 160 mm (sección y perfil)</text>
  <rect x="520" y="130" width="160" height="160" rx="8" fill="#FFE0B2" stroke="#E65100" stroke-width="3"/>
  <line x1="522" y1="132" x2="678" y2="288" stroke="#C62828" stroke-width="1.5"/>
  <line x1="678" y1="132" x2="522" y2="288" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="560" y="160" font-size="12" font-weight="bold" fill="#C62828">D1</text>
  <text x="640" y="160" font-size="12" font-weight="bold" fill="#1E88E5">D2</text>
  <line x1="520" y1="310" x2="680" y2="310" stroke="#212121" marker-start="url(#c)" marker-end="url(#c)"/>
  <text x="600" y="326" text-anchor="middle" font-size="11">160 mm en menisco (tubo nuevo)</text>
  <text x="600" y="346" text-anchor="middle" font-size="11">|D1 − D2| ≤ 0.5 mm (romboidad)</text>
  <!-- chaqueta -->
  <rect x="508" y="118" width="184" height="184" rx="12" fill="none" stroke="#1E88E5" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="600" y="112" text-anchor="middle" font-size="10" fill="#1E88E5">Chaqueta de agua, ranura ≈ 4 mm, 10–12 m/s</text>
  <!-- perfil del tubo -->
  <polygon points="760,110 780,110 786,430 766,430" fill="#FFB74D" stroke="#E65100" stroke-width="2"/>
  <polygon points="900,110 880,110 874,430 894,430" fill="#FFB74D" stroke="#E65100" stroke-width="2"/>
  <g stroke="#455A64" stroke-width="1">
    <line x1="780" y1="142" x2="880" y2="142"/><line x1="781" y1="174" x2="879" y2="174"/>
    <line x1="781" y1="206" x2="879" y2="206"/><line x1="782" y1="238" x2="878" y2="238"/>
    <line x1="782" y1="270" x2="878" y2="270"/><line x1="783" y1="302" x2="877" y2="302"/>
    <line x1="784" y1="334" x2="876" y2="334"/><line x1="785" y1="366" x2="875" y2="366"/>
    <line x1="785" y1="398" x2="875" y2="398"/>
  </g>
  <rect x="781" y="140" width="98" height="40" fill="#C62828" opacity="0.15"/>
  <rect x="784" y="360" width="90" height="70" fill="#C62828" opacity="0.15"/>
  <text x="830" y="100" text-anchor="middle" font-size="11">Estaciones cada 100 mm</text>
  <text x="910" y="165" font-size="10" fill="#C62828">Zona</text>
  <text x="910" y="177" font-size="10" fill="#C62828">menisco</text>
  <text x="904" y="395" font-size="10" fill="#C62828">Esquinas</text>
  <text x="904" y="407" font-size="10" fill="#C62828">inferiores</text>
  <line x1="745" y1="110" x2="745" y2="430" stroke="#212121" marker-start="url(#c)" marker-end="url(#c)"/>
  <text x="737" y="270" font-size="11" text-anchor="middle" transform="rotate(-90 737 270)">1,000 mm</text>
  <!-- sonda -->
  <rect x="822" y="250" width="16" height="60" fill="#455A64"/>
  <line x1="830" y1="250" x2="830" y2="90" stroke="#455A64" stroke-width="3"/>
  <text x="845" y="290" font-size="10">Sonda LVDT/láser</text>

  <!-- Números -->
  <g font-size="12" font-weight="bold" fill="#ffffff">
    <circle cx="70" cy="118" r="11" fill="#212121"/><text x="70" y="122" text-anchor="middle">1</text>
    <circle cx="60" cy="230" r="11" fill="#212121"/><text x="60" y="234" text-anchor="middle">2</text>
    <circle cx="290" cy="300" r="11" fill="#212121"/><text x="290" y="304" text-anchor="middle">3</text>
    <circle cx="505" cy="210" r="11" fill="#212121"/><text x="505" y="214" text-anchor="middle">4</text>
    <circle cx="815" cy="215" r="11" fill="#212121"/><text x="815" y="219" text-anchor="middle">5</text>
    <circle cx="930" cy="140" r="11" fill="#212121"/><text x="930" y="144" text-anchor="middle">6</text>
  </g>

  <!-- Tabla de tolerancias -->
  <rect x="20" y="490" width="920" height="200" fill="#FAFAFA" stroke="#B0BEC5"/>
  <g font-size="12" fill="#212121">
    <text x="32" y="510" font-weight="bold">Criterio</text>
    <text x="250" y="510" font-weight="bold">CC1 placas (Cu-Ag + Ni, 900 mm)</text>
    <text x="620" y="510" font-weight="bold">CC2 tubo (Cu-Ag, 1,000 mm)</text>
    <line x1="30" y1="516" x2="930" y2="516" stroke="#B0BEC5"/>
    <text x="32" y="534">Conicidad</text>
    <text x="250" y="534">1.0–1.2 %/m caras angostas; ±0.05 %/m del ajuste</text>
    <text x="620" y="534">0.8–1.0 %/m; retirar si pérdida &gt; 20 %</text>
    <text x="32" y="554">Desgaste máximo local</text>
    <text x="250" y="554">0.5 mm (rayas, marcas, Ni perdido)</text>
    <text x="620" y="554">0.5 mm en esquinas / zona inferior</text>
    <text x="32" y="574">Espesor mínimo de Cu</text>
    <text x="250" y="574">25 mm (nuevo ≈ 40 mm; rectificado ≤ 2 mm/vez)</text>
    <text x="620" y="574">Pared ≥ 10 mm (nuevo ≈ 13–15 mm)</text>
    <text x="32" y="594">Geometría</text>
    <text x="250" y="594">Ancho ±1.0 mm; planitud cara ancha ≤ 0.2 mm</text>
    <text x="620" y="594">Lado ±0.3 mm; |D1 − D2| ≤ 0.5 mm</text>
    <text x="32" y="614">Instrumento</text>
    <text x="250" y="614">Conicímetro digital (±0.01 %/m), regla y lainas, UT</text>
    <text x="620" y="614">Perfilómetro de tubo LVDT/láser (±0.02 mm)</text>
    <text x="32" y="634">Leyenda</text>
    <text x="250" y="634">1 Cara angosta ajustable  2 Puntos P1–P3  3 Conicímetro</text>
    <text x="620" y="634">4 Chaqueta de agua  5 Sonda  6 Zonas de desgaste</text>
    <text x="32" y="664" fill="#455A64">Fuente de conicidades: FT-ACE-001 §4 y §5. Espesores, desgaste y geometría: [Validar con OEM / Ingeniería de Mantenimiento].</text>
  </g>
</svg>
