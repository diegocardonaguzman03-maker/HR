oraza &gt; 350 °C</text><text x="532" y="635" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">alarma; &gt; 400 °C</text><text x="532" y="650" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">retira de ciclo</text><text x="532" y="665" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Precalienta</text><text x="532" y="680" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">1,000–1,100 °C</text><text x="30" y="772" font-size="12" text-anchor="start" font-weight="bold" fill="#C62828">Nunca proyectes sobre metal líquido. Material y arena secos (MS-ACE-03).</text>
