<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <g id="lock">
      <path d="M-6,-2 L-6,-8 A6,6 0 0 1 6,-8 L6,-2" fill="none" stroke="#C62828" stroke-width="2.5"/>
      <rect x="-8" y="-2" width="16" height="12" rx="2" fill="#C62828"/>
    </g>
  </defs>

  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">Figura 1. Puntos de aislamiento y bloqueo (LOTO) del EAF-1 / EAF-2</text>
  <text x="500" y="46" text-anchor="middle" font-size="12" fill="#212121">Esquemático. Candado rojo = punto de bloqueo obligatorio. Valores de equipo según FT-ACE-001; tensión primaria [Validar con OEM / diagrama unifilar]</text>

  <!-- ELECTRICO -->
  <rect x="30" y="80" width="120" height="50" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="90" y="101" text-anchor="middle" fill="#212121">Subestación</text>
  <text x="90" y="117" text-anchor="middle" fill="#212121">alta tensión</text>
  <line x1="150" y1="105" x2="195" y2="105" stroke="#455A64" stroke-width="3"/>
  <rect x="195" y="85" width="70" height="40" fill="#ffffff" stroke="#C62828" stroke-width="2.5"/>
  <text x="230" y="102" text-anchor="middle" fill="#212121">Interruptor</text>
  <text x="230" y="117" text-anchor="middle" fill="#212121">AT (VCB)</text>
  <use href="#lock" x="230" y="145"/>
  <line x1="265" y1="105" x2="300" y2="105" stroke="#455A64" stroke-width="3"/>
  <!-- seccionador -->
  <line x1="300" y1="105" x2="325" y2="90" stroke="#455A64" stroke-width="3"/>
  <line x1="330" y1="105" x2="350" y2="105" stroke="#455A64" stroke-width="3"/>
  <line x1="315" y1="105" x2="315" y2="130" stroke="#455A64" stroke-width="2"/>
  <line x1="305" y1="130" x2="325" y2="130" stroke="#455A64" stroke-width="2"/>
  <line x1="309" y1="135" x2="321" y2="135" stroke="#455A64" stroke-width="2"/>
  <text x="315" y="152" text-anchor="middle" fill="#212121">tierra</text>
  <use href="#lock" x="338" y="80"/>
  <!-- transformador -->
  <rect x="350" y="75" width="110" height="65" fill="#455A64" stroke="#212121" stroke-width="2"/>
  <text x="405" y="100" text-anchor="middle" fill="#ffffff">Transformador</text>
  <text x="405" y="116" text-anchor="middle" fill="#ffffff">140 MVA</text>
  <text x="405" y="131" text-anchor="middle" fill="#ffffff">sec. ≤ 1,200 V</text>
  <!-- barras al brazo -->
  <path d="M460,108 L560,108 L560,165 L660,165" fill="none" stroke="#FF8F00" stroke-width="5"/>
  <text x="510" y="100" text-anchor="middle" fill="#212121">cables flexibles</text>

  <!-- HORNO -->
  <!-- mastil y brazo -->
  <rect x="660" y="150" width="22" height="260" fill="#455A64"/>
  <rect x="440" y="160" width="242" height="18" fill="#607D8B" stroke="#212121"/>
  <rect x="468" y="140" width="14" height="140" fill="#212121"/>
  <rect x="503" y="140" width="14" height="140" fill="#212121"/>
  <rect x="538" y="140" width="14" height="140" fill="#212121"/>
  <!-- boveda -->
  <path d="M400,285 Q510,220 620,285 Z" fill="#1E88E5" fill-opacity="0.25" stroke="#1E88E5" stroke-width="3"/>
  <!-- coraza -->
  <rect x="400" y="285" width="220" height="80" fill="#1E88E5" fill-opacity="0.18" stroke="#1E88E5" stroke-width="3"/>
  <path d="M400,365 L400,375 Q510,440 620,375 L620,365 Z" fill="#8D6E63" stroke="#212121" stroke-width="2"/>
  <path d="M418,370 Q510,420 602,370 Z" fill="#E65100"/>
  <text x="510" y="330" text-anchor="middle" fill="#212121">paneles enfriados</text>
  <text x="510" y="346" text-anchor="middle" fill="#212121">por agua</text>
  <!-- EBT -->
  <rect x="600" y="400" width="18" height="30" fill="#8D6E63" stroke="#212121"/>
  <text x="640" y="428" fill="#212121">EBT</text>
  <!-- cuna / basculamiento -->
  <path d="M420,430 Q510,470 600,430" fill="none" stroke="#455A64" stroke-width="6"/>
  <rect x="450" y="455" width="120" height="16" fill="#455A64"/>
  <rect x="468" y="471" width="14" height="30" fill="#212121"/>
  <text x="465" y="518" text-anchor="middle" fill="#212121">pasador de</text>
  <text x="465" y="532" text-anchor="middle" fill="#212121">basculamiento</text>
  <use href="#lock" x="498" y="492"/>

  <!-- HIDRAULICA -->
  <rect x="760" y="440" width="150" height="70" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="835" y="462" text-anchor="middle" fill="#212121">Unidad hidráulica</text>
  <text x="835" y="478" text-anchor="middle" fill="#212121">(electrodos, bóveda,</text>
  <text x="835" y="494" text-anchor="middle" fill="#212121">basculamiento)</text>
  <ellipse cx="930" cy="470" rx="14" ry="28" fill="#90A4AE" stroke="#212121"/>
  <text x="930" y="518" text-anchor="middle" fill="#212121">acumulador</text>
  <use href="#lock" x="775" y="530"/>
  <path d="M760,470 L700,470 L700,300 L682,300" fill="none" stroke="#6D4C41" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="712" y="390" fill="#6D4C41">aceite</text>
  <!-- bloqueo mecanico brazos -->
  <rect x="655" y="138" width="32" height="10" fill="#C62828"/>
  <text x="692" y="150" fill="#212121">calza mecánica de columna</text>

  <!-- AGUA -->
  <rect x="40" y="300" width="150" height="60" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
  <text x="115" y="322" text-anchor="middle" fill="#212121">Cabezal de agua</text>
  <text x="115" y="338" text-anchor="middle" fill="#212121">2,200 m³/h · 4–6 bar</text>
  <line x1="190" y1="315" x2="400" y2="315" stroke="#1E88E5" stroke-width="4"/>
  <line x1="190" y1="345" x2="400" y2="345" stroke="#1E88E5" stroke-width="4" stroke-dasharray="7,4"/>
  <text x="300" y="308" text-anchor="middle" fill="#212121">suministro</text>
  <text x="300" y="362" text-anchor="middle" fill="#212121">retorno / dren</text>
  <polygon points="240,305 260,325 260,305 240,325" fill="#1E88E5" stroke="#212121"/>
  <polygon points="320,335 340,355 340,335 320,355" fill="#1E88E5" stroke="#212121"/>
  <use href="#lock" x="250" y="290"/>
  <use href="#lock" x="330" y="382"/>

  <!-- GASES Y CARBONO -->
  <rect x="40" y="420" width="150" height="80" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
  <text x="115" y="442" text-anchor="middle" fill="#212121">Estación de válvulas</text>
  <text x="115" y="458" text-anchor="middle" fill="#212121">O₂ · gas natural ·</text>
  <text x="115" y="474" text-anchor="middle" fill="#212121">aire de transporte C</text>
  <text x="115" y="490" text-anchor="middle" fill="#212121">(4 quemadores/lanzas)</text>
  <path d="M190,450 L400,350" fill="none" stroke="#43A047" stroke-width="3"/>
  <path d="M190,475 L405,358" fill="none" stroke="#43A047" stroke-width="3" stroke-dasharray="6,3"/>
  <polygon points="250,470 268,488 268,470 250,488" fill="#43A047" stroke="#212121"/>
  <polygon points="280,470 298,488 298,470 280,488" fill="#43A047" stroke="#212121"/>
  <line x1="274" y1="479" x2="274" y2="500" stroke="#43A047" stroke-width="2"/>
  <text x="274" y="515" text-anchor="middle" fill="#212121">venteo</text>
  <use href="#lock" x="259" y="455"/>
  <rect x="210" y="530" width="100" height="20" fill="#ffffff" stroke="#212121"/>
  <text x="260" y="545" text-anchor="middle" fill="#212121">brida ciega</text>

  <!-- DRI -->
  <path d="M900,90 L700,90 L610,140 L560,215" fill="none" stroke="#6D4C41" stroke-width="7"/>
  <rect x="880" y="70" width="80" height="40" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="920" y="87" text-anchor="middle" fill="#212121">Motor banda</text>
  <text x="920" y="102" text-anchor="middle" fill="#212121">DRI (MCC)</text>
  <use href="#lock" x="920" y="130"/>
  <text x="760" y="80" fill="#212121">DRI/HBI 3.5–5.0 t/min</text>
  <rect x="590" y="190" width="30" height="12" fill="#C62828"/>
  <line x1="620" y1="196" x2="688" y2="218" stroke="#212121" stroke-width="1"/>
  <text x="692" y="222" fill="#212121">compuerta 5.º agujero</text>

  <!-- CAJA GRUPAL -->
  <rect x="780" y="250" width="180" height="150" fill="#FFF8E1" stroke="#C62828" stroke-width="2.5"/>
  <text x="870" y="272" text-anchor="middle" font-weight="bold" fill="#212121">Caja grupal de bloqueo</text>
  <text x="870" y="290" text-anchor="middle" fill="#212121">llaves de los candados</text>
  <text x="870" y="305" text-anchor="middle" fill="#212121">de equipo adentro</text>
  <use href="#lock" x="810" y="335"/>
  <use href="#lock" x="840" y="335"/>
  <use href="#lock" x="870" y="335"/>
  <use href="#lock" x="900" y="335"/>
  <use href="#lock" x="930" y="335"/>
  <text x="870" y="370" text-anchor="middle" fill="#212121">1 candado personal por</text>
  <text x="870" y="386" text-anchor="middle" fill="#212121">trabajador + tarjeta</text>

  <!-- Marcadores -->
  <g font-size="12" font-weight="bold" fill="#ffffff">
    <circle cx="230" cy="68" r="11" fill="#212121"/><text x="230" y="72" text-anchor="middle">1</text>
    <circle cx="338" cy="58" r="11" fill="#212121"/><text x="338" y="62" text-anchor="middle">2</text>
    <circle cx="405" cy="158" r="11" fill="#212121"/><text x="405" y="162" text-anchor="middle">3</text>
    <circle cx="820" cy="425" r="11" fill="#212121"/><text x="820" y="429" text-anchor="middle">4</text>
    <circle cx="705" cy="178" r="11" fill="#212121"/><text x="705" y="182" text-anchor="middle">5</text>
    <circle cx="440" cy="492" r="11" fill="#212121"/><text x="440" y="496" text-anchor="middle">6</text>
    <circle cx="210" cy="290" r="11" fill="#212121"/><text x="210" y="294" text-anchor="middle">7</text>
    <circle cx="225" cy="410" r="11" fill="#212121"/><text x="225" y="414" text-anchor="middle">8</text>
    <circle cx="865" cy="62" r="11" fill="#212121"/><text x="865" y="66" text-anchor="middle">9</text>
    <circle cx="770" cy="262" r="11" fill="#212121"/><text x="770" y="266" text-anchor="middle">10</text>
    <circle cx="565" cy="262" r="11" fill="#212121"/><text x="565" y="266" text-anchor="middle">11</text>
  </g>

  <!-- Prueba energia cero -->
  <rect x="30" y="570" width="440" height="235" fill="#FAFAFA" stroke="#455A64"/>
  <text x="45" y="592" font-size="14" font-weight="bold" fill="#212121">Leyenda de puntos de aislamiento</text>
  <g font-size="12" fill="#212121">
    <text x="45" y="612">1  Interruptor de AT del horno: abierto, extraído (rack-out), candado</text>
    <text x="45" y="630">2  Seccionador abierto + puesta a tierra aplicada (solo S-20 NOM-029)</text>
    <text x="45" y="648">3  Transformador 140 MVA: OLTC en local, sin mando remoto</text>
    <text x="45" y="666">4  Unidad hidráulica: bomba bloqueada, acumuladores a 0 bar</text>
    <text x="45" y="684">5  Brazos/columnas: calza mecánica; electrodos apoyados o soportados</text>
    <text x="45" y="702">6  Basculamiento: pasador puesto; horno a nivel (0°)</text>
    <text x="45" y="720">7  Agua de paneles: suministro y retorno cerrados, dren abierto</text>
    <text x="45" y="738">   (solo el panel en reparación; horno frío si se ingresa)</text>
    <text x="45" y="756">8  O₂ / GN / carbono: doble bloqueo y purga + brida ciega si hay ingreso</text>
    <text x="45" y="774">9  Banda de DRI: motor bloqueado en MCC; compuerta 5.º agujero cerrada</text>
    <text x="45" y="792">10 Caja grupal · 11 Zona de trabajo (bóveda, coraza, solera)</text>
  </g>
  <rect x="490" y="570" width="480" height="235" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="505" y="592" font-size="14" font-weight="bold" fill="#C62828">Prueba de energía cero (antes de tocar)</text>
  <g font-size="12" fill="#212121">
    <text x="505" y="614">a) Intenta arrancar desde HMI del púlpito y desde el mando local:</text>
    <text x="505" y="630">    el equipo NO debe moverse ni energizarse.</text>
    <text x="505" y="650">b) S-20 mide ausencia de tensión con detector de AT probado antes</text>
    <text x="505" y="666">    y después (vivo–muerto–vivo); lectura = 0 V en las 3 fases.</text>
    <text x="505" y="686">c) Manómetros hidráulicos y de acumuladores: 0 bar.</text>
    <text x="505" y="706">d) Agua del panel: 0 bar y dren sin flujo; O₂/GN: 0 bar en el venteo.</text>
    <text x="505" y="726">e) Detector multigás en la zona: O₂ 19.5–23.5 %, CO &lt; 25 ppm,</text>
    <text x="505" y="742">    gas natural 0 % LEL (&lt; 10 % LEL es el límite de trabajo).</text>
    <text x="505" y="762">f) Temperatura de la superficie de trabajo ≤ 50 °C [Supuesto].</text>
    <text x="505" y="782">g) Registra lecturas en el permiso; firman ejecutor y C-05/C-11.</text>
    <text x="505" y="798" fill="#C62828">Si cualquier lectura no cumple: NO trabajes, avisa a C-04.</text>
  </g>
</svg>
