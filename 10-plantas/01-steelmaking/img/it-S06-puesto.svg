  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">Figura IT-S06. Mi estación: horno olla (LF-1 / LF-2) y púlpito del LF — vista en planta</text>
  <text x="500" y="46" text-anchor="middle" font-size="12" fill="#212121">Esquemático sin escala. Zonas según MS-ACE-01 y MO-LF-01 §6.3 [Supuesto — Validar con C-16 / estudio de la nave]</text>
