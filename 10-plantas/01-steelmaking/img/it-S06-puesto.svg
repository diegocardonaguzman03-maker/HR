  <text x="355" y="134" font-size="12" fill="#212121" text-anchor="middle">Tolvas y</text>
  <text x="355" y="150" font-size="12" fill="#212121" text-anchor="middle">báscula</text>
  <line x1="380" y1="165" x2="415" y2="230" stroke="#455A64" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="560" y="360" width="120" height="50" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="620" y="382" font-size="12" fill="#212121" text-anchor="middle">Alimentador</text>
  <text x="620" y="398" font-size="11" fill="#212121" text-anchor="middle">de alambre (2 líneas)</text>
