  <text x="60" y="318" font-size="12" fill="#455A64" text-anchor="start">← vía del carro desde el EAF</text>
  <text x="760" y="318" font-size="12" fill="#455A64" text-anchor="start">hacia posición de izaje →</text>
  <rect x="250" y="300" width="110" height="28" fill="none" stroke="#C62828" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="305" y="318" font-size="11" fill="#C62828" text-anchor="middle">fosa (argón)</text>
