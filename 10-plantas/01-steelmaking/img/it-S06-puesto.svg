  <text x="125" y="135" font-size="12" fill="#212121" text-anchor="middle" font-weight="bold">PÚLPITO LF (S-06)</text>
  <text x="125" y="153" font-size="11" fill="#212121" text-anchor="middle">HMI · nivel 2 · radio</text>
  <rect x="60" y="165" width="50" height="28" fill="#FFFFFF" stroke="#455A64" stroke-width="1.5"/>
  <text x="85" y="183" font-size="10" fill="#212121" text-anchor="middle">llaves</text>
  <rect x="130" y="165" width="60" height="28" fill="#FFFFFF" stroke="#455A64" stroke-width="1.5"/>
  <text x="160" y="183" font-size="10" fill="#212121" text-anchor="middle">HMI</text>
  <line x1="210" y1="150" x2="240" y2="150" stroke="#455A64" stroke-width="6"/>
  <path d="M700,280 L900,280" fill="none" stroke="#E65100" stroke-width="4" marker-end="url(#arrO)"/>
  <text x="800" y="236" font-size="12" fill="#E65100" text-anchor="middle">Olla liberada → grúa</text>
  <text x="800" y="252" font-size="12" fill="#E65100" text-anchor="middle">de colada (MO-OLL-02)</text>
  <path d="M125,205 L125,470 L140,490" fill="none" stroke="#2E7D32" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrG)"/>
  <path d="M700,440 L870,440 L880,490" fill="none" stroke="#2E7D32" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrG)"/>
  <text x="720" y="470" font-size="12" fill="#2E7D32" text-anchor="start" font-weight="bold">PR2 nave de ollas y LF</text>
  <rect x="20" y="520" width="960" height="290" fill="#FAFAFA" stroke="#455A64" stroke-width="1"/>
  <text x="35" y="542" font-size="14" fill="#212121" text-anchor="start" font-weight="bold">Leyenda</text>
  <text x="35" y="562" font-size="12" fill="#212121" text-anchor="start">1  Púlpito del LF: aquí opero HMI, argón, arco y adiciones; es mi refugio</text>
  <text x="35" y="580" font-size="12" fill="#212121" text-anchor="start">2  Bóveda y 3 electrodos de 457 mm (18"): nadie arriba con el arco encendido</text>
  <text x="35" y="598" font-size="12" fill="#212121" text-anchor="start">3  Transformador del LF de 25 MVA (calentamiento 4–5 °C/min)</text>
  <text x="35" y="616" font-size="12" fill="#212121" text-anchor="start">4  Tolvas de aleaciones y fundentes con báscula (materiales secos)</text>
  <text x="35" y="634" font-size="12" fill="#212121" text-anchor="start">5  Alimentador de alambre de 2 líneas: CaSi, Al, C (lo opera S-07)</text>
  <text x="35" y="652" font-size="12" fill="#212121" text-anchor="start">6  Estación de argón y tapón poroso: fuerte 400–600, suave 50–150 NL/min</text>
  <text x="35" y="670" font-size="12" fill="#212121" text-anchor="start">7  Lanza manipuladora: temperatura, oxígeno y muestra (S-07)</text>
  <text x="35" y="688" font-size="12" fill="#212121" text-anchor="start">8  Fosa del carro y túneles de argón: espacio confinado (MS-ACE-05/06)</text>
  <text x="35" y="706" font-size="12" fill="#212121" text-anchor="start">9  Posición de izaje: la grúa de colada (S-09) toma la olla liberada</text>
  <text x="35" y="724" font-size="12" fill="#212121" text-anchor="start">10  Tablero de llaves cautivas (plataforma de electrodos, MS-ACE-02 §6.4)</text>
  <text x="560" y="542" font-size="13" fill="#212121" text-anchor="start" font-weight="bold">Zonas y valores clave</text>
  <rect x="560" y="554" width="18" height="14" fill="#C62828" stroke="#C62828" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="566" font-size="12" fill="#212121" text-anchor="start">ROJA: solo personal esencial, EPP aluminizado</text>
  <rect x="560" y="574" width="18" height="14" fill="#FBC02D" stroke="#F9A825" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="586" font-size="12" fill="#212121" text-anchor="start">AMARILLA: autorizado, tras barrera, EPP completo</text>
  <rect x="560" y="594" width="18" height="14" fill="#43A047" stroke="#2E7D32" stroke-width="1" fill-opacity="0.45"/>
  <text x="585" y="606" font-size="12" fill="#212121" text-anchor="start">VERDE: tránsito con EPP básico de nave</text>
  <line x1="560" y1="621" x2="578" y2="621" stroke="#2E7D32" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="585" y="626" font-size="12" fill="#212121" text-anchor="start">Ruta de escape → salida (verde en el muro)</text>
  <text x="560" y="650" font-size="12" fill="#212121" text-anchor="start">Roja ≤ 5 m de la ventana o del agujero de muestreo</text>
  <text x="560" y="668" font-size="12" fill="#212121" text-anchor="start">Amarilla 5–15 m (inyección de CaSi y agitación fuerte)</text>
  <text x="560" y="686" font-size="12" fill="#212121" text-anchor="start">Vía del carro ± 5 m = roja mientras se mueve el carro</text>
  <text x="560" y="704" font-size="12" fill="#212121" text-anchor="start">Tratamiento 35–45 min · Ar suave ≥ 8 min antes de enviar</text>
  <text x="560" y="722" font-size="12" fill="#212121" text-anchor="start">Bordo libre ≥ 300 mm antes de agitar [Supuesto]</text>
  <text x="560" y="740" font-size="12" fill="#C62828" text-anchor="start">Fuga de agua o perforación de olla: evacúa a ≥ 25 m</text>
  <text x="560" y="758" font-size="12" fill="#C62828" text-anchor="start">Punto de reunión: PR2 (nave de ollas y LF)</text>
