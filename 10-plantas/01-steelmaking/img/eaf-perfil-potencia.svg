<text x="752.0" y="402.4" text-anchor="end" font-size="11" fill="#BF360C">113 MW · 66 kA</text>
<text x="483.7" y="455.7" text-anchor="middle" font-size="12" fill="#212121">DRI por el 5.º agujero ≈ 3.7 t/min (≈ 165 t) · escoria espumosa desde el arranque</text>
<rect x="20" y="600" width="960" height="92" fill="#FAFAFA" stroke="#455A64"/>
<text x="30" y="618" font-size="11.5" fill="#212121">Leyenda: línea azul = voltaje secundario (tap del OLTC); línea naranja = potencia activa (MW); texto = corriente de arco por fase (kA).</text>
<text x="30" y="637" font-size="11.5" fill="#212121">(1) Preparación, arco apagado (pie líquido 30–40 t). (2) Arranque sobre pie líquido: tap 12, arco estable, DRI en rampa. Con canasta de retornos: arco corto 1–2 min.</text>
<text x="30" y="656" font-size="11.5" fill="#212121">(3) Baño plano con DRI: tap 15 solo con escoria espumosa estable (sin chatarra que proteja las paredes); si la espuma cae, baja a tap 12–13. (4) Afino: tap 14.</text>
<text x="30" y="675" font-size="11.5" fill="#212121">(5) Vaciado, arco apagado. Energía ≈ 640 kWh/t con ≈ 50 min de arco (≈ 115 MW medios). Arranque en frío: ver MO-EAF-04 §3. [Validar con OEM / Ingeniería de Proceso]</text>
