<rect x="20" y="600" width="960" height="92" fill="#FAFAFA" stroke="#455A64"/>
<text x="30" y="618" font-size="11.5" fill="#212121">Leyenda: línea azul = voltaje secundario (tap del OLTC); línea naranja = potencia activa (MW); texto = corriente de arco por fase (kA).</text>
<text x="30" y="637" font-size="11.5" fill="#212121">(1) Carga, arco apagado. (2) Perforación: tap medio y arco corto para proteger bóveda y paneles. (3) Fusión de canasta: tap máximo, arco largo cubierto por chatarra.</text>
<text x="30" y="656" font-size="11.5" fill="#212121">(4) Baño plano con DRI: tap máximo solo con escoria espumosa estable (arco cubierto); si la espuma cae, baja a tap 12–13. (5) Afino: tap 13–14.</text>
<text x="30" y="675" font-size="11.5" fill="#212121">(6) Vaciado y preparación, arco apagado. Energía resultante ≈ 560 kWh/t con 42 min de arco. [Validar con OEM / Ingeniería de Proceso]</text>
