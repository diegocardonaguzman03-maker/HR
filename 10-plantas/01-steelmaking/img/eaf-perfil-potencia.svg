<text x="866" y="359.0" text-anchor="end" font-size="11" fill="#C62828">límite práctico ≈ 119 MW (140 MVA × FP 0.85)</text>
<text x="215.3" y="129.2" font-size="11" fill="#0D47A1">tap 12 · 1,080 V</text>
<text x="215.3" y="422.7" font-size="11" fill="#BF360C">95 MW · 60 kA</text>
<text x="483.7" y="78.9" text-anchor="middle" font-size="11" fill="#0D47A1">tap 15 · 1,200 V</text>
<text x="483.7" y="382.1" text-anchor="middle" font-size="11" fill="#BF360C">≈ 117 MW · 66 kA</text>
