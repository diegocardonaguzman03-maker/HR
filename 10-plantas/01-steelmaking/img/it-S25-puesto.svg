<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="Arial, Helvetica, sans-serif" font-size="12">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#43A047"/></marker><marker id="fk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#212121"/></marker></defs>
<text x="500" y="26" font-size="16" text-anchor="middle" font-weight="bold" fill="#212121">Figura 1. Mi área de trabajo — S-25 Mecánico de Taller de Moldes y Segmentos</text><text x="500" y="46" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">Horario de día en taller; en campo con la guardia de S-19. Esquema sin escala; valores de MM-CC-01 y MM-CC-02</text>
<rect x="20" y="62" width="620" height="462" rx="0" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
<text x="30" y="80" font-size="12" text-anchor="start" font-weight="bold" fill="#212121">Taller de moldes y segmentos — vista en planta, sin escala</text>
<rect x="40" y="95" width="580" height="70" rx="0" fill="#ffffff" stroke="#455A64" stroke-width="1.5"/>
<rect x="40" y="180" width="580" height="150" rx="0" fill="#ffffff" stroke="#455A64" stroke-width="1.5"/>
<rect x="40" y="345" width="580" height="110" rx="0" fill="#ffffff" stroke="#455A64" stroke-width="1.5"/>
<rect x="40" y="95" width="580" height="70" rx="6" fill="#C62828" fill-opacity="0.28" stroke="#C62828" stroke-width="1.5" stroke-dasharray="6 3"/>
<rect x="40" y="180" width="200" height="150" rx="6" fill="#F9A825" fill-opacity="0.28" stroke="#F9A825" stroke-width="1.5" stroke-dasharray="6 3"/>
<rect x="255" y="180" width="365" height="150" rx="6" fill="#43A047" fill-opacity="0.28" stroke="#43A047" stroke-width="1.5" stroke-dasharray="6 3"/>
<rect x="40" y="345" width="580" height="110" rx="6" fill="#43A047" fill-opacity="0.28" stroke="#43A047" stroke-width="1.5" stroke-dasharray="6 3"/>
<line x1="40" y1="100" x2="620" y2="100" stroke="#455A64" stroke-width="3" stroke-dasharray="8 4"/>
<line x1="40" y1="160" x2="620" y2="160" stroke="#455A64" stroke-width="3" stroke-dasharray="8 4"/>
<text x="330" y="120" font-size="12" text-anchor="middle" font-weight="bold" fill="#212121">Corredor de izaje — grúa de CC 50 t (nadie bajo la carga, ± 5 m)</text>
<rect x="80" y="130" width="90" height="24" rx="0" fill="#FF8F00" stroke="#212121" stroke-width="1.5"/>
<text x="125" y="147" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">molde</text>
<rect x="420" y="130" width="120" height="24" rx="0" fill="#455A64" stroke="#212121" stroke-width="1.5"/>
<text x="480" y="147" font-size="12" text-anchor="middle" font-weight="normal" fill="#ffffff">segmento</text>
<rect x="55" y="195" width="170" height="120" rx="0" fill="#ffffff" stroke="#455A64" stroke-width="1.5"/>
<text x="140" y="225" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">Máquinas herramienta</text><text x="140" y="240" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">torno · fresadora</text><text x="140" y="255" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">rectificadora</text><text x="140" y="270" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">(guardas NOM-004)</text>
<rect x="270" y="195" width="160" height="55" rx="0" fill="#ffffff" stroke="#455A64" stroke-width="1.5"/>
<text x="350" y="218" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">Banco de medición</text><text x="350" y="233" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">de moldes</text>
<rect x="270" y="260" width="160" height="55" rx="0" fill="#ffffff" stroke="#455A64" stroke-width="1.5"/>
<text x="350" y="283" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">Banco de prueba</text><text x="350" y="298" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">de presión (≤ 25 bar)</text>
<rect x="445" y="195" width="160" height="120" rx="0" fill="#ffffff" stroke="#455A64" stroke-width="1.5"/>
<text x="525" y="235" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">Banco de segmentos</text><text x="525" y="250" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">rodillos, rodamientos,</text><text x="525" y="265" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">boquillas, gap en banco</text>
<rect x="55" y="360" width="170" height="80" rx="0" fill="#ffffff" stroke="#455A64" stroke-width="1.5"/>
<text x="140" y="385" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">Almacén de moldes</text><text x="140" y="400" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">y tubos liberados</text><text x="140" y="415" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">(hoja firmada)</text>
<rect x="240" y="360" width="170" height="80" rx="0" fill="#ffffff" stroke="#455A64" stroke-width="1.5"/>
<text x="325" y="392" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">Almacén de segmentos</text><text x="325" y="407" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">liberados</text>
<rect x="425" y="360" width="180" height="80" rx="0" fill="#ffffff" stroke="#455A64" stroke-width="1.5"/>
<text x="515" y="385" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">Oficina del taller:</text><text x="515" y="400" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">hojas de vida y CMMS</text><text x="515" y="415" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">caja de LOTO</text>
<line x1="300" y1="472" x2="100" y2="472" stroke="#43A047" stroke-width="4" marker-end="url(#fl)"/>
<line x1="360" y1="472" x2="560" y2="472" stroke="#43A047" stroke-width="4" marker-end="url(#fl)"/>
<text x="30" y="476" font-size="12" text-anchor="start" font-weight="bold" fill="#43A047">SALIDA</text>
<text x="632" y="476" font-size="12" text-anchor="end" font-weight="bold" fill="#43A047">SALIDA</text>
<text x="330" y="505" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">En campo (CC1 / CC2): sigue las zonas de la figura de LOTO de CC (MS-ACE-02).</text>
<rect x="650" y="62" width="340" height="470" rx="6" fill="#ffffff" stroke="#455A64" stroke-width="1"/>
<text x="660" y="80" font-size="14" text-anchor="start" font-weight="bold" fill="#212121">Leyenda</text>
<circle cx="671" cy="102" r="11" fill="#212121" stroke="#ffffff" stroke-width="2"/><text x="671" y="106" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text>
<text x="689" y="106" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Recepción y lavado del molde</text><text x="689" y="121" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">que sale de máquina</text>
<circle cx="671" cy="141" r="11" fill="#212121" stroke="#ffffff" stroke-width="2"/><text x="671" y="145" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text>
<text x="689" y="145" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Medición: conicidad, perfil,</text><text x="689" y="160" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">espesor de Cu, diagonales (MM-CC-01)</text>
<circle cx="671" cy="180" r="11" fill="#212121" stroke="#ffffff" stroke-width="2"/><text x="671" y="184" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text>
<text x="689" y="184" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Prueba de presión 1.5 × P operación,</text><text x="689" y="199" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">30 min, y termopares BOP</text>
<circle cx="671" cy="219" r="11" fill="#212121" stroke="#ffffff" stroke-width="2"/><text x="671" y="223" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text>
<text x="689" y="223" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Reconstrucción de segmentos: runout,</text><text x="689" y="238" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">desgaste, boquillas, gap (MM-CC-02)</text>
<circle cx="671" cy="258" r="11" fill="#212121" stroke="#ffffff" stroke-width="2"/><text x="671" y="262" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text>
<text x="689" y="262" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Máquinas herramienta con guardas</text>
<circle cx="671" cy="282" r="11" fill="#212121" stroke="#ffffff" stroke-width="2"/><text x="671" y="286" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">6</text>
<text x="689" y="286" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Izaje con grúa de 50 t y accesorios</text><text x="689" y="301" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">certificados (MS-ACE-04)</text>
<circle cx="671" cy="321" r="11" fill="#212121" stroke="#ffffff" stroke-width="2"/><text x="671" y="325" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">7</text>
<text x="689" y="325" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">En máquina: alineación ±0.3 mm</text><text x="689" y="340" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">y conicidad; Cs-137 solo con el ESR</text>
<rect x="650" y="540" width="340" height="206" rx="6" fill="#ffffff" stroke="#455A64" stroke-width="1"/>
<text x="660" y="558" font-size="14" text-anchor="start" font-weight="bold" fill="#212121">Zonas y rutas</text>
<rect x="660" y="570" width="26" height="16" rx="2" fill="#C62828" fill-opacity="0.28" stroke="#C62828" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="695" y="582" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Roja: metal líquido, carga suspendida,</text><text x="695" y="597" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">zona de exclusión. No entres sin permiso.</text>
<rect x="660" y="618" width="26" height="16" rx="2" fill="#F9A825" fill-opacity="0.28" stroke="#F9A825" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="695" y="630" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Amarilla: altura, espacio confinado, ruido,</text><text x="695" y="645" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">energía. Entra con permiso y LOTO.</text>
<rect x="660" y="666" width="26" height="16" rx="2" fill="#43A047" fill-opacity="0.28" stroke="#43A047" stroke-width="1.5" stroke-dasharray="6 3"/>
<text x="695" y="678" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Verde: talleres y guardia.</text><text x="695" y="693" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Riesgo controlado; EPP básico.</text>
<line x1="660" y1="720" x2="687" y2="720" stroke="#43A047" stroke-width="4" marker-end="url(#fl)"/>
<text x="695" y="724" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Ruta de escape al punto de reunión</text><text x="695" y="739" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">(canal 1 de radio = emergencia [Supuesto])</text>
<rect x="20" y="538" width="620" height="250" rx="6" fill="#ffffff" stroke="#455A64" stroke-width="1.5"/><text x="30" y="558" font-size="14" text-anchor="start" font-weight="bold" fill="#212121">Mis tolerancias de liberación (MM-CC-01, MM-CC-02)</text><path d="M50,580 L90,580 L96,720 L44,720 Z" fill="#FF8F00" stroke="#212121" stroke-width="2"/><text x="70" y="740" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">molde</text><text x="112" y="590" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Conicidad CC1 (angostas): 1.0–1.2 %/m ±0.05</text><text x="112" y="605" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Conicidad CC2: 0.8–1.0 %/m</text><text x="112" y="620" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">|D1 − D2| CC2 ≤ 0.5 mm</text><text x="112" y="635" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Cu placa CC1 &lt; 25 mm: desecha</text><text x="112" y="650" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Rayas &gt; 0.5 mm: rectifica</text><text x="112" y="665" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Prueba de presión: caída 0, 30 min</text><circle cx="420" cy="600" r="16" fill="#455A64" stroke="#212121" stroke-width="1.5"/><circle cx="420" cy="650" r="16" fill="#455A64" stroke="#212121" stroke-width="1.5"/><line x1="404" y1="625" x2="436" y2="625" stroke="#FF8F00" stroke-width="6"/><line x1="446" y1="616" x2="446" y2="634" stroke="#C62828" stroke-width="2"/><text x="420" y="690" font-size="12" text-anchor="middle" font-weight="normal" fill="#212121">gap</text><text x="465" y="590" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Gap CC1: tabla ±0.5 mm</text><text x="465" y="605" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Alineación: ±0.5 (obj. ≤ 0.3)</text><text x="465" y="620" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Molde → seg. 0: ±0.3 mm</text><text x="465" y="635" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Runout ≤ 0.2 mm</text><text x="465" y="650" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Desgaste Ø ≤ 2 mm</text><text x="465" y="665" font-size="12" text-anchor="start" font-weight="normal" fill="#212121">Boquillas tapadas ≤ 2 %</text>
<circle cx="185" cy="142" r="11" fill="#212121" stroke="#ffffff" stroke-width="2"/><text x="185" y="146" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text><circle cx="285" cy="210" r="11" fill="#212121" stroke="#ffffff" stroke-width="2"/><text x="285" y="214" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text><circle cx="285" cy="275" r="11" fill="#212121" stroke="#ffffff" stroke-width="2"/><text x="285" y="279" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text><circle cx="460" cy="210" r="11" fill="#212121" stroke="#ffffff" stroke-width="2"/><text x="460" y="214" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text><circle cx="70" cy="210" r="11" fill="#212121" stroke="#ffffff" stroke-width="2"/><text x="70" y="214" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text><circle cx="580" cy="142" r="11" fill="#212121" stroke="#ffffff" stroke-width="2"/><text x="580" y="146" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">6</text><circle cx="590" cy="425" r="11" fill="#212121" stroke="#ffffff" stroke-width="2"/><text x="590" y="429" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">7</text>
