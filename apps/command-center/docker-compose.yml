# Local PostgreSQL for the gateway:  docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fcc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fcc} # local dev only
      POSTGRES_DB: fcc
    ports:
      - "127.0.0.1:5432:5432" # local only
    volumes:
      - fcc-pg:/var/lib/postgresql/data
volumes:
  fcc-pg:
